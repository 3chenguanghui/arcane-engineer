/* ============================================================
   六、战斗与交互区
   ------------------------------------------------------------
   玩家移动、施法、科技装置、敌人 AI、弹道、掉落、伤害结算。
   所有战斗数值都从配置区读取，逻辑里不写死数字。
   ============================================================ */

/** 提示条自动隐藏的定时器句柄（避免连点刷屏） */
let toastTimer = 0;

/**
 * 顶部居中提示：用于“奥能不足 / 融合成功 / 楼层清空”等反馈
 * @param {string} message 提示文案
 * @param {string} type 类型：success / warn / error（空字符串为普通）
 */
function showToast(message, type) {
  if (!ui.toast) return;
  ui.toast.textContent = message;
  ui.toast.className = 'toast is-on' + (type ? ' is-' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    ui.toast.className = 'toast';
  }, 1600);
}

/**
 * 全屏闪光：受伤闪红、融合闪紫、清层闪青
 * @param {string} color 背景色（rgba / 十六进制均可）
 */
function flashScreen(color) {
  if (!ui.flash) return;
  ui.flash.style.background = color || 'rgba(255, 107, 127, 0.3)';
  ui.flash.classList.add('is-on');
  setTimeout(() => {
    ui.flash.classList.remove('is-on');
  }, 90);
}

/**
 * 触发屏幕震动（渲染时会在相机偏移上叠加随机抖动）
 * @param {number} power 抖动强度（像素）
 * @param {number} time 持续时间（秒）
 */
function triggerShake(power, time) {
  state.shake.power = Math.max(state.shake.power, power);
  state.shake.time = Math.max(state.shake.time, time);
}

/**
 * 在世界里加一段上浮文字（伤害数字、拾取提示）
 * @param {string} text 文本
 * @param {number} x 世界坐标 x
 * @param {number} y 世界坐标 y
 * @param {string} color 颜色
 * @param {number} size 字号
 */
function addFloat(text, x, y, color, size) {
  state.floats.push({
    text: text,
    x: x,
    y: y,
    color: color || '#dff4ff',
    size: size || 12,
    life: 0.75,
    maxLife: 0.75
  });
  // 浮动文字过多时丢掉最早的，避免内存与绘制压力
  if (state.floats.length > 40) state.floats.shift();
}

/**
 * 加一个扩散光环（冰环、冻结、死亡爆点等）
 * @param {number} x 圆心 x
 * @param {number} y 圆心 y
 * @param {number} radius 初始半径
 * @param {string} color 颜色
 * @param {number} grow 生命期内额外扩散的像素
 * @param {number} life 持续时间（秒）
 */
function addRing(x, y, radius, color, grow, life) {
  state.rings.push({
    x: x, y: y,
    radius: radius,
    grow: grow || 0,
    color: color || 'rgba(176, 133, 255, 0.7)',
    life: life || 0.4,
    maxLife: life || 0.4
  });
}

/**
 * 在指定位置爆出一圈粒子（命中、击杀、施法特效）
 * @param {number} x 中心 x
 * @param {number} y 中心 y
 * @param {string} color 粒子颜色
 * @param {number} count 粒子数量
 * @param {number} speed 最大初速度
 */
function addBurst(x, y, color, count, speed) {
  const total = count || 10;
  for (let i = 0; i < total; i += 1) {
    const angle = rand(0, Math.PI * 2);
    const power = rand(speed * 0.35, speed || 120);
    const life = rand(0.25, 0.55);
    state.particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * power,
      vy: Math.sin(angle) * power,
      size: rand(1.5, 3.5),
      color: color || '#b085ff',
      life: life,
      maxLife: life
    });
  }
  if (state.particles.length > 260) state.particles.splice(0, state.particles.length - 260);
}

/**
 * 加一条折线光效（雷击连锁、命中提示）
 * @param {Array} points 折线点数组 [{x,y}, ...]
 * @param {string} color 颜色
 * @param {number} life 存在时间
 */
function addBeam(points, color, life) {
  state.beams.push({
    points: points,
    color: color || '#a8e6ff',
    life: life || 0.26,
    maxLife: life || 0.26
  });
}

/**
 * 数值逼近辅助：每次最多移动 maxDelta，用于速度平滑加减速
 * @param {number} current 当前值
 * @param {number} target 目标值
 * @param {number} maxDelta 本次最大变化量
 * @returns {number} 变化后的值
 */
function approachValue(current, target, maxDelta) {
  if (current < target) return Math.min(target, current + maxDelta);
  if (current > target) return Math.max(target, current - maxDelta);
  return current;
}

/**
 * 取瞄准角度：鼠标移动过就朝鼠标，否则沿用角色当前朝向
 * @returns {number} 弧度
 */
function getAimAngle() {
  if (mouseState.moved) {
    return Math.atan2(mouseState.worldY - state.player.y, mouseState.worldX - state.player.x);
  }
  return state.player.angle;
}

/**
 * 在指定范围内找最近的敌人（可选排除已命中的 id 集合）
 * @param {number} x 起点 x
 * @param {number} y 起点 y
 * @param {number} maxRange 最大距离
 * @param {Set} exclude 需要跳过的敌人 id 集合
 * @returns {Object|null} 敌人对象或 null
 */
function findNearestEnemy(x, y, maxRange, exclude) {
  let best = null;
  let bestDist = maxRange;
  for (let i = 0; i < state.enemies.length; i += 1) {
    const enemy = state.enemies[i];
    if (!enemy) continue;
    if (exclude && exclude.has(enemy.id)) continue;
    const d = dist(x, y, enemy.x, enemy.y);
    if (d < bestDist) {
      bestDist = d;
      best = enemy;
    }
  }
  return best;
}

/**
 * 玩家更新：加减速移动、撞墙分轴滑动、奥能回复、被动回血与光环
 * @param {number} dt 时间步长
 */
function updatePlayer(dt) {
  const player = state.player;
  const keys = state.keys;

  // 1) 读取方向键，斜向移动做归一化，避免斜着走得比直着快
  let dirX = 0;
  let dirY = 0;
  if (keys.left) dirX -= 1;
  if (keys.right) dirX += 1;
  if (keys.up) dirY -= 1;
  if (keys.down) dirY += 1;
  if (dirX !== 0 && dirY !== 0) {
    dirX *= Math.SQRT1_2;
    dirY *= Math.SQRT1_2;
  }

  const maxSpeed = player.speed || GAME_CONFIG.playerSpeed;

  // 2) 有输入就加速逼近目标速度；松手就按摩擦指数衰减
  if (dirX !== 0 || dirY !== 0) {
    player.vx = approachValue(player.vx, dirX * maxSpeed, GAME_CONFIG.playerAccel * dt);
    player.vy = approachValue(player.vy, dirY * maxSpeed, GAME_CONFIG.playerAccel * dt);
  } else {
    const friction = Math.exp(-GAME_CONFIG.playerFriction * dt);
    player.vx *= friction;
    player.vy *= friction;
    if (Math.abs(player.vx) < 1) player.vx = 0;
    if (Math.abs(player.vy) < 1) player.vy = 0;
  }

  // 3) X / Y 分轴移动：撞墙只停下被挡住的那一轴，可以贴着墙滑行
  const nextX = player.x + player.vx * dt;
  if (isWalkableCircle(nextX, player.y, player.radius)) {
    player.x = nextX;
  } else {
    player.vx = 0;
  }

  const nextY = player.y + player.vy * dt;
  if (isWalkableCircle(player.x, nextY, player.radius)) {
    player.y = nextY;
  } else {
    player.vy = 0;
  }

  // 4) 朝向：优先朝鼠标；没动过鼠标时朝移动方向
  if (mouseState.moved) {
    player.angle = getAimAngle();
  } else if (dirX !== 0 || dirY !== 0) {
    player.angle = Math.atan2(dirY, dirX);
  }

  // 5) 奥能自然回复（基础上限 8/s，可被科技与奖励提高）
  player.aether = Math.min(player.aetherMax, player.aether + player.regen * dt);

  // 6) 纳米机器人被动：每秒缓慢回血
  if (state.ownedTech.includes('nanite')) {
    player.hp = Math.min(player.hpMax, player.hp + 1.2 * dt);
  }

  // 7) 再生力场（治疗符融合技）：6 秒内持续回血
  if (player.aura > 0) {
    player.aura = Math.max(0, player.aura - dt);
    player.hp = Math.min(player.hpMax, player.hp + 10 * dt);
  }

  // 8) 护盾与受伤闪白计时
  if (player.shield > 0) player.shield = Math.max(0, player.shield - dt);
  if (player.hitFlash > 0) player.hitFlash = Math.max(0, player.hitFlash - dt * 3);
}

/**
 * 计算某个魔法本次的实际伤害（叠加全局增伤与融合精通）
 * @param {Object} magic 魔法配置
 * @param {Object|null} fusion 融合配置
 * @returns {number} 伤害数值
 */
function getMagicDamage(magic, fusion) {
  let damage = (magic.damage || 0) * state.mods.damageMul;
  if (fusion) damage *= getFusionDamageBonus();
  return damage;
}

/**
 * 释放主技能（鼠标左键 / J）：统一做冷却与奥能检查，再按卡牌分发
 * @returns {boolean} 是否成功释放
 */
function castPrimary() {
  if (state.mode !== 'playing' || state.status !== 'playing') return false;

  const magic = getActiveMagic();

  // 未解锁的魔法不能释放
  if (!state.ownedMagic.includes(magic.id)) {
    showToast('该魔法尚未解锁：清层奖励里可以获得', 'warn');
    return false;
  }

  // 冷却未结束直接忽略，避免连按刷屏
  if ((state.cooldowns[magic.id] || 0) > 0.001) return false;

  // 雷击需要范围内有目标，否则不扣奥能也不进冷却
  if (magic.id === 'bolt' && !findNearestEnemy(state.player.x, state.player.y, 520)) {
    showToast('附近没有可连锁的目标', 'warn');
    return false;
  }

  // 奥能不足：给出明确提示
  if (state.player.aether < magic.cost) {
    showToast('奥能不足：' + magic.name + ' 需要 ' + magic.cost + ' 点', 'warn');
    return false;
  }

  state.player.aether -= magic.cost;
  state.cooldowns[magic.id] = magic.cooldown * state.mods.cooldownMul;
  state.player.angle = getAimAngle();

  const fusion = getFusionForMagic(magic.id);

  if (magic.id === 'fireball') castFireball(magic, fusion);
  else if (magic.id === 'frost') castFrost(magic, fusion);
  else if (magic.id === 'bolt') castBolt(magic, fusion);
  else castHeal(magic, fusion);

  updateHUD();
  return true;
}

/**
 * 火球：向瞄准方向发射投射物；融合后带追踪能力
 * @param {Object} magic 魔法配置
 * @param {Object|null} fusion 融合配置
 */
function castFireball(magic, fusion) {
  const player = state.player;
  const angle = getAimAngle();
  const speed = 430;
  const homing = fusion && fusion.id === 'homingFireball';
  const damage = getMagicDamage(magic, fusion);
  const color = homing ? '#ffc247' : '#b085ff';

  // 出手点只离角色 12px：拉得太远时，贴在身上的敌人会落在出手点背后，近身永远打不中
  const spawnX = player.x + Math.cos(angle) * 12;
  const spawnY = player.y + Math.sin(angle) * 12;

  // 贴身补正：有敌人已经压在身上（与角色圆重叠）时，火球出手即命中，
  // 避免“敌人贴脸时子弹从它身上穿过去”的挫败感（圆碰撞没有推挤，敌人会站进角色身体）
  let touching = null;
  let touchingDist = Infinity;
  for (let i = 0; i < state.enemies.length; i += 1) {
    const enemy = state.enemies[i];
    if (!enemy) continue;
    const d = dist(player.x, player.y, enemy.x, enemy.y);
    if (d <= player.radius + enemy.radius + 10 && d < touchingDist) {
      touching = enemy;
      touchingDist = d;
    }
  }

  if (touching) {
    addBurst(spawnX, spawnY, color, 10, 110);
    damageEnemy(touching, damage);
    if (homing) addFloat('贴身命中', player.x, player.y - 30, '#ffc247', 11);
    return;
  }

  state.projectiles.push({
    x: spawnX,
    y: spawnY,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: 8,
    damage: damage,
    life: 1.7,
    maxLife: 1.7,
    homing: !!homing,
    color: color
  });

  addBurst(spawnX, spawnY, color, 6, 90);
  if (homing) addFloat('追踪火球', player.x, player.y - 30, '#ffc247', 11);
}

/**
 * 冰环：以自身为中心的范围伤害；融合后范围更大并冻结
 * @param {Object} magic 魔法配置
 * @param {Object|null} fusion 融合配置
 */
function castFrost(magic, fusion) {
  const player = state.player;
  const isFrozen = fusion && fusion.id === 'frostField';
  const radius = isFrozen ? 150 : 96;
  const damage = getMagicDamage(magic, fusion);

  addRing(player.x, player.y, 8, isFrozen ? 'rgba(62, 230, 255, 0.85)' : 'rgba(116, 200, 255, 0.75)', radius, 0.42);
  addBurst(player.x, player.y, '#74c8ff', 14, 150);

  // 倒序遍历，击杀后从数组中删除元素也不会打乱索引
  for (let i = state.enemies.length - 1; i >= 0; i -= 1) {
    const enemy = state.enemies[i];
    if (!enemy) continue;
    if (dist(player.x, player.y, enemy.x, enemy.y) <= radius + enemy.radius) {
      damageEnemy(enemy, damage);
      if (isFrozen) enemy.frozenTime = Math.max(enemy.frozenTime, 1.5);
      else enemy.slowTime = Math.max(enemy.slowTime, 1.6);
      if (enemy) addRing(enemy.x, enemy.y, enemy.radius + 4, 'rgba(62, 230, 255, 0.55)', 12, 0.3);
    }
  }
}

/**
 * 雷击：先找最近目标，再向附近目标跳跃；融合后跳跃数 +3
 * @param {Object} magic 魔法配置
 * @param {Object|null} fusion 融合配置
 */
function castBolt(magic, fusion) {
  const player = state.player;
  const maxJumps = fusion ? 5 : 2;
  const hitIds = new Set();
  const points = [{ x: player.x, y: player.y }];
  let damage = getMagicDamage(magic, fusion);
  let fromX = player.x;
  let fromY = player.y;
  let target = findNearestEnemy(fromX, fromY, 520);
  let jumps = 0;

  while (target && jumps < maxJumps) {
    points.push({ x: target.x, y: target.y });
    hitIds.add(target.id);
    damageEnemy(target, damage);
    addBurst(target.x, target.y, '#a8e6ff', 8, 120);
    damage *= 0.85;  // 每跳衰减，避免连锁过头
    jumps += 1;
    fromX = target.x;
    fromY = target.y;
    target = findNearestEnemy(fromX, fromY, 240, hitIds);
  }

  addBeam(points, '#a8e6ff', 0.26);
  if (fusion) addFloat('连锁 ' + jumps, player.x, player.y - 30, '#a8e6ff', 11);
}

/**
 * 治疗符：普通形态立即回血；融合再生力场后改为 6 秒持续回血
 * @param {Object} magic 魔法配置
 * @param {Object|null} fusion 融合配置
 */
function castHeal(magic, fusion) {
  const player = state.player;
  const isAura = fusion && fusion.id === 'regenField';

  if (isAura) {
    player.aura = 6;
    addRing(player.x, player.y, 20, 'rgba(71, 232, 167, 0.8)', 74, 0.55);
    addBurst(player.x, player.y, '#47e8a7', 14, 130);
    addFloat('再生力场 6s', player.x, player.y - 32, '#47e8a7', 12);
    return;
  }

  const amount = Math.round(magic.heal || 30);
  const healed = Math.min(player.hpMax, player.hp + amount) - player.hp;
  player.hp += healed;
  addRing(player.x, player.y, 14, 'rgba(71, 232, 167, 0.6)', 30, 0.4);
  addFloat('+' + Math.round(healed) + ' HP', player.x, player.y - 30, '#47e8a7', 12);
}

/**
 * 触发当前科技装置（鼠标右键 / K）
 * @returns {boolean} 是否成功触发
 */
function castDevice() {
  if (state.mode !== 'playing' || state.status !== 'playing') return false;

  const tech = getActiveTech();
  if (!tech) {
    showToast('还没有装配科技装置：先在奖励里选一张科技卡', 'warn');
    return false;
  }
  if (state.deviceCooldown > 0.001) return false;

  const device = tech.device;
  const player = state.player;

  if (tech.id === 'concentrator') {
    const gained = Math.min(player.aetherMax, player.aether + (device.aether || 35)) - player.aether;
    player.aether += gained;
    addFloat('+' + Math.round(gained) + ' 奥能', player.x, player.y - 30, '#3ee6ff', 12);
    addBurst(player.x, player.y, '#3ee6ff', 10, 110);
  } else if (tech.id === 'field') {
    player.shield = device.shield || 4;
    addFloat('力场护盾 ' + player.shield + 's', player.x, player.y - 30, '#3ee6ff', 12);
    addRing(player.x, player.y, 18, 'rgba(62, 230, 255, 0.8)', 46, 0.45);
  } else if (tech.id === 'capacitor') {
    const gained = Math.min(player.aetherMax, player.aether + (device.aether || 60)) - player.aether;
    player.aether += gained;
    addFloat('+' + Math.round(gained) + ' 奥能', player.x, player.y - 30, '#3ee6ff', 12);
    addRing(player.x, player.y, 10, 'rgba(62, 230, 255, 0.9)', 60, 0.4);
  } else if (tech.id === 'nanite') {
    const healed = Math.min(player.hpMax, player.hp + (device.heal || 22)) - player.hp;
    player.hp += healed;
    addFloat('+' + Math.round(healed) + ' HP', player.x, player.y - 30, '#47e8a7', 12);
    addBurst(player.x, player.y, '#47e8a7', 10, 100);
  }

  state.deviceCooldown = device.cooldown * state.mods.cooldownMul;
  showToast('装置：' + device.name, 'success');
  updateHUD();
  return true;
}

/**
 * 融合（F）：把已持有的“魔法 + 科技”组合升级为融合技
 * @returns {boolean} 是否成功融合
 */
function tryFuse() {
  if (state.mode !== 'playing' || state.status !== 'playing') return false;

  const available = getAvailableFusions();
  if (!available.length) {
    showToast('没有可融合的组合：需要同时持有对应魔法与科技模块', 'warn');
    return false;
  }

  const fusion = available[0];
  state.fusions.push(fusion.id);
  addRing(state.player.x, state.player.y, 18, 'rgba(255, 194, 71, 0.9)', 70, 0.6);
  addBurst(state.player.x, state.player.y, '#ffc247', 18, 160);
  addFloat('融合：' + fusion.name, state.player.x, state.player.y - 34, '#ffc247', 13);
  flashScreen('rgba(255, 194, 71, 0.16)');
  showToast('融合完成：' + fusion.name + '，主技能行为已改变', 'success');

  renderDeck();
  updateHUD();
  return true;
}

/**
 * 切换主技能（数字键 1–4 / 点击卡片）
 * @param {string} magicId 魔法 id
 * @returns {boolean} 是否切换成功
 */
function selectMagic(magicId) {
  if (!MAGIC_BY_ID[magicId]) return false;
  if (!state.ownedMagic.includes(magicId)) {
    showToast('该魔法尚未解锁', 'warn');
    return false;
  }
  state.activeMagicId = magicId;
  renderDeck();
  updateHUD();
  return true;
}

/**
 * 切换当前科技装置（点击科技卡片）
 * @param {string} techId 科技 id
 * @returns {boolean} 是否切换成功
 */
function selectTech(techId) {
  if (!TECH_BY_ID[techId]) return false;
  if (!state.ownedTech.includes(techId)) {
    showToast('该科技模块尚未解锁', 'warn');
    return false;
  }
  state.activeTechId = techId;
  renderDeck();
  updateHUD();
  return true;
}

/**
 * 敌人 AI 更新：游荡体追击、射手控距开火、相位兽定时闪现
 * @param {number} dt 时间步长
 */
function updateEnemies(dt) {
  const player = state.player;

  for (let i = state.enemies.length - 1; i >= 0; i -= 1) {
    const enemy = state.enemies[i];
    if (!enemy) continue;

    // 各种计时器统一在这里衰减
    enemy.hitCooldown = Math.max(0, enemy.hitCooldown - dt);
    enemy.flash = Math.max(0, enemy.flash - dt * 5);
    enemy.slowTime = Math.max(0, enemy.slowTime - dt);
    enemy.frozenTime = Math.max(0, enemy.frozenTime - dt);
    enemy.wobble += dt * 0.9;

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const distance = Math.hypot(dx, dy) || 1;
    const frozen = enemy.frozenTime > 0;
    const slowFactor = enemy.slowTime > 0 ? 0.45 : 1;
    const speed = enemy.speed * slowFactor;
    const conf = ENEMY_BY_ID[enemy.typeId] || {};

    let moveX = 0;
    let moveY = 0;

    if (!frozen) {
      if (enemy.typeId === 'shooter') {
        // 射手傀儡：距离太近后退，太远靠近，中距离停下开火
        const keepRange = conf.keepRange || 190;
        if (distance < keepRange - 40) {
          moveX = -dx / distance;
          moveY = -dy / distance;
        } else if (distance > keepRange + 60) {
          moveX = dx / distance;
          moveY = dy / distance;
        }
        enemy.fireTimer -= dt;
        if (enemy.fireTimer <= 0 && distance < 470) {
          fireEnemyBullet(enemy, dx, dy, distance);
          enemy.fireTimer = (conf.fireInterval || 2.2) * rand(0.85, 1.15);
        }
      } else if (enemy.typeId === 'phaser') {
        // 相位兽：先追击，蓄力结束后闪现到玩家附近
        enemy.blinkTimer -= dt;
        if (enemy.blinkTimer <= 0) {
          const blinkAngle = Math.atan2(dy, dx) + rand(-0.45, 0.45);
          let nx = player.x - Math.cos(blinkAngle) * 108;
          let ny = player.y - Math.sin(blinkAngle) * 108;
          if (!isWalkableCircle(nx, ny, enemy.radius)) {
            nx = player.x - Math.cos(blinkAngle) * 160;
            ny = player.y - Math.sin(blinkAngle) * 160;
          }
          addRing(enemy.x, enemy.y, enemy.radius, 'rgba(209, 123, 255, 0.8)', 0, 0.3);
          if (isWalkableCircle(nx, ny, enemy.radius)) {
            enemy.x = nx;
            enemy.y = ny;
          }
          addRing(enemy.x, enemy.y, enemy.radius, 'rgba(209, 123, 255, 0.9)', 34, 0.42);
          addBurst(enemy.x, enemy.y, '#d17bff', 10, 120);
          enemy.blinkTimer = (conf.blinkInterval || 3.6) * rand(0.85, 1.1);
        } else {
          moveX = dx / distance;
          moveY = dy / distance;
        }
      } else {
        // 游荡体：直线贴上来
        moveX = dx / distance;
        moveY = dy / distance;
      }
    }

    // 分轴移动，撞墙只停下被挡住的那一轴
    if (moveX !== 0 || moveY !== 0) {
      const stepX = enemy.x + moveX * speed * dt;
      if (isWalkableCircle(stepX, enemy.y, enemy.radius)) enemy.x = stepX;
      const stepY = enemy.y + moveY * speed * dt;
      if (isWalkableCircle(enemy.x, stepY, enemy.radius)) enemy.y = stepY;
    }

    // 接触伤害：同一敌人按间隔掉血，避免一帧掉一大截
    if (distance < player.radius + enemy.radius + 4 && enemy.hitCooldown <= 0) {
      damagePlayer(enemy.damage, enemy.x, enemy.y);
      enemy.hitCooldown = GAME_CONFIG.contactInterval;
    }
  }
}

/**
 * 射手傀儡开火：朝玩家方向生成一枚敌方子弹（带轻微散射）
 * @param {Object} enemy 敌人
 * @param {number} dx 指向玩家的 x 差
 * @param {number} dy 指向玩家的 y 差
 * @param {number} distance 距离
 */
function fireEnemyBullet(enemy, dx, dy, distance) {
  const conf = ENEMY_BY_ID[enemy.typeId] || {};
  const speed = conf.bulletSpeed || 175;
  const angle = Math.atan2(dy, dx) + rand(-0.12, 0.12);

  state.bullets.push({
    x: enemy.x + Math.cos(angle) * enemy.radius,
    y: enemy.y + Math.sin(angle) * enemy.radius,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: 5,
    damage: enemy.damage,
    life: 3.2
  });
}

/**
 * 玩家弹道更新：追踪转向、撞墙消失、命中敌人结算
 * @param {number} dt 时间步长
 */
function updateProjectiles(dt) {
  for (let i = state.projectiles.length - 1; i >= 0; i -= 1) {
    const projectile = state.projectiles[i];
    projectile.life -= dt;
    if (projectile.life <= 0) {
      state.projectiles.splice(i, 1);
      continue;
    }

    // 追踪：每帧朝最近敌人转向，转向速度有上限（弧线而不是瞬移）
    if (projectile.homing) {
      const target = findNearestEnemy(projectile.x, projectile.y, 420);
      if (target) {
        const desired = Math.atan2(target.y - projectile.y, target.x - projectile.x);
        const current = Math.atan2(projectile.vy, projectile.vx);
        let diff = (desired - current + Math.PI * 2) % (Math.PI * 2);
        if (diff > Math.PI) diff -= Math.PI * 2;
        const maxTurn = 6 * dt;
        const nextAngle = current + clamp(diff, -maxTurn, maxTurn);
        const speed = Math.hypot(projectile.vx, projectile.vy);
        projectile.vx = Math.cos(nextAngle) * speed;
        projectile.vy = Math.sin(nextAngle) * speed;
      }
    }

    projectile.x += projectile.vx * dt;
    projectile.y += projectile.vy * dt;

    // 撞墙消失
    if (!isPointWalkable(projectile.x, projectile.y)) {
      addBurst(projectile.x, projectile.y, projectile.color, 6, 70);
      state.projectiles.splice(i, 1);
      continue;
    }

    // 命中检测：第一个碰到的敌人就结束这颗弹道
    let hitIndex = -1;
    for (let e = 0; e < state.enemies.length; e += 1) {
      const enemy = state.enemies[e];
      if (dist(projectile.x, projectile.y, enemy.x, enemy.y) <= projectile.radius + enemy.radius) {
        hitIndex = e;
        break;
      }
    }

    if (hitIndex >= 0) {
      const enemy = state.enemies[hitIndex];
      addBurst(projectile.x, projectile.y, projectile.color, 10, 120);
      damageEnemy(enemy, projectile.damage);
      state.projectiles.splice(i, 1);
    }
  }
}

/**
 * 敌方子弹更新：撞墙消失、命中玩家扣血
 * @param {number} dt 时间步长
 */
function updateBullets(dt) {
  for (let i = state.bullets.length - 1; i >= 0; i -= 1) {
    const bullet = state.bullets[i];
    bullet.life -= dt;
    bullet.x += bullet.vx * dt;
    bullet.y += bullet.vy * dt;

    if (bullet.life <= 0 || !isPointWalkable(bullet.x, bullet.y)) {
      state.bullets.splice(i, 1);
      continue;
    }

    if (dist(bullet.x, bullet.y, state.player.x, state.player.y) <= state.player.radius + bullet.radius) {
      damagePlayer(bullet.damage, bullet.x, bullet.y);
      addBurst(bullet.x, bullet.y, '#ff8a6b', 6, 80);
      state.bullets.splice(i, 1);
    }
  }
}

/**
 * 掉落物更新：靠近后磁吸飞向玩家，接触后结算效果
 * @param {number} dt 时间步长
 */
function updatePickups(dt) {
  const player = state.player;

  for (let i = state.pickups.length - 1; i >= 0; i -= 1) {
    const item = state.pickups[i];
    item.life -= dt;
    if (item.life <= 0) {
      state.pickups.splice(i, 1);
      continue;
    }

    const d = dist(item.x, item.y, player.x, player.y);
    if (d > 0.001 && d < 112) {
      const pull = 110 + (112 - d) * 3.2;
      item.x += (player.x - item.x) / d * pull * dt;
      item.y += (player.y - item.y) / d * pull * dt;
    }

    if (d < 28) {
      if (item.kind === 'aether') {
        const gained = Math.min(player.aetherMax, player.aether + (item.value || 22)) - player.aether;
        player.aether += gained;
        addFloat('+' + Math.round(gained) + ' 奥能', player.x, player.y - 26, '#3ee6ff', 11);
      } else {
        const gained = Math.min(player.hpMax, player.hp + (item.value || 8)) - player.hp;
        player.hp += gained;
        state.shards += 1;
        addFloat('+' + Math.round(gained) + ' HP', player.x, player.y - 26, '#47e8a7', 11);
      }
      state.pickups.splice(i, 1);
    }
  }
}

/**
 * 特效更新：光环扩散、粒子飘散、闪电淡出、浮动文字上浮
 * @param {number} dt 时间步长
 */
function updateEffects(dt) {
  for (let i = state.rings.length - 1; i >= 0; i -= 1) {
    const ring = state.rings[i];
    ring.life -= dt;
    if (ring.life <= 0) state.rings.splice(i, 1);
  }

  for (let i = state.particles.length - 1; i >= 0; i -= 1) {
    const particle = state.particles[i];
    particle.life -= dt;
    if (particle.life <= 0) {
      state.particles.splice(i, 1);
      continue;
    }
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    const drag = Math.exp(-3.2 * dt);
    particle.vx *= drag;
    particle.vy *= drag;
  }

  for (let i = state.beams.length - 1; i >= 0; i -= 1) {
    const beam = state.beams[i];
    beam.life -= dt;
    if (beam.life <= 0) state.beams.splice(i, 1);
  }

  for (let i = state.floats.length - 1; i >= 0; i -= 1) {
    const floatText = state.floats[i];
    floatText.life -= dt;
    floatText.y -= 32 * dt;
    if (floatText.life <= 0) state.floats.splice(i, 1);
  }
}

/**
 * 对敌人造成伤害（统一入口：扣血、闪白、飘字、死亡结算）
 * @param {Object} enemy 敌人
 * @param {number} amount 伤害值
 */
function damageEnemy(enemy, amount) {
  if (!enemy || enemy.hp <= 0) return;
  const damage = Math.max(1, Math.round(amount));
  enemy.hp -= damage;
  enemy.flash = 0.18;
  addFloat('-' + damage, enemy.x, enemy.y - enemy.radius - 10, '#ffd9df', 11);
  if (enemy.hp <= 0) killEnemy(enemy);
}

/**
 * 敌人死亡：移出数组、计数、爆点、掉落，并检查是否清场
 * @param {Object} enemy 敌人
 */
function killEnemy(enemy) {
  const index = state.enemies.indexOf(enemy);
  if (index === -1) return;

  state.enemies.splice(index, 1);
  state.kills += 1;

  addBurst(enemy.x, enemy.y, enemy.color, 12, 150);
  addRing(enemy.x, enemy.y, enemy.radius, hexToRgba(enemy.color, 0.85), 0, 0.36);
  addFloat('击杀 +1', enemy.x, enemy.y - enemy.radius - 16, '#ffe6a6', 11);
  dropLoot(enemy);

  updateHUD();
  checkFloorClear();
}

/**
 * 敌人掉落：概率掉奥能球 / 恢复碎片（磁吸拾取）
 * @param {Object} enemy 敌人
 */
function dropLoot(enemy) {
  const roll = Math.random();
  const x = enemy.x + rand(-10, 10);
  const y = enemy.y + rand(-10, 10);

  if (roll < 0.55) {
    state.pickups.push({ kind: 'aether', x: x, y: y, value: 22, life: 14 });
  } else if (roll < 0.8) {
    state.pickups.push({ kind: 'fragment', x: x, y: y, value: 8, life: 14 });
  }
}

/**
 * 玩家受伤：力场被动减伤、护盾减伤、扣血、震屏、死亡判定
 * @param {number} amount 原始伤害
 * @param {number} sourceX 伤害来源 x（用于未来击退，目前保留）
 * @param {number} sourceY 伤害来源 y
 */
function damagePlayer(amount, sourceX, sourceY) {
  if (state.mode !== 'playing' || state.status !== 'playing') return;
  const player = state.player;

  let damage = amount;

  // 力场发生器被动：受到伤害 -15%
  if (state.ownedTech.includes('field')) damage *= 0.85;
  // 主动护盾生效期间再减伤 50%
  if (player.shield > 0) damage *= 0.5;

  damage = Math.max(1, Math.round(damage));
  player.hp -= damage;
  player.hitFlash = 1;

  addFloat('-' + damage, player.x, player.y - 26, '#ff9aa7', 13);
  triggerShake(5, 0.18);

  if (player.hp <= 0) {
    player.hp = 0;
    loseGame(sourceX, sourceY);
  }

  updateHUD();
}
/* ============================================================
   七、流程与弹窗区
   ------------------------------------------------------------
   清场判定 → 三选一奖励 → 下楼；死亡结算；永久天赋购买；重开。
   ============================================================ */

/** 奖励类型对应的中文标签 */
const REWARD_TAGS = {
  magic: '魔法卡',
  tech: '科技模块',
  fusion: '融合技',
  relic: '通用遗物',
  supply: '保底补给'
};

/**
 * 检查本层是否已清场：是则解锁楼梯、发结晶、弹出三选一
 */
function checkFloorClear() {
  if (state.mode !== 'playing' || state.status !== 'playing') return;
  if (state.floorCleared || state.enemies.length > 0) return;

  state.floorCleared = true;
  if (state.stairs) state.stairs.active = true;
  state.floorsCleared += 1;

  // 每清一层：获得 1 枚永久结晶，并记录最佳楼层
  state.crystalsEarned = (state.crystalsEarned || 0) + 1;
  state.meta.crystals += 1;
  state.meta.bestFloor = Math.max(state.meta.bestFloor, state.floor);
  saveMeta();

  addRing(state.player.x, state.player.y, 16, 'rgba(255, 194, 71, 0.9)', 90, 0.7);
  flashScreen('rgba(255, 194, 71, 0.14)');
  showToast('第 ' + state.floor + ' 层清空：获得 1 枚奥术结晶', 'success');
  drawMinimap();

  // 清层即暂停世界并弹出三选一
  openReward('floor');
}

/**
 * 生成三选一奖励选项：过滤已持有的魔法/科技，优先展示可融合组合
 * @returns {Array} 3 个奖励选项
 */
function buildRewardOptions() {
  const pool = [];

  // 1) 尚未持有的魔法卡
  MAGIC_CONFIG.forEach((magic) => {
    if (!state.ownedMagic.includes(magic.id)) {
      pool.push({
        key: 'magic:' + magic.id,
        kind: 'magic',
        id: magic.id,
        name: magic.name,
        glyph: magic.glyph,
        desc: magic.desc,
        result: '解锁主技能 · 消耗 ' + magic.cost + ' 奥能'
      });
    }
  });

  // 2) 尚未持有的科技模块
  TECH_CONFIG.forEach((tech) => {
    if (!state.ownedTech.includes(tech.id)) {
      pool.push({
        key: 'tech:' + tech.id,
        kind: 'tech',
        id: tech.id,
        name: tech.name,
        glyph: tech.glyph,
        desc: tech.desc,
        result: '被动：' + tech.passive
      });
    }
  });

  // 3) 当前可以立即融合的组合（记忆点，优先展示）
  getAvailableFusions().forEach((fusion) => {
    pool.push({
      key: 'fusion:' + fusion.id,
      kind: 'fusion',
      id: fusion.id,
      name: fusion.name,
      glyph: fusion.glyph,
      desc: fusion.desc,
      result: '获得后按 F 融合激活'
    });
  });

  // 4) 可继续堆叠的通用遗物
  RELIC_CONFIG.forEach((relic) => {
    if (canTakeRelic(relic)) {
      const stack = (state.relics[relic.id] || 0) + 1;
      pool.push({
        key: 'relic:' + relic.id,
        kind: 'relic',
        id: relic.id,
        name: relic.name,
        glyph: relic.glyph,
        desc: relic.desc,
        result: '堆叠 ' + stack + ' / ' + (relic.maxStacks || 3)
      });
    }
  });

  // 洗牌后取前 3 个，保证每层体验不同
  const options = shuffleArray(pool.slice()).slice(0, 3);

  // 奖池不足 3 个时用保底补给补满，永远有得选
  while (options.length < 3) {
    options.push({
      key: 'supply:' + options.length,
      kind: 'supply',
      id: 'supply',
      name: '应急补给',
      glyph: '✚',
      desc: '立刻回复 25 生命与 30 奥能。',
      result: '保底选项'
    });
  }

  return options;
}

/**
 * 生成三选一弹窗的 HTML
 * @returns {string} 弹窗 HTML
 */
function buildRewardModalHtml() {
  const cards = state.upgradeOptions.map((option, index) => (
    '<button type="button" class="reward-card reward-' + option.kind + '"'
    + ' data-reward-key="' + option.key + '">'
    + '<div class="r-top"><span class="r-tag">' + (REWARD_TAGS[option.kind] || '奖励')
    + '</span><span class="r-key">' + (index + 1) + '</span></div>'
    + '<span class="r-glyph">' + option.glyph + '</span>'
    + '<span class="r-name">' + option.name + '</span>'
    + '<span class="r-desc">' + option.desc + '</span>'
    + '<span class="r-result">' + option.result + '</span>'
    + '</button>'
  )).join('');

  return '<div class="modal-kicker">FLOOR ' + state.floor + ' CLEARED</div>'
    + '<h2>楼层清空 · 三选一</h2>'
    + '<p class="modal-sub">本层敌人已全部清除。<b>选择一项后立即生效</b>，'
    + '随后走到金色楼梯按 <b>E</b> 下楼。</p>'
    + '<div class="reward-grid">' + cards + '</div>'
    + '<div class="modal-note">快捷键：<b>1 / 2 / 3</b> 直接选对应奖励。'
    + '已持有的魔法与科技不会再出现在奖池里。</div>';
}

/**
 * 打开三选一奖励弹窗，并把游戏切到暂停（reward）模式
 * @param {string} reason 触发原因（floor / debug）
 */
function openReward(reason) {
  if (!ui.modalLayer || !ui.modal) return;

  state.mode = 'reward';
  state.rewardReason = reason || 'floor';
  state.upgradeOptions = buildRewardOptions();

  ui.modal.className = 'modal';
  ui.modal.innerHTML = buildRewardModalHtml();
  ui.modalLayer.classList.remove('hidden');
  ui.modalLayer.setAttribute('aria-hidden', 'false');

  // 让第一张卡拿到焦点，方便键盘用户直接回车
  const firstCard = ui.modal.querySelector('[data-reward-key]');
  if (firstCard) firstCard.focus();

  updateHUD();
}

/**
 * 应用某个奖励（不含 UI 切换）
 * @param {Object} option 奖励选项
 */
function applyReward(option) {
  const player = state.player;

  if (option.kind === 'magic') {
    if (!state.ownedMagic.includes(option.id)) state.ownedMagic.push(option.id);
    state.activeMagicId = option.id;
  } else if (option.kind === 'tech') {
    if (!state.ownedTech.includes(option.id)) state.ownedTech.push(option.id);
    state.activeTechId = option.id;
    // 科技会改变奥能上限 / 回复，需要立刻重算派生属性
    applyMetaStats(state, false);
  } else if (option.kind === 'fusion') {
    if (!state.fusions.includes(option.id)) state.fusions.push(option.id);
  } else if (option.kind === 'relic') {
    const relic = RELIC_BY_ID[option.id];
    state.relics[option.id] = (state.relics[option.id] || 0) + 1;
    if (relic && typeof relic.apply === 'function') relic.apply();
  } else if (option.kind === 'supply') {
    player.hp = clamp(player.hp + 25, 0, player.hpMax);
    player.aether = clamp(player.aether + 30, 0, player.aetherMax);
  }
}

/**
 * 选中某个奖励：应用效果、关闭弹窗、回到游戏
 * @param {string} key 奖励唯一键
 * @returns {boolean} 是否选择成功
 */
function chooseReward(key) {
  if (state.mode !== 'reward') return false;

  const option = state.upgradeOptions.find((item) => item.key === key);
  if (!option) return false;

  applyReward(option);
  state.upgradeOptions = [];

  if (ui.modalLayer) {
    ui.modalLayer.classList.add('hidden');
    ui.modalLayer.setAttribute('aria-hidden', 'true');
  }

  state.mode = 'playing';
  showToast('已获得：' + option.name + ' · 立即生效', 'success');

  updateHUD();
  renderDeck();
  updateFusionHint();
  drawMinimap();
  return true;
}

/**
 * 按序号选择奖励（快捷键 1 / 2 / 3 使用）
 * @param {number} index 0 起始序号
 * @returns {boolean} 是否选择成功
 */
function chooseRewardByIndex(index) {
  const option = state.upgradeOptions[index];
  if (!option) return false;
  return chooseReward(option.key);
}

/**
 * 楼梯交互（E）：必须清场并走到楼梯附近
 * @returns {boolean} 是否成功下楼
 */
function interactStairs() {
  if (state.mode !== 'playing' || state.status !== 'playing') return false;

  if (!state.floorCleared || !state.stairs) {
    showToast('先清空本层全部敌人，金色楼梯才会出现', 'warn');
    return false;
  }

  const d = dist(state.player.x, state.player.y, state.stairs.x, state.stairs.y);
  if (d > 64) {
    showToast('走到金色楼梯附近再按 E（还差 ' + Math.round(d) + ' 格）', 'warn');
    return false;
  }

  descendFloor();
  return true;
}

/**
 * 下楼：层数 +1、重生成地图与敌人、奥能回满
 * @returns {boolean} 是否成功下楼
 */
function descendFloor() {
  if (state.mode !== 'playing' || state.status !== 'playing') return false;

  state.floor += 1;
  state.meta.bestFloor = Math.max(state.meta.bestFloor, state.floor);
  saveMeta();

  generateFloor(state.floor);
  state.player.aether = state.player.aetherMax;

  updateHUD();
  renderDeck();
  drawMinimap();
  flashScreen('rgba(62, 230, 255, 0.12)');
  showToast('进入第 ' + state.floor + ' 层：敌人更多、更强', 'success');
  return true;
}

/**
 * 打开规则 / 天赋面板（同时暂停游戏）
 * @returns {boolean} 是否打开
 */
function openRules() {
  if (!ui.rulesPanel) return false;
  if (state.mode !== 'playing') return false;

  buildRulesContent();
  renderTalents();
  state.mode = 'rules';
  ui.rulesPanel.classList.add('is-open');
  ui.rulesPanel.setAttribute('aria-hidden', 'false');
  if (ui.rulesClose) ui.rulesClose.focus();
  return true;
}

/**
 * 关闭规则面板并恢复游戏
 * @returns {boolean} 是否关闭
 */
function closeRules() {
  if (!ui.rulesPanel) return false;
  if (state.mode !== 'rules') return false;

  state.mode = 'playing';
  ui.rulesPanel.classList.remove('is-open');
  ui.rulesPanel.setAttribute('aria-hidden', 'true');
  return true;
}

/**
 * 切换规则面板（H 键 / 顶部按钮）
 */
function toggleRules() {
  if (state.mode === 'rules') closeRules();
  else if (state.mode === 'playing') openRules();
}

/**
 * 购买 / 升级一项永久天赋，消耗奥术结晶
 * @param {string} talentId 天赋 id
 * @returns {boolean} 是否购买成功
 */
function buyTalent(talentId) {
  const talent = TALENT_BY_ID[talentId];
  if (!talent) return false;

  const level = state.meta.talents[talentId] || 0;
  if (level >= GAME_CONFIG.talentMaxLevel) {
    showToast('该天赋已经满级', 'warn');
    return false;
  }
  if (state.meta.crystals < GAME_CONFIG.talentCost) {
    showToast('奥术结晶不足：清空楼层可获得结晶', 'warn');
    return false;
  }

  state.meta.crystals -= GAME_CONFIG.talentCost;
  state.meta.talents[talentId] = level + 1;
  saveMeta();

  // 天赋改动立即影响当前局属性（不会额外回满血，避免被当成免费治疗）
  applyMetaStats(state, false);
  updateHUD();
  renderDeck();
  renderTalents();

  // 结算界面里买天赋时，需要把结算面板也刷新一遍
  if (state.mode === 'result') showResult();

  showToast(talent.name + ' 提升至 Lv ' + (level + 1), 'success');
  return true;
}

/**
 * 死亡结算：锁定状态、记录最佳楼层、弹出结算面板
 * @param {number} sourceX 伤害来源 x
 * @param {number} sourceY 伤害来源 y
 */
function loseGame(sourceX, sourceY) {
  if (state.status !== 'playing') return;

  state.status = 'dead';
  state.mode = 'result';
  state.meta.bestFloor = Math.max(state.meta.bestFloor, state.floor);
  saveMeta();

  state.keys = {};
  flashScreen('rgba(255, 107, 127, 0.3)');
  triggerShake(10, 0.4);
  addBurst(state.player.x, state.player.y, '#ff6b7f', 26, 210);

  showResult();
}

/**
 * 构建死亡结算弹窗（含永久天赋升级区）
 */
function showResult() {
  if (!ui.modal || !ui.modalLayer) return;

  const survived = formatTime(state.elapsed);
  const earned = state.crystalsEarned || 0;

  ui.modal.className = 'modal result-modal';
  ui.modal.innerHTML = ''
    + '<div class="result-icon">×</div>'
    + '<div class="modal-kicker">RUN ENDED · FLOOR ' + state.floor + '</div>'
    + '<h2>机体失效</h2>'
    + '<p class="modal-sub">你在第 <b>' + state.floor + '</b> 层倒下。'
    + '本局获得的 <b>奥术结晶</b> 与天赋升级会永久保留。</p>'
    + '<div class="result-stats">'
    + '<div class="result-stat"><span>到达楼层</span><b>' + state.floor + '</b></div>'
    + '<div class="result-stat"><span>击杀</span><b>' + state.kills + '</b></div>'
    + '<div class="result-stat"><span>清空层数</span><b>' + state.floorsCleared + '</b></div>'
    + '<div class="result-stat"><span>存活时间</span><b>' + survived + '</b></div>'
    + '<div class="result-stat is-gold"><span>本局结晶</span><b>+' + earned + '</b></div>'
    + '<div class="result-stat is-gold"><span>累计结晶</span><b>' + state.meta.crystals + '</b></div>'
    + '</div>'
    + '<div class="talent-box">'
    + '<div class="talent-head"><h3>永久天赋</h3>'
    + '<span class="crystal-count">结晶 <b>' + state.meta.crystals + '</b></span></div>'
    + buildTalentRowsHtml()
    + '<div class="talent-note">在这里直接升级天赋，下一次开局立即生效；刷新页面也不会丢失。</div>'
    + '</div>'
    + '<button type="button" class="btn btn-primary btn-big" data-action="restart">'
    + '重新开始 · 第 1 层 <kbd>R</kbd></button>'
    + '<div class="result-hint">提示：按 R 或点击上方按钮重开；H 可以查看规则。</div>';

  ui.modalLayer.classList.remove('hidden');
  ui.modalLayer.setAttribute('aria-hidden', 'false');

  const restartBtn = ui.modal.querySelector('[data-action="restart"]');
  if (restartBtn) restartBtn.focus();
}

/**
 * 重开一局：保留永久天赋与结晶，重置本局所有内容
 */
function restartRun() {
  if (ui.modalLayer) {
    ui.modalLayer.classList.add('hidden');
    ui.modalLayer.setAttribute('aria-hidden', 'true');
  }
  if (ui.rulesPanel) {
    ui.rulesPanel.classList.remove('is-open');
    ui.rulesPanel.setAttribute('aria-hidden', 'true');
  }

  const keepMeta = state && state.meta ? state.meta : loadMeta();

  // createInitialState 会读取旧 state.meta，因此天赋能带上；这里再显式绑定一次更稳妥
  state = createInitialState();
  state.meta = keepMeta;
  state.meta.runs += 1;

  generateFloor(1);
  saveMeta();

  updateHUD();
  renderDeck();
  renderTalents();
  drawMinimap();

  showToast('新一局开始：清空全部敌人后按 E 下楼', 'success');
}
/* ============================================================
   八、输入、主循环与初始化
   ------------------------------------------------------------
   键盘 / 鼠标绑定、每帧 update、requestAnimationFrame 主循环、
   启动入口，以及给浏览器自动化测试用的调试接口。
   ============================================================ */

/** 上一帧时间戳（用于计算 dt） */
let lastFrameTime = 0;

/** HUD 与小地图的刷新节流计时（0.05s 刷新一次，约 20Hz） */
let uiTimer = 0;

/** 简易帧率采样，用于调试接口与性能检查 */
const perfState = { frames: 0, fps: 0, sampleAt: 0 };

/**
 * 把键盘事件映射成游戏动作，屏蔽具体按键名
 * @param {KeyboardEvent} event 键盘事件
 * @returns {string|null} 动作名
 */
function keyToAction(event) {
  const normalized = String(event.key || '').toLowerCase();
  const map = {
    w: 'up', a: 'left', s: 'down', d: 'right',
    arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
    j: 'primary', k: 'device', f: 'fuse', e: 'descend',
    h: 'rules', r: 'restart',
    '1': 'magic1', '2': 'magic2', '3': 'magic3', '4': 'magic4'
  };
  return map[normalized] || null;
}

/**
 * 键盘按下：移动键只记录状态；功能键直接触发对应逻辑
 * @param {KeyboardEvent} event 键盘事件
 */
function handleKeyDown(event) {
  if (!state) return;
  const action = keyToAction(event);
  if (!action) return;

  const isMove = action === 'up' || action === 'down' || action === 'left' || action === 'right';
  if (isMove) {
    state.keys[action] = true;
    event.preventDefault();
    return;
  }
  event.preventDefault();

  // 三选一弹窗：1 / 2 / 3 直接选奖励
  if (state.mode === 'reward') {
    if (action === 'magic1') chooseRewardByIndex(0);
    else if (action === 'magic2') chooseRewardByIndex(1);
    else if (action === 'magic3') chooseRewardByIndex(2);
    return;
  }

  // 规则面板：H 关闭，R 重开，其他按键不响应
  if (state.mode === 'rules') {
    if (action === 'rules') closeRules();
    else if (action === 'restart') restartRun();
    return;
  }

  // 结算界面：R 重开
  if (state.mode === 'result') {
    if (action === 'restart') restartRun();
    return;
  }

  if (state.mode !== 'playing') return;

  if (action === 'primary') castPrimary();
  else if (action === 'device') castDevice();
  else if (action === 'fuse') tryFuse();
  else if (action === 'descend') interactStairs();
  else if (action === 'rules') toggleRules();
  else if (action === 'restart') restartRun();
  else if (action === 'magic1') selectMagic(MAGIC_CONFIG[0].id);
  else if (action === 'magic2') selectMagic(MAGIC_CONFIG[1].id);
  else if (action === 'magic3') selectMagic(MAGIC_CONFIG[2].id);
  else if (action === 'magic4') selectMagic(MAGIC_CONFIG[3].id);
}

/**
 * 键盘松开：清除移动键状态，角色靠摩擦自然停下
 * @param {KeyboardEvent} event 键盘事件
 */
function handleKeyUp(event) {
  if (!state) return;
  const action = keyToAction(event);
  if (!action) return;
  if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
    state.keys[action] = false;
  }
}

/**
 * 鼠标移动：把屏幕坐标换算成世界坐标，供瞄准与施法使用
 * @param {MouseEvent} event 鼠标事件
 */
function updateMouseWorld(event) {
  if (!canvas || !state) return;
  const rect = canvas.getBoundingClientRect();
  mouseState.x = event.clientX - rect.left;
  mouseState.y = event.clientY - rect.top;
  mouseState.worldX = mouseState.x + state.cam.x;
  mouseState.worldY = mouseState.y + state.cam.y;
  mouseState.moved = true;
}

/**
 * 鼠标按下：左键主技能，右键科技装置
 * @param {MouseEvent} event 鼠标事件
 */
function handleCanvasMouseDown(event) {
  if (!state || state.mode !== 'playing' || state.status !== 'playing') return;
  updateMouseWorld(event);

  if (event.button === 0) {
    castPrimary();
  } else if (event.button === 2) {
    event.preventDefault();
    castDevice();
  }
}

/**
 * 绑定所有输入与按钮事件（只绑定一次）
 */
function bindEvents() {
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('keyup', handleKeyUp);

  canvas.addEventListener('mousemove', updateMouseWorld);
  canvas.addEventListener('mousedown', handleCanvasMouseDown);
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('blur', () => {
    if (state) state.keys = {};
  });
  document.addEventListener('visibilitychange', () => {
    if (state && document.hidden) state.keys = {};
  });

  // 顶部按钮
  if (ui.btnRules) ui.btnRules.addEventListener('click', toggleRules);
  if (ui.btnRestart) ui.btnRestart.addEventListener('click', restartRun);

  // 规则面板
  if (ui.rulesClose) ui.rulesClose.addEventListener('click', closeRules);
  if (ui.rulesPanel) {
    ui.rulesPanel.addEventListener('mousedown', (event) => {
      if (event.target === ui.rulesPanel) closeRules();
    });
  }

  // 底部卡组：事件委托，点击卡片切换技能 / 装置
  if (ui.magicRow) {
    ui.magicRow.addEventListener('click', (event) => {
      const button = event.target.closest('[data-magic-id]');
      if (button) selectMagic(button.getAttribute('data-magic-id'));
    });
  }
  if (ui.techRow) {
    ui.techRow.addEventListener('click', (event) => {
      const button = event.target.closest('[data-tech-id]');
      if (button) selectTech(button.getAttribute('data-tech-id'));
    });
  }

  // 规则面板里的天赋升级按钮
  if (ui.talentsBody) {
    ui.talentsBody.addEventListener('click', (event) => {
      const button = event.target.closest('[data-talent-id]');
      if (button) buyTalent(button.getAttribute('data-talent-id'));
    });
  }

  // 弹窗内的事件委托（奖励卡、天赋升级、重开按钮）
  if (ui.modal) {
    ui.modal.addEventListener('click', (event) => {
      const rewardButton = event.target.closest('[data-reward-key]');
      if (rewardButton) {
        chooseReward(rewardButton.getAttribute('data-reward-key'));
        return;
      }
      const talentButton = event.target.closest('[data-talent-id]');
      if (talentButton) {
        buyTalent(talentButton.getAttribute('data-talent-id'));
        return;
      }
      const restartButton = event.target.closest('[data-action="restart"]');
      if (restartButton) restartRun();
    });
  }
}

/**
 * 统一推进所有冷却计时（魔法卡与装置）
 * @param {number} dt 时间步长
 */
function tickCooldowns(dt) {
  Object.keys(state.cooldowns).forEach((id) => {
    if (state.cooldowns[id] > 0) {
      state.cooldowns[id] = Math.max(0, state.cooldowns[id] - dt);
    }
  });
  if (state.deviceCooldown > 0) {
    state.deviceCooldown = Math.max(0, state.deviceCooldown - dt);
  }
}

/**
 * 每帧逻辑更新：只有 playing 状态才推进世界，暂停时冻结
 * @param {number} dt 时间步长（秒，已限制上限）
 */
function update(dt) {
  if (!state) return;

  // 屏幕震动倒计时
  if (state.shake.time > 0) {
    state.shake.time = Math.max(0, state.shake.time - dt);
    if (state.shake.time <= 0) state.shake.power = 0;
  }

  const running = state.mode === 'playing' && state.status === 'playing';

  if (running) {
    state.elapsed += dt;
    tickCooldowns(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateEffects(dt);
    updateCamera(dt);
  } else {
    // 暂停时让相机极其缓慢地归位，避免窗口尺寸变化后画面错位
    updateCamera(dt * 0.2);
  }

  // HUD 与小地图不需要每帧重排，20Hz 足够且更省性能
  uiTimer += dt;
  if (uiTimer >= 0.05) {
    uiTimer = 0;
    updateHUD();
    drawMinimap();
    updateDeckCooldowns();
  }
}

/**
 * 记录一次运行时错误（去重），供自动化测试读取
 * @param {*} error 错误对象或消息
 */
function recordError(error) {
  const message = error && error.stack ? error.stack : String(error);
  if (!window.__errors) window.__errors = [];
  if (window.__errors.indexOf(message) === -1) window.__errors.push(message);
  // 仍然打到控制台，方便人工排查
  console.error('[arcane]', error);
}

/**
 * 主循环：requestAnimationFrame + dt 上限，保证切后台回来不会瞬移
 * @param {number} now 当前时间戳（毫秒）
 */
function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;

  try {
    update(dt);
    render();
  } catch (error) {
    recordError(error);
  }

  // 帧率采样（每 1 秒更新一次）
  perfState.frames += 1;
  if (!perfState.sampleAt) perfState.sampleAt = now;
  if (now - perfState.sampleAt >= 1000) {
    perfState.fps = Math.round(perfState.frames * 1000 / (now - perfState.sampleAt));
    perfState.frames = 0;
    perfState.sampleAt = now;
  }

  requestAnimationFrame(loop);
}

/**
 * 安装浏览器自动化测试用的调试接口（不影响正常玩家）
 */
function installDebugApi() {
  window.__roamDebug = {
    /** 读取当前局关键状态快照 */
    getState() {
      return {
        mode: state.mode,
        status: state.status,
        floor: state.floor,
        hp: Math.round(state.player.hp),
        hpMax: state.player.hpMax,
        aether: Math.round(state.player.aether),
        aetherMax: state.player.aetherMax,
        player: { x: state.player.x, y: state.player.y, vx: state.player.vx, vy: state.player.vy },
        cam: { x: state.cam.x, y: state.cam.y },
        view: { w: state.viewW, h: state.viewH },
        elapsed: state.elapsed,
        shield: state.player.shield,
        aura: state.player.aura,
        projectilesInfo: state.projectiles.map((projectile) => ({
          homing: !!projectile.homing,
          x: Math.round(projectile.x),
          y: Math.round(projectile.y),
          angle: Math.atan2(projectile.vy, projectile.vx)
        })),
        enemies: state.enemies.length,
        enemyList: state.enemies.map((enemy) => ({
          id: enemy.id, typeId: enemy.typeId, hp: Math.round(enemy.hp),
          x: Math.round(enemy.x), y: Math.round(enemy.y)
        })),
        floorCleared: state.floorCleared,
        stairs: state.stairs ? { x: state.stairs.x, y: state.stairs.y, active: state.stairs.active } : null,
        spawnRoom: state.rooms.length ? (function () {
          const room = getSpawnRoom();
          return { x: room.x, y: room.y, w: room.w, h: room.h, cx: room.cx, cy: room.cy };
        })() : null,
        ownedMagic: state.ownedMagic.slice(),
        ownedTech: state.ownedTech.slice(),
        fusions: state.fusions.slice(),
        activeMagicId: state.activeMagicId,
        activeTechId: state.activeTechId,
        cooldowns: JSON.parse(JSON.stringify(state.cooldowns)),
        deviceCooldown: state.deviceCooldown,
        kills: state.kills,
        floorsCleared: state.floorsCleared,
        crystalsEarned: state.crystalsEarned || 0,
        projectiles: state.projectiles.length,
        bullets: state.bullets.length,
        pickups: state.pickups.length,
        mods: JSON.parse(JSON.stringify(state.mods)),
        relics: JSON.parse(JSON.stringify(state.relics)),
        options: state.upgradeOptions.map((option) => option.key),
        meta: JSON.parse(JSON.stringify(state.meta)),
        fps: perfState.fps
      };
    },
    /** 传送到指定世界坐标（不可站立则返回 false） */
    teleport(x, y) {
      if (!isWalkableCircle(x, y, state.player.radius)) return false;
      state.player.x = x;
      state.player.y = y;
      state.player.vx = 0;
      state.player.vy = 0;
      snapCamera();
      return true;
    },
    /** 把角色放回出生房间中心（测试与兜底用） */
    centerPlayer() {
      const room = getSpawnRoom();
      state.player.x = room.cx;
      state.player.y = room.cy;
      state.player.vx = 0;
      state.player.vy = 0;
      snapCamera();
      return { x: room.cx, y: room.cy };
    },
    /** 直接跳到指定楼层（会重新生成地图） */
    setFloor(floorNumber) {
      state.floor = Math.max(1, Math.floor(floorNumber));
      generateFloor(state.floor);
      updateHUD();
      renderDeck();
      drawMinimap();
      return state.floor;
    },
    /** 在玩家附近生成一个敌人 */
    spawnEnemy(typeId, offsetX, offsetY) {
      const enemy = spawnEnemyNearPlayer(typeId, offsetX, offsetY);
      return enemy.id;
    },
    /** 击杀所有敌人（会自然触发清场与奖励弹窗） */
    killAllEnemies() {
      let guard = 0;
      while (state.enemies.length > 0 && guard < 200) {
        guard += 1;
        killEnemy(state.enemies[0]);
      }
      return state.enemies.length;
    },
    /** killAllEnemies 的别名 */
    clearFloor() {
      return this.killAllEnemies();
    },
    /** 修改生命 / 奥能 */
    setHp(value) {
      state.player.hp = clamp(Number(value) || 0, 0, state.player.hpMax);
      updateHUD();
      return state.player.hp;
    },
    setAether(value) {
      state.player.aether = clamp(Number(value) || 0, 0, state.player.aetherMax);
      updateHUD();
      return state.player.aether;
    },
    /** 释放主技能，返回是否成功 */
    cast() {
      return castPrimary();
    },
    /** 触发科技装置 */
    castDevice() {
      return castDevice();
    },
    /** 融合 */
    fuse() {
      return tryFuse();
    },
    /** 切换魔法 / 科技 */
    selectMagic(magicId) {
      return selectMagic(magicId);
    },
    selectTech(techId) {
      return selectTech(techId);
    },
    /** 直接给予魔法 / 科技（测试用，绕过奖励） */
    grantMagic(magicId) {
      if (!MAGIC_BY_ID[magicId]) return false;
      if (!state.ownedMagic.includes(magicId)) state.ownedMagic.push(magicId);
      state.activeMagicId = magicId;
      renderDeck();
      updateHUD();
      return true;
    },
    grantTech(techId) {
      if (!TECH_BY_ID[techId]) return false;
      if (!state.ownedTech.includes(techId)) state.ownedTech.push(techId);
      state.activeTechId = techId;
      applyMetaStats(state, false);
      renderDeck();
      updateHUD();
      return true;
    },
    /** 打开 / 选择奖励 */
    openReward() {
      openReward('debug');
      return state.upgradeOptions.map((option) => option.key);
    },
    chooseReward(key) {
      return chooseReward(key);
    },
    /** 下楼（跳过距离检测） */
    descend() {
      return descendFloor();
    },
    /** 造成伤害（测试护盾 / 减伤） */
    damagePlayer(amount) {
      damagePlayer(Number(amount) || 5, state.player.x, state.player.y);
      return Math.round(state.player.hp);
    },
    forceDeath() {
      state.player.hp = 0;
      loseGame(state.player.x, state.player.y);
      return state.status;
    },
    /** 永久资源与天赋 */
    addCrystal(count) {
      state.meta.crystals += Math.max(0, Math.floor(Number(count) || 0));
      saveMeta();
      updateHUD();
      renderTalents();
      return state.meta.crystals;
    },
    buyTalent(talentId) {
      return buyTalent(talentId);
    },
    resetMeta() {
      state.meta = defaultMeta();
      saveMeta();
      applyMetaStats(state, true);
      updateHUD();
      renderTalents();
      return JSON.parse(JSON.stringify(state.meta));
    },
    /** 检查某个点能否站立（墙碰撞测试） */
    walkableAt(x, y) {
      return isWalkableCircle(Number(x), Number(y), state.player.radius);
    },
    /** 当前注入的错误列表 */
    errors() {
      return window.__errors || [];
    },
    /** 重开（测试用） */
    restart() {
      restartRun();
      return state.mode;
    }
  };
}

/**
 * 启动入口：抓 DOM、建状态、生成第一层、绑定事件、开主循环
 */
function init() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  minimap = document.getElementById('minimap');
  minimapCtx = minimap.getContext('2d');

  cacheUi();

  // 运行时错误收集（方便「无控制台报错」验收）
  window.__errors = [];
  window.addEventListener('error', (event) => recordError(event.error || event.message));
  window.addEventListener('unhandledrejection', (event) => recordError(event.reason));

  state = createInitialState();
  state.meta.runs += 1;
  state.viewW = window.innerWidth;
  state.viewH = window.innerHeight;

  resizeCanvas();
  generateFloor(1);
  placePlayerAtSpawn();

  bindEvents();
  buildRulesContent();
  renderTalents();
  renderDeck();
  updateHUD();
  drawMinimap();
  saveMeta();

  installDebugApi();

  showToast('第 1 层：WASD 移动 · 左键 / J 施法 · 清场后按 E 下楼', 'success');

  requestAnimationFrame(loop);
}

// 页面脚本在 body 末尾，DOM 已经就绪，可以直接启动
init();

</script>
