<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奥术工程师 · ARCANE ENGINEER</title>
<style>
  /* ============================================================
     样式区：克制深色主题（科技青 + 魔法紫 + 强调金）
     数字统一等宽字体，图标统一几何线形，不使用 emoji
     ============================================================ */
  :root {
    --bg: #070b14;
    --panel: #0e1626;
    --panel-2: #121d33;
    --line: rgba(120, 160, 220, 0.16);
    --line-strong: rgba(120, 190, 255, 0.36);
    --text: #dcecff;
    --muted: #7f95b8;
    --tech: #3ee6ff;       /* 科技青：UI / 装置 / 科技弹道 */
    --magic: #b085ff;      /* 魔法紫：符文 / 法术 / 范围特效 */
    --gold: #ffc247;       /* 强调金：楼梯 / 掉落 / 关键数字 */
    --good: #47e8a7;
    --bad: #ff6b7f;
    --radius: 12px;
    --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
    --sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }

  .stage { position: fixed; inset: 0; }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* 暗角：让画面聚焦中心，制造“奥术深井”质感 */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(circle at 50% 46%, transparent 40%, rgba(2, 4, 10, 0.72) 100%);
    box-shadow: inset 0 0 170px rgba(0, 0, 0, 0.6);
  }

  /* ---------- 顶部 HUD ---------- */
  .hud-top {
    position: absolute;
    z-index: 20;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 13px 22px 18px;
    background: linear-gradient(180deg, rgba(7, 11, 20, 0.96), rgba(7, 11, 20, 0.5) 72%, transparent);
    pointer-events: none;
  }
  .brand { min-width: 196px; }
  .logo {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #eaf7ff;
    text-shadow: 0 0 20px rgba(62, 230, 255, 0.35);
    white-space: nowrap;
  }
  .logo b { color: var(--magic); font-weight: 800; }
  .brand .sub {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  .hud-readouts {
    display: flex;
    align-items: center;
    gap: 18px;
    flex: 1;
    min-width: 0;
  }
  .readout {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 14px;
    border-left: 1px solid var(--line);
    min-width: 74px;
  }
  .readout:first-child { border-left: 0; padding-left: 2px; }
  .readout > span {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-family: var(--mono);
    white-space: nowrap;
  }
  .readout > b {
    font-family: var(--mono);
    font-size: 21px;
    line-height: 1.1;
    color: #dff4ff;
  }
  .readout > b em {
    font-style: normal;
    font-size: 11px;
    color: var(--muted);
    margin-left: 3px;
    font-weight: 400;
  }
  .readout > i.readout-enemy {
    display: block;
    font-style: normal;
    font-size: 11px;
    line-height: 1.2;
    color: #9db5d6;
    font-weight: 400;
    letter-spacing: 0.03em;
    white-space: nowrap;
    margin-top: 2px;
  }
  .readout-best > b, .readout-crystal > b { color: var(--gold); }

  .bar-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 186px;
    padding: 4px 0;
  }
  .bar-group .bar-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .bar-group .bar-label b { color: #d6ecff; font-size: 11px; font-weight: 600; }
  .bar {
    position: relative;
    height: 9px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(90, 130, 180, 0.14);
    border: 1px solid rgba(120, 170, 230, 0.16);
  }
  .bar > i {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    border-radius: inherit;
    transition: width 0.22s ease;
  }
  .bar-hp > i {
    background: linear-gradient(90deg, #ff8a6b, var(--gold));
    box-shadow: 0 0 12px rgba(255, 170, 90, 0.4);
  }
  .bar-aether > i {
    background: linear-gradient(90deg, var(--tech), var(--magic));
    box-shadow: 0 0 12px rgba(120, 160, 255, 0.35);
  }
  .bar.is-low > i { animation: lowPulse 0.9s ease-in-out infinite; }
  @keyframes lowPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  .hud-actions {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: rgba(16, 28, 46, 0.8);
    color: #cfe6ff;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: rgba(62, 230, 255, 0.75); background: rgba(22, 40, 62, 0.9); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--tech); outline-offset: 2px; }
  .btn kbd {
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid rgba(120, 170, 230, 0.28);
    color: var(--muted);
    background: rgba(6, 12, 22, 0.7);
  }
  .btn-primary {
    border-color: rgba(62, 230, 255, 0.6);
    background: linear-gradient(180deg, rgba(20, 60, 84, 0.9), rgba(10, 30, 48, 0.9));
    color: #d6f8ff;
  }
  .btn-magic {
    border-color: rgba(176, 133, 255, 0.5);
    background: rgba(40, 24, 66, 0.72);
    color: #e6d6ff;
  }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ---------- 底部卡组栏 ---------- */
  .hud-deck {
    position: absolute;
    z-index: 20;
    left: 18px;
    right: 18px;
    bottom: 14px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 316px;
    gap: 16px;
    padding: 12px 16px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(12, 20, 34, 0.94), rgba(8, 13, 23, 0.96));
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    pointer-events: none;
  }
  .hud-deck::before, .hud-deck::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: rgba(62, 230, 255, 0.35);
    border-style: solid;
    pointer-events: none;
  }
  .hud-deck::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; border-top-left-radius: 9px; }
  .hud-deck::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; border-bottom-right-radius: 9px; }

  .deck-block { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .deck-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #a9c2e0;
    font-family: var(--mono);
  }
  .deck-title i { color: var(--muted); font-style: normal; font-size: 10px; letter-spacing: 0.04em; }
  .card-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    pointer-events: auto;
  }

  .mini-card {
    position: relative;
    min-height: 66px;
    padding: 7px 8px 6px;
    border-radius: 9px;
    border: 1px solid rgba(120, 160, 220, 0.2);
    background: linear-gradient(180deg, rgba(20, 34, 54, 0.9), rgba(10, 17, 30, 0.9));
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
  }
  .mini-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .mini-card .m-glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1px solid currentColor;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1;
    margin-right: 5px;
    vertical-align: middle;
  }
  .mini-card .m-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #dcecff;
    vertical-align: middle;
  }
  .mini-card .m-sub {
    display: block;
    margin-top: 5px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-card.magic { color: var(--magic); }
  .mini-card.tech { color: var(--tech); }
  .mini-card.is-active {
    border-color: currentColor;
    box-shadow: 0 0 0 1px currentColor, 0 0 20px rgba(176, 133, 255, 0.18);
    background: linear-gradient(180deg, rgba(38, 30, 62, 0.92), rgba(14, 18, 34, 0.94));
  }
  .mini-card.tech.is-active { background: linear-gradient(180deg, rgba(16, 44, 58, 0.92), rgba(10, 20, 32, 0.94)); }
  .mini-card.is-locked { opacity: 0.4; cursor: default; }
  .mini-card.is-locked:hover { transform: none; border-color: rgba(120, 160, 220, 0.2); }
  .mini-card .m-key {
    position: absolute;
    right: 6px;
    top: 5px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    border: 1px solid rgba(120, 170, 230, 0.2);
    border-radius: 3px;
    padding: 0 3px;
    line-height: 1.4;
  }
  .mini-card .m-cd {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 0%;
    background: rgba(3, 8, 16, 0.72);
    pointer-events: none;
    transition: height 0.1s linear;
  }
  .mini-card .m-cd-text {
    position: absolute;
    right: 6px;
    bottom: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: #ffd6d6;
    opacity: 0;
  }
  .mini-card.is-cooling .m-cd-text { opacity: 1; }
  .mini-card .m-fused {
    position: absolute;
    left: 7px;
    bottom: 4px;
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.08em;
    color: var(--gold);
  }

  .deck-side { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .fusion-hint {
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px dashed rgba(255, 194, 71, 0.35);
    background: rgba(34, 26, 10, 0.45);
    font-size: 11px;
    color: #ffde9a;
    line-height: 1.5;
    min-height: 44px;
  }
  .fusion-hint b { color: #fff0c8; }
  .fusion-hint.is-ready { border-style: solid; animation: readyGlow 1.6s ease-in-out infinite; }
  @keyframes readyGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 71, 0.16); }
    50% { box-shadow: 0 0 0 4px rgba(255, 194, 71, 0.06), 0 0 18px rgba(255, 194, 71, 0.3); }
  }
  .fusion-hint kbd, .deck-keys kbd {
    font-family: var(--mono);
    font-size: 9.5px;
    border: 1px solid rgba(255, 210, 130, 0.4);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--gold);
  }
  .deck-keys {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
    line-height: 1.6;
  }
  .skill-pair { display: flex; gap: 8px; }
  .skill-chip {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: rgba(9, 15, 26, 0.8);
    pointer-events: none;
  }
  .skill-chip span {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .skill-chip b {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    color: #d9ecff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .skill-chip.is-magic b { color: var(--magic); }
  .skill-chip.is-tech b { color: var(--tech); }

  /* ---------- 小地图 ---------- */
  .minimap-panel {
    position: absolute;
    z-index: 18;
    right: 18px;
    bottom: 176px;
    width: 216px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(8, 14, 24, 0.86);
    pointer-events: none;
  }
  .minimap-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 0 2px 5px;
  }
  .minimap-head b { color: #cfe6ff; font-weight: 500; }
  #minimap { width: 100%; height: 148px; display: block; border-radius: 4px; }

  /* ---------- 浮动提示 / 闪光 ---------- */
  .toast {
    position: absolute;
    left: 50%;
    top: 104px;
    transform: translate(-50%, -6px);
    z-index: 40;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: rgba(10, 18, 31, 0.94);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    font-size: 12.5px;
    color: #dceeff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: min(640px, 86vw);
    text-align: center;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  .toast.is-success { border-color: rgba(71, 232, 167, 0.5); color: #b9ffe6; }
  .toast.is-warn { border-color: rgba(255, 194, 71, 0.45); color: #ffe4ab; }
  .toast.is-error { border-color: rgba(255, 107, 127, 0.5); color: #ffc3cb; }
  .flash {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: transparent;
  }
  .flash.is-on { opacity: 1; transition: opacity 0.06s ease; }

  /* ---------- 规则 / 天赋面板 ---------- */
  .rules-layer {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(3, 7, 14, 0.78);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .rules-layer.is-open { opacity: 1; visibility: visible; }
  .rules-card {
    width: min(980px, 94vw);
    max-height: min(720px, 88vh);
    overflow: auto;
    padding: 22px 24px 24px;
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    background: linear-gradient(180deg, #0f1a2b, #0a1220);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .rules-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 16px;
  }
  .rules-head .kicker {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--tech);
    letter-spacing: 0.2em;
  }
  .rules-head h2 { margin: 3px 0 0; font-size: 19px; letter-spacing: 0.04em; }
  .rules-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .rule-block { margin-bottom: 18px; }
  .rule-block h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 7px;
    font-size: 13px;
    color: #cfe4ff;
    letter-spacing: 0.05em;
  }
  .rule-block h3 em {
    font-style: normal;
    font-family: var(--mono);
    color: var(--tech);
    font-size: 10px;
    border: 1px solid rgba(62, 230, 255, 0.3);
    border-radius: 3px;
    padding: 0 4px;
  }
  .rule-block p, .rule-block li { font-size: 12.5px; line-height: 1.7; color: #b8cce6; margin: 4px 0; }
  .rule-block ul { margin: 4px 0; padding-left: 18px; }
  .rule-block b { color: #e6f4ff; }
  .rule-block kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    border: 1px solid rgba(120, 170, 230, 0.35);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--tech);
    background: rgba(6, 12, 22, 0.8);
  }
  .fusion-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .fusion-table th, .fusion-table td {
    border: 1px solid var(--line);
    padding: 6px 8px;
    font-size: 11.5px;
    text-align: left;
    color: #bed4ee;
  }
  .fusion-table th { background: rgba(18, 32, 52, 0.8); color: #d6ecff; font-weight: 600; }
  .fusion-table td.m { color: #d9c8ff; }
  .fusion-table td.t { color: #a8f2ff; }
  .fusion-table td.r { color: var(--gold); }

  .talent-box {
    padding: 14px;
    border: 1px solid rgba(255, 194, 71, 0.22);
    border-radius: 10px;
    background: rgba(22, 18, 8, 0.35);
  }
  .talent-box .talent-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .talent-box h3 { margin: 0; font-size: 13px; color: #ffe6ae; letter-spacing: 0.06em; }
  .talent-box .crystal-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--gold);
  }
  .talent-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px dashed rgba(255, 194, 71, 0.16);
  }
  .talent-row:first-of-type { border-top: 0; }
  .talent-row .t-glyph {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 194, 71, 0.4);
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold);
    flex: none;
  }
  .talent-row .t-info { flex: 1; min-width: 0; }
  .talent-row .t-info b { display: block; font-size: 12px; color: #ffedc4; }
  .talent-row .t-info span { display: block; font-size: 10.5px; color: #a9bbd4; line-height: 1.5; }
  .talent-row .t-level {
    font-family: var(--mono);
    font-size: 10.5px;
    color: #d6c8a3;
    flex: none;
  }
  .talent-row .t-buy {
    flex: none;
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid rgba(255, 194, 71, 0.45);
    background: rgba(60, 44, 10, 0.6);
    color: #ffe4a6;
    font-size: 10.5px;
    cursor: pointer;
  }
  .talent-row .t-buy:hover { background: rgba(90, 66, 14, 0.8); }
  .talent-row .t-buy[disabled] { opacity: 0.35; cursor: not-allowed; }
  .talent-note { margin-top: 10px; font-size: 10.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- 通用弹窗（奖励 / 结算） ---------- */
  .modal-layer {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(3, 7, 14, 0.8);
    backdrop-filter: blur(4px);
    opacity: 1;
    visibility: visible;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .modal-layer.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .modal {
    width: min(820px, 94vw);
    max-height: 88vh;
    overflow: auto;
    padding: 22px 24px 24px;
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    background:
      radial-gradient(600px 220px at 50% 0%, rgba(176, 133, 255, 0.12), transparent 70%),
      linear-gradient(180deg, #101b2c, #0a1220);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    text-align: left;
  }
  .modal-kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--tech);
  }
  .modal h2 {
    margin: 5px 0 8px;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #ecf7ff;
  }
  .modal-sub {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: #95accb;
    line-height: 1.7;
  }
  .modal-sub b { color: #e2f2ff; }

  .reward-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 14px 0 8px;
  }
  .reward-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 176px;
    padding: 14px 14px 16px;
    border-radius: 11px;
    border: 1px solid rgba(120, 160, 220, 0.24);
    background: linear-gradient(180deg, rgba(20, 32, 50, 0.92), rgba(9, 16, 28, 0.94));
    text-align: left;
    cursor: pointer;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .reward-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); }
  .reward-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .reward-card .r-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .reward-card .r-tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .reward-card .r-key {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
  }
  .reward-card .r-glyph {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid currentColor;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 17px;
    color: var(--magic);
    margin-top: 2px;
  }
  .reward-card .r-name { font-size: 15px; color: #f2f8ff; font-weight: 700; letter-spacing: 0.02em; }
  .reward-card .r-desc { font-size: 11.5px; color: #a7bdd9; line-height: 1.65; flex: 1; }
  .reward-card .r-result { font-family: var(--mono); font-size: 10px; color: #8ddfc1; letter-spacing: 0.02em; }
  .reward-card.reward-magic { color: var(--magic); }
  .reward-card.reward-tech { color: var(--tech); }
  .reward-card.reward-tech .r-glyph { color: var(--tech); }
  .reward-card.reward-fusion { color: var(--gold); }
  .reward-card.reward-fusion .r-glyph { color: var(--gold); }
  .reward-card.reward-relic { color: var(--good); }
  .reward-card.reward-relic .r-glyph { color: var(--good); }

  .modal-note {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.7;
  }
  .modal-note b { color: #cfe4ff; }

  .result-modal { width: min(680px, 94vw); text-align: center; }
  .result-modal .result-icon {
    width: 52px;
    height: 52px;
    margin: 2px auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 24px;
    color: var(--bad);
    border: 1px solid rgba(255, 107, 127, 0.45);
    border-radius: 50%;
    background: rgba(52, 14, 22, 0.6);
  }
  .result-modal h2 { color: #ffe4e8; }
  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 14px 0;
  }
  .result-stat {
    padding: 9px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(8, 14, 24, 0.72);
  }
  .result-stat span { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .result-stat b {
    display: block;
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 16px;
    color: #e8f5ff;
  }
  .result-stat.is-gold b { color: var(--gold); }
  .result-modal .talent-box { text-align: left; margin: 14px 0 16px; }
  .btn-big { width: 100%; justify-content: center; padding: 11px 16px; font-size: 13px; }
  .result-hint { margin-top: 10px; font-size: 11px; color: var(--muted); }

  /* ---------- 窄屏适配 ---------- */
  @media (max-width: 1120px) {
    .hud-top { gap: 12px; padding: 11px 14px 16px; }
    .brand { min-width: 150px; }
    .logo { font-size: 18px; }
    .bar-group { width: 150px; }
    .readout-best, .readout-crystal { display: none; }
    .hud-deck { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); right: 12px; left: 12px; }
    .deck-side { grid-column: 1 / -1; flex-direction: row; align-items: center; flex-wrap: wrap; }
    .fusion-hint { flex: 1; min-width: 260px; }
    .skill-pair { flex: none; width: 300px; }
    .minimap-panel { bottom: 208px; width: 180px; }
    #minimap { height: 118px; }
  }
  @media (max-width: 760px) {
    .hud-readouts .readout-enemy { display: none; }
    .bar-group { width: 118px; }
    .hud-deck { grid-template-columns: minmax(0, 1fr); bottom: 8px; }
    .card-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .mini-card .m-sub { display: none; }
    .minimap-panel { display: none; }
    .deck-keys { display: none; }
    .reward-grid { grid-template-columns: 1fr; }
    .rules-grid { grid-template-columns: 1fr; }
    .result-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="game" aria-label="奥术工程师游戏画面"></canvas>
  <div class="vignette"></div>

  <!-- 顶部 HUD：楼层、生命、奥能、战绩 -->
  <header class="hud-top">
    <div class="brand">
      <div class="logo">奥术<b>工程师</b></div>
      <div class="sub">ARCANE ENGINEER · 魔法 × 科技</div>
    </div>
    <div class="hud-readouts">
      <div class="readout">
        <span>楼层</span>
        <b id="hudFloor">1</b>
        <i id="hudEnemy" class="readout-enemy">剩余 0</i>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>生命 HP</span><b id="hudHpText">100 / 100</b></div>
        <div class="bar bar-hp" id="hpBar"><i id="hudHpFill"></i></div>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>奥能 AETHER</span><b id="hudAetherText">100 / 100</b></div>
        <div class="bar bar-aether" id="aetherBar"><i id="hudAetherFill"></i></div>
      </div>
      <div class="readout readout-best">
        <span>最佳楼层</span>
        <b id="hudBest">1</b>
      </div>
      <div class="readout readout-crystal">
        <span>奥术结晶</span>
        <b id="hudCrystals">0</b>
      </div>
      <div class="readout">
        <span>击杀</span>
        <b id="hudKills">0</b>
      </div>
    </div>
    <div class="hud-actions">
      <button type="button" id="btnRules" class="btn btn-primary">规则 &amp; 天赋 <kbd>H</kbd></button>
      <button type="button" id="btnRestart" class="btn">重开 <kbd>R</kbd></button>
    </div>
  </header>

  <aside class="minimap-panel">
    <div class="minimap-head"><span>楼层地图</span><b id="minimapFloor">F1</b></div>
    <canvas id="minimap" width="216" height="148"></canvas>
  </aside>

  <!-- 底部卡组：魔法 / 科技 / 融合提示 -->
  <footer class="hud-deck">
    <div class="deck-block">
      <div class="deck-title">魔法卡 <i>数字键 1–4 切换</i></div>
      <div id="magicRow" class="card-row"></div>
    </div>
    <div class="deck-block">
      <div class="deck-title">科技模块 <i>点击选中装置 · K 触发</i></div>
      <div id="techRow" class="card-row"></div>
    </div>
    <div class="deck-side">
      <div id="fusionHint" class="fusion-hint">融合：集齐魔法与对应科技模块后，按 <kbd>F</kbd> 融合。</div>
      <div class="deck-keys">左键 / <kbd>J</kbd> 主技能　右键 / <kbd>K</kbd> 装置　<kbd>E</kbd> 下楼　<kbd>F</kbd> 融合　<kbd>H</kbd> 暂停</div>
      <div class="skill-pair">
        <div class="skill-chip is-magic"><span>主技能 J</span><b id="primarySkill">火球</b></div>
        <div class="skill-chip is-tech"><span>装置 K</span><b id="secondarySkill">未装配</b></div>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="flash" class="flash"></div>

  <!-- 规则 & 天赋面板（打开时暂停） -->
  <div id="rulesPanel" class="rules-layer" aria-hidden="true">
    <div class="rules-card">
      <div class="rules-head">
        <div>
          <div class="kicker">PAUSED · CODEX</div>
          <h2>规则 · 融合配方 · 永久天赋</h2>
        </div>
        <button type="button" id="rulesClose" class="btn">关闭 <kbd>H</kbd></button>
      </div>
      <div class="rules-grid">
        <section id="rulesBody"></section>
        <section class="talent-box">
          <div class="talent-head">
            <h3>永久天赋</h3>
            <span class="crystal-count">结晶 <b id="talentCrystals">0</b></span>
          </div>
          <div id="talentsBody"></div>
          <div class="talent-note">每清空一层获得 1 枚奥术结晶；天赋在死亡后保留，刷新页面也不会丢失。</div>
        </section>
      </div>
    </div>
  </div>

  <!-- 奖励 / 结算弹窗 -->
  <div id="modalLayer" class="modal-layer hidden" aria-hidden="true">
    <div id="modal" class="modal"></div>
  </div>
</div>
<script>
/* ============================================================
   一、配置区
   ------------------------------------------------------------
   所有数值、卡牌、配方、敌人、天赋都集中在这里。
   以后调平衡只改数据，不动逻辑。
   ============================================================ */

/** 全局基础数值（想改手感就改这里） */
const GAME_CONFIG = {
  worldWidth: 1800,            // 地图宽（世界坐标）
  worldHeight: 1300,           // 地图高
  mapPadding: 76,              // 地图边缘留白
  roomMinWidth: 300,           // 房间最小宽度
  roomMaxWidth: 430,           // 房间最大宽度
  roomMinHeight: 240,          // 房间最小高度
  roomMaxHeight: 330,          // 房间最大高度
  roomGap: 92,                 // 房间之间最小间隔（留给走廊）
  corridorWidth: 96,           // 走廊宽度
  floorMinRooms: 4,            // 每层最少房间数
  floorMaxRooms: 7,            // 每层最多房间数
  playerSpeed: 230,            // 角色基础移动速度
  playerAccel: 1600,           // 角色加速度（越大起步越快）
  playerFriction: 10,          // 松手后的摩擦（越大停得越快）
  playerRadius: 15,            // 角色碰撞半径
  baseHp: 100,                 // 初始生命
  baseAether: 100,             // 初始奥能上限
  baseRegen: 8,                // 奥能自然回复（每秒）
  contactDamage: 7,            // 敌人接触伤害
  contactInterval: 0.85,       // 同一敌人两次接触伤害的间隔
  enemyBaseCount: 3,           // 每层基础敌人数
  enemyPerFloor: 1.5,          // 每层额外敌人数（3 + 层 × 1.5）
  floorScale: 1.12,            // 敌人血量缩放 1.12^层
  speedScaleCap: 1.8,          // 敌人速度缩放上限（防止后期失控）
  talentMaxLevel: 5,           // 每项永久天赋最高等级
  talentCost: 1,               // 升 1 级天赋消耗的结晶
  metaKey: 'arcane_rogue_meta' // localStorage 存档键
};

/** 魔法卡（主动技能）：耗奥能、有冷却 */
const MAGIC_CONFIG = [
  {
    id: 'fireball', name: '火球', glyph: '△', tag: '投射',
    cost: 15, cooldown: 0.55, damage: 24, color: '#b085ff',
    desc: '向指针方向发射火球，命中造成伤害。',
    fusedDesc: '火球会缓慢转向，追踪最近的敌人。'
  },
  {
    id: 'frost', name: '冰环', glyph: '◎', tag: '范围',
    cost: 25, cooldown: 1.8, damage: 16, color: '#b085ff',
    desc: '以自身为中心释放冰环，伤害并减速周围敌人。',
    fusedDesc: '冰环范围 +60%，并冻结敌人 1.5 秒。'
  },
  {
    id: 'bolt', name: '雷击', glyph: '⌁', tag: '连锁',
    cost: 30, cooldown: 2.2, damage: 28, color: '#b085ff',
    desc: '轰击最近的敌人并跳跃到附近目标。',
    fusedDesc: '命中后额外跳跃 3 个目标。'
  },
  {
    id: 'heal', name: '治疗符', glyph: '✚', tag: '恢复',
    cost: 28, cooldown: 3.2, damage: 0, heal: 30, color: '#b085ff',
    desc: '立刻回复生命值。',
    fusedDesc: '改为持续 6 秒的再生光环，持续回血。'
  }
];

/** 科技卡（被动 + 可触发装置） */
const TECH_CONFIG = [
  {
    id: 'concentrator', name: '聚能模块', glyph: '▤', tag: '被动',
    passive: '奥能回复 +2/s',
    device: { name: '奥能涌动', cooldown: 9, aether: 35 },
    desc: '稳定奥能回流，主动可瞬间补充奥能。'
  },
  {
    id: 'field', name: '力场发生器', glyph: '⬡', tag: '被动',
    passive: '受到伤害 -15%',
    device: { name: '力场护盾', cooldown: 12, shield: 4 },
    desc: '被动减伤，主动展开 4 秒护盾。'
  },
  {
    id: 'capacitor', name: '电容', glyph: '▮', tag: '被动',
    passive: '奥能上限 +30',
    device: { name: '超载充能', cooldown: 14, aether: 60 },
    desc: '扩大奥能池，主动瞬间充能。'
  },
  {
    id: 'nanite', name: '纳米机器人', glyph: '✦', tag: '被动',
    passive: '每秒回复 1.2 生命',
    device: { name: '修复脉冲', cooldown: 11, heal: 22 },
    desc: '缓慢自修复，主动可快速修复。'
  }
];

/** 融合配方：魔法卡 + 科技卡 → 升级技能（记忆点） */
const FUSION_CONFIG = [
  {
    id: 'homingFireball', magic: 'fireball', tech: 'concentrator',
    name: '追踪火球', glyph: '◈',
    desc: '火球获得转向能力，自动追踪最近的敌人。'
  },
  {
    id: 'frostField', magic: 'frost', tech: 'field',
    name: '冻结力场', glyph: '⌾',
    desc: '冰环转化为冻结力场，范围更大、控制更久。'
  },
  {
    id: 'chainBolt', magic: 'bolt', tech: 'capacitor',
    name: '连锁闪电', glyph: '⌁',
    desc: '雷击命中后额外跳跃 3 个目标。'
  },
  {
    id: 'regenField', magic: 'heal', tech: 'nanite',
    name: '再生力场', glyph: '✚',
    desc: '治疗符改为 6 秒持续回血光环。'
  }
];

/** 通用奖励（奖池不足 3 个时的保底选项） */
const RELIC_CONFIG = [
  {
    id: 'hp', name: '强化机体', glyph: '▣', maxStacks: 4,
    desc: '本局最大生命 +15，并立即回复 15。',
    apply() { state.mods.hpBonus += 15; refreshDerivedStats(true); }
  },
  {
    id: 'regen', name: '奥能循环', glyph: '≋', maxStacks: 3,

    apply() { state.mods.regenBonus += 1.5; refreshDerivedStats(false); }
  },
  {
    id: 'power', name: '符文增幅', glyph: '▲', maxStacks: 4,
    desc: '所有技能伤害 +12%。',
    apply() { state.mods.damageMul *= 1.12; }
  },
  {
    id: 'haste', name: '快速咏唱', glyph: '»', maxStacks: 3,
    desc: '技能冷却时间 -10%。',
    apply() { state.mods.cooldownMul *= 0.9; }
  },
  {
    id: 'swift', name: '轻步', glyph: '⇢', maxStacks: 3,
    desc: '移动速度 +8%。',
    apply() { state.mods.speedMul *= 1.08; refreshDerivedStats(false); }
  }
];

/** 敌人配置（首版三种，相位兽第 3 层起出现） */
const ENEMY_CONFIG = [
  {
    id: 'wanderer', name: '游荡体', hp: 30, speed: 70, radius: 16,
    damage: 7, color: '#ff6b7f', shape: 'diamond',
    desc: '直线追击，接触造成伤害。'
  },
  {
    id: 'shooter', name: '射手傀儡', hp: 45, speed: 40, radius: 16,
    damage: 5, color: '#ff9a62', shape: 'square',
    keepRange: 190, fireInterval: 2.2, bulletSpeed: 175,
    desc: '保持距离，定时发射弹幕。'
  },
  {
    id: 'phaser', name: '相位兽', hp: 80, speed: 95, radius: 19,
    damage: 9, color: '#d17bff', shape: 'hexagon',
    blinkInterval: 3.6, minFloor: 3,
    desc: '周期闪现突进，第 3 层起出现。'
  }
];

/** 永久天赋配置：死亡后保留，靠奥术结晶升级 */
const TALENT_CONFIG = [
  {
    id: 'vitality', name: '活力', glyph: '▣',
    desc: '每级初始生命 +20。',
    detail: '+20 最大生命 / 级'
  },
  {
    id: 'aether', name: '奥能', glyph: '≋',
    desc: '每级奥能上限 +10。',
    detail: '+10 奥能上限 / 级'
  },
  {
    id: 'fusionMastery', name: '融合精通', glyph: '◈',
    desc: '每级融合技伤害 +15%。',
    detail: '+15% 融合技伤害 / 级'
  }
];

/** 通过 id 快速查配置，避免到处写 find */
const MAGIC_BY_ID = {};
MAGIC_CONFIG.forEach((card) => { MAGIC_BY_ID[card.id] = card; });
const TECH_BY_ID = {};
TECH_CONFIG.forEach((card) => { TECH_BY_ID[card.id] = card; });
const FUSION_BY_ID = {};
FUSION_CONFIG.forEach((fusion) => { FUSION_BY_ID[fusion.id] = fusion; });
const RELIC_BY_ID = {};
RELIC_CONFIG.forEach((relic) => { RELIC_BY_ID[relic.id] = relic; });
const ENEMY_BY_ID = {};
ENEMY_CONFIG.forEach((enemy) => { ENEMY_BY_ID[enemy.id] = enemy; });
const TALENT_BY_ID = {};
TALENT_CONFIG.forEach((talent) => { TALENT_BY_ID[talent.id] = talent; });

/* ============================================================
   二、状态区
   ------------------------------------------------------------
   一局的所有数据都放在 state 里；meta（永久天赋）单独持久化。
   ============================================================ */

/** Canvas 相关全局引用 */
let canvas = null;
let ctx = null;
let minimap = null;
let minimapCtx = null;

/** 当前局状态（重开时整体替换，但 meta 引用会保留） */
let state = null;

/** DOM 引用集合，初始化时一次性抓取 */
const ui = {};

/** 鼠标世界坐标（用于瞄准） */
const mouseState = { x: 0, y: 0, worldX: 0, worldY: 0, moved: false };

/** 屏幕震动偏移，渲染时使用 */
let shakeX = 0;
let shakeY = 0;

/** 最后一次背包满提示的时间，用于限频（保留给拾取逻辑复用） */
let toastCooldownUntil = 0;

/**
 * 把数值限制在 [min, max] 区间内
 * @param {number} value 原值
 * @param {number} min 最小值
 * @param {number} max 最大值
 * @returns {number} 限制后的值
 */
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/**
 * 从区间 [min, max] 取随机浮点数
 * @param {number} min 最小值
 * @param {number} max 最大值
 * @returns {number} 随机数
 */
function rand(min, max) {
  return min + Math.random() * (max - min);
}

/**
 * 从区间 [min, max] 取随机整数（包含两端）
 * @param {number} min 最小值
 * @param {number} max 最大值
 * @returns {number} 随机整数
 */
function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

/**
 * 从数组里随机取一个元素
 * @param {Array} list 候选数组
 * @returns {*} 随机元素
 */
function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

/**
 * 原地洗牌（Fisher-Yates），返回同一数组
 * @param {Array} list 待洗牌数组
 * @returns {Array} 洗好的数组
 */
function shuffleArray(list) {
  for (let i = list.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = list[i];
    list[i] = list[j];
    list[j] = temp;
  }
  return list;
}

/**
 * 两点距离
 * @param {number} x1 起点 x
 * @param {number} y1 起点 y
 * @param {number} x2 终点 x
 * @param {number} y2 终点 y
 * @returns {number} 距离
 */
function dist(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

/**
 * 把十六进制颜色转成 rgba 字符串
 * @param {string} hex 例如 #b085ff
 * @param {number} alpha 透明度 0–1
 * @returns {string} rgba 颜色
 */
function hexToRgba(hex, alpha) {
  const clean = hex.replace('#', '');
  const r = parseInt(clean.substring(0, 2), 16);
  const g = parseInt(clean.substring(2, 4), 16);
  const b = parseInt(clean.substring(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/**
 * 秒数格式化为 mm:ss
 * @param {number} seconds 秒
 * @returns {string} 例如 02:35
 */
function formatTime(seconds) {
  const total = Math.max(0, Math.floor(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/**
 * 画圆角矩形路径（用于房间地板与卡片底板）
 * @param {CanvasRenderingContext2D} targetCtx 目标上下文
 * @param {number} x 左上角 x
 * @param {number} y 左上角 y
 * @param {number} w 宽
 * @param {number} h 高
 * @param {number} radius 圆角半径
 */
function roundRectPath(targetCtx, x, y, w, h, radius) {
  const r = Math.min(radius, w / 2, h / 2);
  targetCtx.beginPath();
  targetCtx.moveTo(x + r, y);
  targetCtx.lineTo(x + w - r, y);
  targetCtx.quadraticCurveTo(x + w, y, x + w, y + r);
  targetCtx.lineTo(x + w, y + h - r);
  targetCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  targetCtx.lineTo(x + r, y + h);
  targetCtx.quadraticCurveTo(x, y + h, x, y + h - r);
  targetCtx.lineTo(x, y + r);
  targetCtx.quadraticCurveTo(x, y, x + r, y);
  targetCtx.closePath();
}

/**
 * 生成默认存档（第一次玩或存档损坏时使用）
 * @returns {Object} 默认 meta
 */
function defaultMeta() {
  return {
    runs: 0,
    bestFloor: 1,
    crystals: 0,
    talents: { vitality: 0, aether: 0, fusionMastery: 0 }
  };
}

/**
 * 规范化存档：补齐字段、限制等级，避免旧存档把游戏弄崩
 * @param {Object} raw 读到的原始存档
 * @returns {Object} 规范化后的 meta
 */
function normalizeMeta(raw) {
  const base = defaultMeta();
  if (!raw || typeof raw !== 'object') return base;
  base.runs = Math.max(0, Number(raw.runs) || 0);
  base.bestFloor = Math.max(1, Number(raw.bestFloor) || 1);
  base.crystals = Math.max(0, Number(raw.crystals) || 0);
  const talents = raw.talents && typeof raw.talents === 'object' ? raw.talents : {};
  TALENT_CONFIG.forEach((talent) => {
    const level = Math.max(0, Math.min(GAME_CONFIG.talentMaxLevel, Math.floor(Number(talents[talent.id]) || 0)));
    base.talents[talent.id] = level;
  });
  return base;
}

/**
 * 读取永久存档；浏览器禁用 localStorage 时退回内存存档
 * @returns {Object} meta
 */
function loadMeta() {
  try {
    const raw = window.localStorage.getItem(GAME_CONFIG.metaKey);
    if (!raw) return defaultMeta();
    return normalizeMeta(JSON.parse(raw));
  } catch (error) {
    return defaultMeta();
  }
}

/**
 * 写入永久存档（失败只提示，不影响游戏）
 */
function saveMeta() {
  try {
    window.localStorage.setItem(GAME_CONFIG.metaKey, JSON.stringify(state.meta));
  } catch (error) {
    // 隐私模式 / file:// 限制时静默降级，本局仍可正常玩
  }
}

/**
 * 创建一局全新的状态（保留 meta）
 * @returns {Object} 新 state
 */
function createInitialState() {
  const meta = state && state.meta ? state.meta : loadMeta();
  const fresh = {
    runId: Date.now() + Math.random(),
    meta: meta,

    /* 流程：playing / reward / rules / result */
    mode: 'playing',
    /* 结果：playing / dead */
    status: 'playing',

    floor: 1,
    player: {
      x: 0, y: 0, vx: 0, vy: 0, angle: 0,
      hp: 0, hpMax: 0, aether: 0, aetherMax: 0,
      radius: GAME_CONFIG.playerRadius,
      shield: 0, aura: 0, hitFlash: 0
    },
    cam: { x: 0, y: 0 },
    keys: {},

    rooms: [],
    walkRects: [],
    decor: [],
    enemies: [],
    projectiles: [],
    bullets: [],
    pickups: [],
    particles: [],
    rings: [],
    floats: [],
    beams: [],

    ownedMagic: ['fireball'],
    ownedTech: [],
    fusions: [],
    activeMagicId: 'fireball',
    activeTechId: null,

    cooldowns: {},
    deviceCooldown: 0,

    floorCleared: false,
    stairs: null,

    kills: 0,
    shards: 0,
    floorsCleared: 0,
    elapsed: 0,

    mods: {
      hpBonus: 0, regenBonus: 0, damageMul: 1, cooldownMul: 1, speedMul: 1
    },
    relics: {},

    upgradeOptions: [],
    rewardReason: '',

    lastTime: 0,
    shake: { time: 0, power: 0 },
    nextEnemyId: 1
  };

  applyMetaStats(fresh, true);
  return fresh;
}

/**
 * 按 meta 与已持有科技重算派生属性（生命/奥能/回复/移速）
 * @param {Object} target 目标状态（通常是 state）
 * @param {boolean} fill 是否把当前生命/奥能填满
 */
function applyMetaStats(target, fill) {
  const oldHpMax = target.player.hpMax;
  const oldAetherMax = target.player.aetherMax;

  const talents = target.meta.talents;
  const hasCapacitor = target.ownedTech.includes('capacitor');
  const hasConcentrator = target.ownedTech.includes('concentrator');

  target.player.hpMax = GAME_CONFIG.baseHp
    + talents.vitality * 20
    + target.mods.hpBonus;

  target.player.aetherMax = GAME_CONFIG.baseAether
    + talents.aether * 10
    + (hasCapacitor ? 30 : 0);

  target.player.regen = GAME_CONFIG.baseRegen
    + (hasConcentrator ? 2 : 0)
    + target.mods.regenBonus;

  target.player.speed = GAME_CONFIG.playerSpeed * target.mods.speedMul;

  if (fill) {
    target.player.hp = target.player.hpMax;
    target.player.aether = target.player.aetherMax;
  } else {
    // 升级导致上限提高时，把差值补给当前值，避免“升级反而更难”
    if (target.player.hpMax > oldHpMax) target.player.hp += target.player.hpMax - oldHpMax;
    if (target.player.aetherMax > oldAetherMax) target.player.aether += target.player.aetherMax - oldAetherMax;
    target.player.hp = clamp(target.player.hp, 0, target.player.hpMax);
    target.player.aether = clamp(target.player.aether, 0, target.player.aetherMax);
  }
}

/**
 * 校验状态里的所有数组字段（初始化与调试时兜底）
 */
function refreshDerivedStats(fill) {
  applyMetaStats(state, fill);
  updateHUD();
  renderDeck();
}

/**
 * 取当前激活的魔法卡配置
 * @returns {Object} 魔法卡配置
 */
function getActiveMagic() {
  return MAGIC_BY_ID[state.activeMagicId] || MAGIC_CONFIG[0];
}

/**
 * 取当前选中的科技装置
 * @returns {Object|null} 科技卡配置
 */
function getActiveTech() {
  if (!state.activeTechId) return null;
  return TECH_BY_ID[state.activeTechId] || null;
}

/**
 * 判断某个魔法是否已经融合升级
 * @param {string} magicId 魔法 id
 * @returns {Object|null} 对应融合配置
 */
function getFusionForMagic(magicId) {
  const fusion = FUSION_CONFIG.find((item) => item.magic === magicId);
  if (!fusion) return null;
  return state.fusions.includes(fusion.id) ? fusion : null;
}

/**
 * 计算某张魔法卡的融合伤害加成（融合精通天赋）
 * @returns {number} 伤害倍率
 */
function getFusionDamageBonus() {
  return 1 + state.meta.talents.fusionMastery * 0.15;
}

/**
 * 列出当前可以立即融合的组合（魔法与科技都持有、且尚未融合）
 * @returns {Array} 可融合配方数组
 */
function getAvailableFusions() {
  return FUSION_CONFIG.filter((fusion) => (
    state.ownedMagic.includes(fusion.magic)
    && state.ownedTech.includes(fusion.tech)
    && !state.fusions.includes(fusion.id)
  ));
}

/**
 * 判断某个通用奖励还能不能继续拿
 * @param {Object} relic 奖励配置
 * @returns {boolean} 是否还能选
 */
function canTakeRelic(relic) {
  const taken = state.relics[relic.id] || 0;
  return taken < (relic.maxStacks || 3);
}
/* ============================================================
   三、地图生成区
   ------------------------------------------------------------
   每层随机生成 4–7 个房间 + L 形走廊；
   玩家出生在最左侧房间，楼梯放在离出生点最远的房间。
   ============================================================ */

/**
 * 判断一个点是否落在某个可行走矩形内
 * @param {number} x 点 x
 * @param {number} y 点 y
 * @param {Object} rect 矩形 { x, y, w, h }
 * @returns {boolean} 是否在矩形内
 */
function pointInRect(x, y, rect) {
  return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

/**
 * 判断圆形角色能否站在指定位置（圆要完整落在房间/走廊的并集内）
 * @param {number} x 圆心 x
 * @param {number} y 圆心 y
 * @param {number} radius 半径
 * @returns {boolean} 是否可站立
 */
function isWalkableCircle(x, y, radius) {
  if (x - radius < 0 || y - radius < 0) return false;
  if (x + radius > GAME_CONFIG.worldWidth || y + radius > GAME_CONFIG.worldHeight) return false;

  // 圆心 + 圆周 8 个采样点：只要有一点在墙外，就视为碰撞
  const samples = [[0, 0]];
  for (let i = 0; i < 8; i += 1) {
    const angle = (Math.PI / 4) * i;
    samples.push([Math.cos(angle) * radius, Math.sin(angle) * radius]);
  }

  for (let s = 0; s < samples.length; s += 1) {
    const px = x + samples[s][0];
    const py = y + samples[s][1];
    let inside = false;
    for (let r = 0; r < state.walkRects.length; r += 1) {
      if (pointInRect(px, py, state.walkRects[r])) { inside = true; break; }
    }
    if (!inside) return false;
  }
  return true;
}

/**
 * 判断两个房间是否重叠或间距不足
 * @param {Object} a 房间 A
 * @param {Object} b 房间 B
 * @param {number} gap 需要的最小间隔
 * @returns {boolean} 是否冲突
 */
function roomsConflict(a, b, gap) {
  return !(
    a.x + a.w + gap < b.x
    || b.x + b.w + gap < a.x
    || a.y + a.h + gap < b.y
    || b.y + b.h + gap < a.y
  );
}

/**
 * 往可行走区域里加入一个矩形（自动裁切到地图边界）
 * @param {number} x 左上角 x
 * @param {number} y 左上角 y
 * @param {number} w 宽
 * @param {number} h 高
 */
function addWalkRect(x, y, w, h) {
  const left = clamp(x, 0, GAME_CONFIG.worldWidth);
  const top = clamp(y, 0, GAME_CONFIG.worldHeight);
  const right = clamp(x + w, 0, GAME_CONFIG.worldWidth);
  const bottom = clamp(y + h, 0, GAME_CONFIG.worldHeight);
  if (right - left < 20 || bottom - top < 20) return;
  state.walkRects.push({ x: left, y: top, w: right - left, h: bottom - top });
}

/**
 * 用 L 形走廊连接两个房间（水平段 + 垂直段，重叠部分自动连通）
 * @param {Object} roomA 房间 A
 * @param {Object} roomB 房间 B
 */
function connectRoomsWithCorridor(roomA, roomB) {
  const width = GAME_CONFIG.corridorWidth;
  const ax = roomA.cx;
  const ay = roomA.cy;
  const bx = roomB.cx;
  const by = roomB.cy;

  // 水平走廊：从 A 中心高度延伸，覆盖到 B 的 x
  addWalkRect(
    Math.min(ax, bx) - 18,
    ay - width / 2,
    Math.abs(bx - ax) + 36,
    width
  );

  // 垂直走廊：在 B 的 x 位置，从 A 的高度连到 B 的高度
  addWalkRect(
    bx - width / 2,
    Math.min(ay, by) - 18,
    width,
    Math.abs(by - ay) + 36
  );
}

/**
 * 兜底房间布局：当随机房间数量不足时使用，保证每层一定能玩
 * @returns {Array} 固定 4 个房间
 */
function buildFallbackRooms() {
  const list = [
    { x: 180, y: 220, w: 380, h: 300 },
    { x: 720, y: 150, w: 400, h: 290 },
    { x: 1240, y: 430, w: 380, h: 310 },
    { x: 640, y: 760, w: 420, h: 330 }
  ];
  return list.map((room, index) => ({
    x: room.x, y: room.y, w: room.w, h: room.h,
    cx: room.x + room.w / 2, cy: room.y + room.h / 2,
    id: index
  }));
}

/**
 * 生成一层地图：房间、走廊、装饰、玩家出生点、楼梯与敌人
 * @param {number} floorNumber 当前层数
 */
function generateFloor(floorNumber) {
  state.rooms = [];
  state.walkRects = [];
  state.decor = [];
  state.enemies = [];
  state.projectiles = [];
  state.bullets = [];
  state.pickups = [];
  state.particles = [];
  state.rings = [];
  state.floats = [];
  state.beams = [];
  state.floorCleared = false;

  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;
  const pad = GAME_CONFIG.mapPadding;
  const targetRooms = randInt(GAME_CONFIG.floorMinRooms || 4, GAME_CONFIG.floorMaxRooms || 7);

  // 随机放置房间：彼此至少留出一个走廊的距离
  const rooms = [];
  let attempts = 0;
  while (rooms.length < targetRooms && attempts < 700) {
    attempts += 1;
    const w = rand(300, 430);
    const h = rand(240, 330);
    const x = rand(pad, W - pad - w);
    const y = rand(pad, H - pad - h);
    const candidate = {
      x: x, y: y, w: w, h: h,
      cx: x + w / 2, cy: y + h / 2,
      id: rooms.length
    };
    let conflict = false;
    for (let i = 0; i < rooms.length; i += 1) {
      if (roomsConflict(candidate, rooms[i], GAME_CONFIG.roomGap)) { conflict = true; break; }
    }
    if (!conflict) rooms.push(candidate);
  }

  const finalRooms = rooms.length >= 4 ? rooms : buildFallbackRooms();
  finalRooms.forEach((room, index) => {
    room.id = index;
    addWalkRect(room.x, room.y, room.w, room.h);
    state.rooms.push(room);
  });

  // 按 x 排序后依次连接，保证所有房间连通
  const sorted = state.rooms.slice().sort((a, b) => a.x - b.x);
  for (let i = 0; i < sorted.length - 1; i += 1) {
    connectRoomsWithCorridor(sorted[i], sorted[i + 1]);
  }

  // 出生房间：最靠左的房间；楼梯房间：离出生点最远的房间
  const spawnRoom = sorted[0];
  state.player.x = spawnRoom.cx;
  state.player.y = spawnRoom.cy;
  state.player.vx = 0;
  state.player.vy = 0;

  const stairRoom = sorted.reduce((best, room) => (
    dist(room.cx, room.cy, spawnRoom.cx, spawnRoom.cy) > dist(best.cx, best.cy, spawnRoom.cx, spawnRoom.cy)
      ? room
      : best
  ), sorted[sorted.length - 1]);

  state.stairs = { x: stairRoom.cx, y: stairRoom.cy, active: false };

  // 房间装饰：中央符文圈 + 四角技术节点，纯视觉
  state.rooms.forEach((room) => {
    state.decor.push({ kind: 'rune', x: room.cx, y: room.cy, radius: Math.min(room.w, room.h) * 0.28 });
    state.decor.push({ kind: 'node', x: room.x + 22, y: room.y + 22, side: 'tl' });
    state.decor.push({ kind: 'node', x: room.x + room.w - 22, y: room.y + 22, side: 'tr' });
    state.decor.push({ kind: 'node', x: room.x + 22, y: room.y + room.h - 22, side: 'bl' });
    state.decor.push({ kind: 'node', x: room.x + room.w - 22, y: room.y + room.h - 22, side: 'br' });
  });

  spawnEnemiesForFloor(floorNumber, spawnRoom);
  snapCamera();
  drawMinimap();
}

/**
 * 给当前层生成敌人（避开出生房间，且与玩家保持距离）
 * @param {number} floorNumber 层数
 * @param {Object} spawnRoom 出生房间
 */
function spawnEnemiesForFloor(floorNumber, spawnRoom) {
  const count = Math.floor(GAME_CONFIG.enemyBaseCount + floorNumber * GAME_CONFIG.enemyPerFloor);
  const candidateRooms = state.rooms.filter((room) => room.id !== spawnRoom.id);
  const roomPool = candidateRooms.length ? candidateRooms : state.rooms;
  const typePool = floorNumber >= 3
    ? ['wanderer', 'wanderer', 'shooter', 'shooter', 'phaser']
    : ['wanderer', 'wanderer', 'shooter', 'shooter'];

  for (let i = 0; i < count; i += 1) {
    let x = 0;
    let y = 0;
    let ok = false;
    for (let tries = 0; tries < 24 && !ok; tries += 1) {
      const room = pickRandom(roomPool);
      x = rand(room.x + 60, room.x + room.w - 60);
      y = rand(room.y + 60, room.y + room.h - 60);
      ok = dist(x, y, state.player.x, state.player.y) > 240;
    }
    if (!ok) {
      const room = pickRandom(roomPool);
      x = room.cx;
      y = room.cy;
    }
    spawnEnemy(pickRandom(typePool), x, y, floorNumber);
  }
}

/**
 * 生成一个敌人实体
 * @param {string} typeId 敌人类型 id
 * @param {number} x 出生 x
 * @param {number} y 出生 y
 * @param {number} floorNumber 当前层数（用于缩放）
 * @returns {Object} 敌人对象
 */
function spawnEnemy(typeId, x, y, floorNumber) {
  const conf = ENEMY_BY_ID[typeId] || ENEMY_CONFIG[0];
  const scale = Math.pow(GAME_CONFIG.floorScale, floorNumber);
  const speedScale = Math.min(scale, GAME_CONFIG.speedScaleCap);

  const enemy = {
    id: state.nextEnemyId,
    typeId: conf.id,
    name: conf.name,
    x: x, y: y, vx: 0, vy: 0,
    hp: Math.round(conf.hp * scale),
    hpMax: Math.round(conf.hp * scale),
    speed: conf.speed * speedScale,
    radius: conf.radius,
    damage: conf.damage,
    color: conf.color,
    shape: conf.shape,
    hitCooldown: 0,
    fireTimer: rand(0.8, 1.8),
    blinkTimer: rand(1.4, 2.6),
    flash: 0,
    slowTime: 0,
    frozenTime: 0,
    wobble: Math.random() * Math.PI * 2
  };

  state.nextEnemyId += 1;
  state.enemies.push(enemy);
  return enemy;
}

/**
 * 在玩家周围生成一个敌人（调试 / 测试用）
 * @param {string} typeId 敌人类型
 * @param {number} offsetX 相对玩家的 x 偏移
 * @param {number} offsetY 相对玩家的 y 偏移
 * @returns {Object} 敌人对象
 */
function spawnEnemyNearPlayer(typeId, offsetX, offsetY) {
  const conf = ENEMY_BY_ID[typeId] || ENEMY_CONFIG[0];
  const x = clamp(state.player.x + (offsetX || 140), 60, GAME_CONFIG.worldWidth - 60);
  const y = clamp(state.player.y + (offsetY || 0), 60, GAME_CONFIG.worldHeight - 60);
  const enemy = spawnEnemy(typeId, x, y, state.floor);
  addFloat('敌人出现', x, y - 26, conf.color, 12);
  return enemy;
}

/**
 * 判断某个点是否在当前层的可行走区域（用于掉落物与弹道）
 * @param {number} x 点 x
 * @param {number} y 点 y
 * @returns {boolean} 是否可行走
 */
function isPointWalkable(x, y) {
  for (let i = 0; i < state.walkRects.length; i += 1) {
    if (pointInRect(x, y, state.walkRects[i])) return true;
  }
  return false;
}

/**
 * 找到房间里一个安全的随机点
 * @param {Object} room 房间
 * @param {number} margin 距离墙的留白
 * @returns {Object} 点坐标
 */
function randomPointInRoom(room, margin) {
  return {
    x: rand(room.x + margin, room.x + room.w - margin),
    y: rand(room.y + margin, room.y + room.h - margin)
  };
}

/**
 * 取“出生房间”（最左侧的房间）
 * 出生点、调试定位与自动化测试都依赖它，保证逻辑只有一份
 * @returns {Object} 房间对象 { x, y, w, h, cx, cy }
 */
function getSpawnRoom() {
  return state.rooms.reduce((best, room) => (room.x < best.x ? room : best), state.rooms[0]);
}

/**
 * 把玩家放到出生房间中心（换层 / 重开时调用）
 */
function placePlayerAtSpawn() {
  const spawnRoom = getSpawnRoom();
  state.player.x = spawnRoom.cx;
  state.player.y = spawnRoom.cy;
  state.player.vx = 0;
  state.player.vy = 0;
  snapCamera();
}

/**
 * 清理当前层的敌人与弹道（下楼时使用）
 */
function clearFloorEntities() {
  state.enemies = [];
  state.projectiles = [];
  state.bullets = [];
  state.pickups = [];
  state.particles = [];
  state.rings = [];
  state.beams = [];
}

/**
 * 按窗口尺寸与设备像素比调整 Canvas（DPR 最高 2，保证清晰又省性能）
 */
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = window.innerWidth;
  const height = window.innerHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;

  state.viewW = width;
  state.viewH = height;
  updateCamera(0);
}

 * 刷新顶部 HUD：楼层、敌人、生命、奥能、战绩与技能名

function updateHUD() {

/**

function renderDeck() {
  if (!ui.magicRow) return;

  // 魔法卡：4 个固定槽位，未解锁显示为锁定
  let magicHtml = '';
  MAGIC_CONFIG.forEach((magic, index) => {
    const owned = state.ownedMagic.includes(magic.id);
    const active = state.activeMagicId === magic.id;
    const fusion = getFusionForMagic(magic.id);
    const isMaxed = owned && fusion;
    const classes = ['mini-card', 'magic'];
    if (active && owned) classes.push('is-active');
    if (!owned) classes.push('is-locked');
    magicHtml += '<button type="button" class="' + classes.join(' ') + '"'
      + ' data-magic-id="' + magic.id + '"'
      + (owned ? '' : ' disabled')
      + ' aria-label="' + magic.name + '">'
      + '<span class="m-key">' + (index + 1) + '</span>'
      + '<span class="m-glyph">' + magic.glyph + '</span>'
      + '<span class="m-name">' + (owned ? magic.name : '未解锁') + '</span>'
      + '<span class="m-sub">' + (owned ? (magic.cost + ' 奥能 · ' + magic.cooldown.toFixed(1) + 's') : '通关奖励解锁') + '</span>'
      + (owned ? '<span class="m-cd" data-cd="' + magic.id + '"></span>'
        + '<span class="m-cd-text" data-cdtext="' + magic.id + '"></span>' : '')
      + (isMaxed ? '<span class="m-fused">融合</span>' : '')
      + '</button>';
  });
  ui.magicRow.innerHTML = magicHtml;

  // 科技卡：4 个固定槽位
  let techHtml = '';
  TECH_CONFIG.forEach((tech) => {
    const owned = state.ownedTech.includes(tech.id);
    const active = state.activeTechId === tech.id;
    const classes = ['mini-card', 'tech'];
    if (active && owned) classes.push('is-active');
    if (!owned) classes.push('is-locked');
    techHtml += '<button type="button" class="' + classes.join(' ') + '"'
      + ' data-tech-id="' + tech.id + '"'
      + (owned ? '' : ' disabled')
      + ' aria-label="' + tech.name + '">'
      + '<span class="m-glyph">' + tech.glyph + '</span>'
      + '<span class="m-name">' + (owned ? tech.name : '未解锁') + '</span>'
      + '<span class="m-sub">' + (owned ? tech.passive : '通关奖励解锁') + '</span>'
      + (owned && active ? '<span class="m-cd" data-cd="device"></span>'
        + '<span class="m-cd-text" data-cdtext="device"></span>' : '')
      + '</button>';
  });
  ui.techRow.innerHTML = techHtml;

  updateDeckCooldowns();
  updateFusionHint();
}

/**
 * 刷新技能冷却遮罩与倒计时文字（每帧调用，只改样式不改 DOM 结构）
 */
function updateDeckCooldowns() {
  if (!ui.magicRow) return;

  const magicCards = ui.magicRow.querySelectorAll('[data-magic-id]');
  magicCards.forEach((card) => {
    const magicId = card.getAttribute('data-magic-id');
    const magic = MAGIC_BY_ID[magicId];
    const remain = Math.max(0, state.cooldowns[magicId] || 0);
    const total = magic ? magic.cooldown * state.mods.cooldownMul : 1;
    const overlay = card.querySelector('[data-cd="' + magicId + '"]');
    const text = card.querySelector('[data-cdtext="' + magicId + '"]');

    if (overlay) overlay.style.height = (remain > 0 ? (remain / total * 100).toFixed(1) : 0) + '%';
    if (text) text.textContent = remain > 0.05 ? remain.toFixed(1) : '';
    card.classList.toggle('is-cooling', remain > 0.05);
  });

  const techCards = ui.techRow.querySelectorAll('[data-tech-id]');
  const tech = getActiveTech();
  techCards.forEach((card) => {
    const techId = card.getAttribute('data-tech-id');
    const isActive = tech && tech.id === techId;
    const remain = isActive ? Math.max(0, state.deviceCooldown) : 0;
    const total = tech ? tech.device.cooldown : 1;
    const overlay = card.querySelector('[data-cd="device"]');
    const text = card.querySelector('[data-cdtext="device"]');

    if (overlay) overlay.style.height = (remain > 0 ? (remain / total * 100).toFixed(1) : 0) + '%';
    if (text) text.textContent = remain > 0.05 ? remain.toFixed(1) : '';
    card.classList.toggle('is-cooling', remain > 0.05);
  });
}

/**
 * 刷新融合提示：优先显示当前可融合的组合
 */
function updateFusionHint() {
  if (!ui.fusionHint) return;

  const available = getAvailableFusions();
  if (available.length > 0) {
    const fusion = available[0];
    const magic = MAGIC_BY_ID[fusion.magic];
    const tech = TECH_BY_ID[fusion.tech];
    ui.fusionHint.innerHTML = '可融合：<b>' + magic.name + '</b> + <b>' + tech.name
      + '</b> → <b>' + fusion.name + '</b> · 按 <kbd>F</kbd> 融合';
    ui.fusionHint.classList.add('is-ready');
    return;
  }

  // 找到“只差科技卡”的提示，帮助玩家理解收集目标
  const waiting = FUSION_CONFIG.find((fusion) => (
    state.ownedMagic.includes(fusion.magic)
    && !state.ownedTech.includes(fusion.tech)
    && !state.fusions.includes(fusion.id)
  ));
  if (waiting) {
    const magic = MAGIC_BY_ID[waiting.magic];
    const tech = TECH_BY_ID[waiting.tech];
    ui.fusionHint.innerHTML = '<b>' + magic.name + '</b> 还缺 <b>' + tech.name + '</b>，'
      + '获得后可按 <kbd>F</kbd> 融合为 <b>' + waiting.name + '</b>。';
  } else if (state.fusions.length >= FUSION_CONFIG.length) {
    ui.fusionHint.innerHTML = '全部融合技已完成：<b>' + state.fusions.length + ' / ' + FUSION_CONFIG.length + '</b>。';
  } else {
    ui.fusionHint.innerHTML = '融合：集齐魔法与对应科技模块后，按 <kbd>F</kbd> 融合。';
  }
  ui.fusionHint.classList.remove('is-ready');
}

/**
 * 绘制右上角小地图：房间、玩家、敌人、掉落与楼梯
 */
function drawMinimap() {
  if (!minimapCtx || !state.rooms.length) return;

  const mw = minimap.width;
  const mh = minimap.height;
  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;
  const scale = Math.min(mw / W, mh / H);
  const offsetX = (mw - W * scale) / 2;
  const offsetY = (mh - H * scale) / 2;

  minimapCtx.clearRect(0, 0, mw, mh);
  minimapCtx.fillStyle = '#070c16';
  minimapCtx.fillRect(0, 0, mw, mh);

  // 房间与走廊
  state.walkRects.forEach((rect) => {
    minimapCtx.fillStyle = 'rgba(62, 230, 255, 0.08)';
    minimapCtx.fillRect(offsetX + rect.x * scale, offsetY + rect.y * scale, rect.w * scale, rect.h * scale);
  });
  state.rooms.forEach((room) => {
    minimapCtx.strokeStyle = 'rgba(120, 190, 255, 0.32)';
    minimapCtx.lineWidth = 1;
    minimapCtx.strokeRect(offsetX + room.x * scale, offsetY + room.y * scale, room.w * scale, room.h * scale);
  });

  // 掉落物
  state.pickups.forEach((item) => {
    minimapCtx.fillStyle = item.kind === 'shard' ? '#ffc247' : '#3ee6ff';
    minimapCtx.fillRect(offsetX + item.x * scale - 1, offsetY + item.y * scale - 1, 2, 2);
  });

  // 敌人
  state.enemies.forEach((enemy) => {
    minimapCtx.fillStyle = enemy.color;
    minimapCtx.beginPath();
    minimapCtx.arc(offsetX + enemy.x * scale, offsetY + enemy.y * scale, 2.2, 0, Math.PI * 2);
    minimapCtx.fill();
  });

  // 楼梯（清场后才亮）
  if (state.floorCleared && state.stairs) {
    minimapCtx.fillStyle = '#ffc247';
    minimapCtx.beginPath();
    minimapCtx.arc(offsetX + state.stairs.x * scale, offsetY + state.stairs.y * scale, 3, 0, Math.PI * 2);
    minimapCtx.fill();
  }

  // 玩家
  minimapCtx.fillStyle = '#ecf9ff';
  minimapCtx.beginPath();
  minimapCtx.arc(offsetX + state.player.x * scale, offsetY + state.player.y * scale, 2.8, 0, Math.PI * 2);
  minimapCtx.fill();
}
/* ============================================================
   五、渲染区（Canvas 世界部分）
   ------------------------------------------------------------
   相机变换 → 地板/房间 → 装饰 → 楼梯 → 掉落物 → 敌人
   → 弹道 → 玩家 → 特效。所有图形都由代码绘制，无外部图片。
   ============================================================ */

/**
 * 计算相机目标位置（让角色保持在画面中心，并夹在地图边界内）
 * @returns {Object} 目标相机左上角坐标
 */
function getCameraTarget() {
  const viewW = state.viewW || window.innerWidth;
  const viewH = state.viewH || window.innerHeight;
  const worldW = GAME_CONFIG.worldWidth;
  const worldH = GAME_CONFIG.worldHeight;

  let targetX = state.player.x - viewW / 2;
  let targetY = state.player.y - viewH / 2;

  if (viewW >= worldW) targetX = (worldW - viewW) / 2;
  else targetX = clamp(targetX, 0, worldW - viewW);

  if (viewH >= worldH) targetY = (worldH - viewH) / 2;
  else targetY = clamp(targetY, 0, worldH - viewH);

  return { x: targetX, y: targetY };
}

/**
 * 立即把相机对齐到目标位置（初始化 / 传送 / 换层时使用）
 */
function snapCamera() {
  const target = getCameraTarget();
  state.cam.x = target.x;
  state.cam.y = target.y;
  updateMinimapCameraFrame();
}

/**
 * 平滑跟随相机（指数插值，帧率无关）
 * @param {number} dt 时间步长
 */
function updateCamera(dt) {
  const target = getCameraTarget();
  if (dt <= 0) {
    state.cam.x = target.x;
    state.cam.y = target.y;
    return;
  }
  const factor = 1 - Math.exp(-8 * dt);
  state.cam.x += (target.x - state.cam.x) * factor;
  state.cam.y += (target.y - state.cam.y) * factor;
}

/**
 * 渲染一帧：世界坐标都通过相机平移后再绘制
 */
function render() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const viewW = state.viewW || window.innerWidth;
  const viewH = state.viewH || window.innerHeight;

  // 屏幕底色（相机视野之外的部分）
  ctx.fillStyle = '#050910';
  ctx.fillRect(0, 0, viewW, viewH);

  // 屏幕震动
  shakeX = 0;
  shakeY = 0;
  if (state.shake.time > 0) {
    shakeX = (Math.random() * 2 - 1) * state.shake.power;
    shakeY = (Math.random() * 2 - 1) * state.shake.power;
  }

  ctx.save();
  ctx.translate(-state.cam.x + shakeX, -state.cam.y + shakeY);

  drawWorldBackground();
  drawRooms();
  drawDecor();
  drawStairs();
  drawPickups();
  drawEnemies();
  drawEnemyBullets();
  drawProjectiles();
  drawPlayer();
  drawEffects();

  ctx.restore();
}

/**
 * 世界底色：深底 + 科技网格 + 边缘辉光
 */
function drawWorldBackground() {
  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;

  ctx.fillStyle = '#070f1b';
  ctx.fillRect(0, 0, W, H);

  const gradient = ctx.createLinearGradient(0, 0, W, H);
  gradient.addColorStop(0, 'rgba(18, 46, 74, 0.32)');
  gradient.addColorStop(0.5, 'rgba(10, 20, 36, 0.06)');
  gradient.addColorStop(1, 'rgba(52, 28, 82, 0.28)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // 细网格，制造“工程底图”的秩序感
  ctx.strokeStyle = 'rgba(80, 150, 220, 0.055)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 90) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 90) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // 地图边界：双色描边，提示“不可越过”
  ctx.strokeStyle = 'rgba(62, 230, 255, 0.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
  ctx.strokeStyle = 'rgba(176, 133, 255, 0.1)';
  ctx.lineWidth = 6;
  ctx.strokeRect(8, 8, W - 16, H - 16);
}

/**
 * 画房间与走廊地板；暗区就是“墙”，角色无法进入
 */
function drawRooms() {
  // 先铺所有可行走矩形（房间 + 走廊）
  state.walkRects.forEach((rect) => {
    ctx.fillStyle = 'rgba(13, 26, 43, 0.94)';
    roundRectPath(ctx, rect.x, rect.y, rect.w, rect.h, 6);
    ctx.fill();
  });

  // 房间再叠加渐变与边框，区分“房间”与“走廊”
  state.rooms.forEach((room, index) => {
    const gradient = ctx.createLinearGradient(room.x, room.y, room.x, room.y + room.h);
    gradient.addColorStop(0, 'rgba(18, 36, 58, 0.96)');
    gradient.addColorStop(1, 'rgba(9, 18, 31, 0.96)');
    ctx.fillStyle = gradient;
    roundRectPath(ctx, room.x, room.y, room.w, room.h, 10);
    ctx.fill();

    ctx.strokeStyle = 'rgba(62, 230, 255, 0.16)';
    ctx.lineWidth = 1.5;
    roundRectPath(ctx, room.x, room.y, room.w, room.h, 10);
    ctx.stroke();

    // 四角线形角标（统一图标语言）
    const len = 22;
    ctx.strokeStyle = 'rgba(176, 133, 255, 0.34)';
    ctx.lineWidth = 1.4;
    const corners = [
      [room.x + 6, room.y + 6, 1, 1],
      [room.x + room.w - 6, room.y + 6, -1, 1],
      [room.x + 6, room.y + room.h - 6, 1, -1],
      [room.x + room.w - 6, room.y + room.h - 6, -1, -1]
    ];
    corners.forEach((corner) => {
      ctx.beginPath();
      ctx.moveTo(corner[0], corner[1] + corner[3] * len);
      ctx.lineTo(corner[0], corner[1]);
      ctx.lineTo(corner[0] + corner[2] * len, corner[1]);
      ctx.stroke();
    });

    // 房间编号，弱化排版层级
    ctx.fillStyle = 'rgba(120, 170, 220, 0.22)';
    ctx.font = '9px "Cascadia Mono", Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('ROOM ' + String(index + 1).padStart(2, '0'), room.x + 12, room.y + 20);
  });
}

/**
 * 画房间中央符文圈与角落技术节点（纯装饰）
 */
function drawDecor() {
  const t = state.elapsed;

  state.decor.forEach((item) => {
    if (item.kind === 'rune') {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(t * 0.12);
      ctx.strokeStyle = 'rgba(176, 133, 255, 0.13)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 9]);
      ctx.beginPath();
      ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(62, 230, 255, 0.07)';
      ctx.beginPath();
      ctx.arc(0, 0, item.radius * 0.62, 0, Math.PI * 2);
      ctx.stroke();

      // 六个方位的小刻度，像符文节点
      ctx.fillStyle = 'rgba(176, 133, 255, 0.18)';
      for (let i = 0; i < 6; i += 1) {
        const angle = (Math.PI / 3) * i;
        ctx.fillRect(Math.cos(angle) * item.radius - 1.5, Math.sin(angle) * item.radius - 1.5, 3, 3);
      }
      ctx.restore();
    } else if (item.kind === 'node') {
      ctx.strokeStyle = 'rgba(62, 230, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(item.x - 5, item.y - 5, 10, 10);
      ctx.fillStyle = 'rgba(62, 230, 255, 0.35)';
      ctx.fillRect(item.x - 1.5, item.y - 1.5, 3, 3);
    }
  });
}

/**
 * 画楼梯：清场后才出现，金色菱形 + 提示文字
 */
function drawStairs() {
  if (!state.floorCleared || !state.stairs) return;

  const stairs = state.stairs;
  const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 4);

  const glow = ctx.createRadialGradient(stairs.x, stairs.y, 4, stairs.x, stairs.y, 66);
  glow.addColorStop(0, 'rgba(255, 194, 71, ' + (0.22 + pulse * 0.16) + ')');
  glow.addColorStop(1, 'rgba(255, 194, 71, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(stairs.x, stairs.y, 66, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(stairs.x, stairs.y);
  ctx.rotate(Math.PI / 4);
  ctx.strokeStyle = 'rgba(255, 194, 71, 0.85)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffc247';
  ctx.shadowBlur = 16;
  ctx.strokeRect(-17, -17, 34, 34);
  ctx.fillStyle = 'rgba(60, 44, 10, 0.65)';
  ctx.fillRect(-17, -17, 34, 34);
  ctx.shadowBlur = 0;
  for (let i = -8; i <= 8; i += 8) {
    ctx.strokeStyle = 'rgba(255, 214, 130, 0.55)';
    ctx.beginPath();
    ctx.moveTo(-12, i);
    ctx.lineTo(12, i);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(255, 224, 160, 0.9)';
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('按 E 下楼', stairs.x, stairs.y - 30);
}

/**
 * 画地上的掉落物：奥能球（青）与结晶碎片（金）
 */
function drawPickups() {
  state.pickups.forEach((item) => {
    const bob = Math.sin(state.elapsed * 3 + item.x * 0.1) * 3;
    const color = item.kind === 'shard' ? '#ffc247' : '#3ee6ff';

    const glow = ctx.createRadialGradient(item.x, item.y + bob, 1, item.x, item.y + bob, 18);
    glow.addColorStop(0, hexToRgba(color, 0.35));
    glow.addColorStop(1, hexToRgba(color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(item.x, item.y + bob, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = color;
    if (item.kind === 'shard') {
      ctx.save();
      ctx.translate(item.x, item.y + bob);
      ctx.rotate(state.elapsed * 1.2);
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(4, 0);
      ctx.lineTo(0, 6);
      ctx.lineTo(-4, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(item.x, item.y + bob, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/**
 * 画所有敌人：不同形状区分类型，受伤显示血条
 */
function drawEnemies() {
  state.enemies.forEach((enemy) => {
    const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 4 + enemy.wobble);
    const isBlinking = enemy.typeId === 'phaser' && enemy.blinkTimer < 0.45;

    // 闪现前的预警圈：给玩家反应时间
    if (isBlinking) {
      ctx.strokeStyle = 'rgba(209, 123, 255, ' + (0.25 + pulse * 0.25) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 22 * (1 - enemy.blinkTimer / 0.45), 0, Math.PI * 2);
      ctx.stroke();
    }

    const glow = ctx.createRadialGradient(enemy.x, enemy.y, 2, enemy.x, enemy.y, enemy.radius + 26);
    glow.addColorStop(0, hexToRgba(enemy.color, 0.22));
    glow.addColorStop(1, hexToRgba(enemy.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.radius + 26, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    ctx.rotate(enemy.wobble + state.elapsed * 0.5);
    ctx.lineWidth = 2;
    ctx.strokeStyle = enemy.flash > 0 ? '#ffffff' : enemy.color;
    ctx.fillStyle = hexToRgba(enemy.color, enemy.flash > 0 ? 0.55 : 0.16);
    ctx.shadowColor = enemy.color;
    ctx.shadowBlur = 12;

    const r = enemy.radius;
    ctx.beginPath();
    if (enemy.shape === 'diamond') {
      ctx.moveTo(0, -r);
      ctx.lineTo(r, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r, 0);
    } else if (enemy.shape === 'square') {
      ctx.rect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
    } else {
      for (let i = 0; i < 6; i += 1) {
        const angle = (Math.PI / 3) * i;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 内芯：不同敌人一个小特征
    ctx.fillStyle = hexToRgba(enemy.color, 0.95);
    if (enemy.typeId === 'shooter') {
      ctx.fillRect(-4, -4, 8, 8);
    } else if (enemy.typeId === 'phaser') {
      ctx.beginPath();
      ctx.arc(0, 0, 4 + pulse * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-2.5, -2.5, 5, 5);
    }
    ctx.restore();

    // 血条：只在受伤后显示，减少画面噪音
    if (enemy.hp < enemy.hpMax) {
      const barW = 34;
      const barH = 3;
      const x = enemy.x - barW / 2;
      const y = enemy.y - enemy.radius - 12;
      ctx.fillStyle = 'rgba(6, 12, 20, 0.85)';
      ctx.fillRect(x, y, barW, barH);
      ctx.fillStyle = '#ff6b7f';
      ctx.fillRect(x, y, barW * clamp(enemy.hp / enemy.hpMax, 0, 1), barH);
    }

    // 减速提示：淡青色环
    if (enemy.slowTime > 0) {
      ctx.strokeStyle = 'rgba(62, 230, 255, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
}

/**
 * 画敌人子弹（红橙色小菱形）
 */
function drawEnemyBullets() {
  state.bullets.forEach((bullet) => {
    ctx.save();
    ctx.translate(bullet.x, bullet.y);
    ctx.rotate(Math.atan2(bullet.vy, bullet.vx));
    ctx.fillStyle = '#ff8a6b';
    ctx.shadowColor = '#ff6b7f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(-4, 4);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-4, -4);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  });
}

/**
 * 画玩家弹道（魔法紫光球 + 拖尾）
 */
function drawProjectiles() {
  state.projectiles.forEach((projectile) => {
    const color = '#b085ff';

    // 拖尾
    for (let i = 1; i <= 3; i += 1) {
      ctx.fillStyle = hexToRgba(color, 0.16 / i);
      ctx.beginPath();
      ctx.arc(
        projectile.x - projectile.vx * 0.008 * i,
        projectile.y - projectile.vy * 0.008 * i,
        projectile.radius * (1 - i * 0.18),
        0, Math.PI * 2
      );
      ctx.fill();
    }

    const glow = ctx.createRadialGradient(projectile.x, projectile.y, 1, projectile.x, projectile.y, projectile.radius + 12);
    glow.addColorStop(0, hexToRgba(color, 0.6));
    glow.addColorStop(1, hexToRgba(color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, projectile.radius + 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8dcff';
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
    ctx.fill();

    if (projectile.homing) {
      ctx.strokeStyle = 'rgba(255, 194, 71, 0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, projectile.radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
}

/**
 * 画玩家：青色机体 + 护盾环 + 再生光环 + 瞄准线
 */
function drawPlayer() {
  const player = state.player;
  const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 3);

  // 瞄准线（朝鼠标方向，短而克制）
  if (mouseState.moved) {
    const angle = Math.atan2(mouseState.worldY - player.y, mouseState.worldX - player.x);
    ctx.strokeStyle = 'rgba(62, 230, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(angle) * 20, player.y + Math.sin(angle) * 20);
    ctx.lineTo(player.x + Math.cos(angle) * 76, player.y + Math.sin(angle) * 76);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 再生光环（治疗融合技）
  if (player.aura > 0) {
    ctx.strokeStyle = 'rgba(71, 232, 167, ' + (0.25 + pulse * 0.18) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 62 + pulse * 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 护盾
  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(62, 230, 255, ' + (0.35 + pulse * 0.2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 26, 0, Math.PI * 2);
    ctx.stroke();
  }

  const glow = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, 54);
  glow.addColorStop(0, 'rgba(62, 230, 255, 0.2)');
  glow.addColorStop(1, 'rgba(62, 230, 255, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(player.x, player.y, 54, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  ctx.shadowColor = '#3ee6ff';
  ctx.shadowBlur = 14;

  // 机体六边形
  ctx.beginPath();
  for (let i = 0; i < 6; i += 1) {
    const angle = (Math.PI / 3) * i;
    const px = Math.cos(angle) * 16;
    const py = Math.sin(angle) * 16;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(10, 30, 42, 0.92)';
  ctx.fill();
  ctx.strokeStyle = player.hitFlash > 0 ? '#ff8a8a' : '#3ee6ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 朝向三角
  ctx.beginPath();
  ctx.moveTo(11, 0);
  ctx.lineTo(-5, 5);
  ctx.lineTo(-5, -5);
  ctx.closePath();
  ctx.fillStyle = '#d6f8ff';
  ctx.fill();

  // 中心符文点
  ctx.fillStyle = '#b085ff';
  ctx.beginPath();
  ctx.arc(0, 0, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 受伤红闪
  if (player.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255, 107, 127, ' + player.hitFlash * 0.25 + ')';
    ctx.beginPath();
    ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
    ctx.fill();
  }
}

/**
 * 画所有特效：光环、粒子、闪电、浮动文字
 */
function drawEffects() {
  // 冲击环
  state.rings.forEach((ring) => {
    const progress = 1 - ring.life / ring.maxLife;
    // grow：生命期内向外扩散的额外像素（冰环 / 冻结力场用）
    const radius = ring.radius + (ring.grow || 0) * progress;
    ctx.strokeStyle = ring.color;
    ctx.globalAlpha = Math.max(0, 1 - progress);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // 粒子
  state.particles.forEach((particle) => {
    const alpha = clamp(particle.life / particle.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = particle.color;
    ctx.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
    ctx.globalAlpha = 1;
  });

  // 闪电 / 连锁线
  state.beams.forEach((beam) => {
    const alpha = clamp(beam.life / beam.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = beam.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = beam.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    beam.points.forEach((point, index) => {
      if (index === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  // 浮动文字
  state.floats.forEach((floatText) => {
    const alpha = clamp(floatText.life / floatText.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = floatText.color;
    ctx.font = '600 ' + floatText.size + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(floatText.text, floatText.x, floatText.y);
    ctx.globalAlpha = 1;
  });

  ctx.textAlign = 'left';
}

}
