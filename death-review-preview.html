<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>烬 · 死亡归因（独立预览）</title>
<style>
  :root { --bg:#0d0f14; --panel:#161a22; --line:#2a3140; --text:#dfe7f2; --dim:#8d9bb0; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0%, #241a20, var(--bg) 60%); color:var(--text);
         font-family:"Microsoft YaHei", system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:1px; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; line-height:1.7; }
  .cols { display:grid; grid-template-columns:1.35fr 1fr; gap:16px; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button { background:#1e2634; color:#dfe7f2; border:1px solid #334055; border-radius:7px;
           padding:7px 11px; font-size:12px; cursor:pointer; }
  button:hover { border-color:#ff5c7a; color:#fff; }
  button.primary { background:#2a2026; border-color:#5d3a46; }
  .review-box { background:#11151c; border:1px solid #242c3b; border-radius:9px; padding:12px;
                min-height:280px; font-size:12px; line-height:1.7; }
  .p1-review { display:grid; gap:8px; }
  .p1-summary { margin:0; padding:9px 12px; border-radius:8px; background:rgba(52,16,22,.55);
                border-left:3px solid rgba(255,92,122,.7); color:#ffe1e6; font-size:13px; line-height:1.6; }
  .p1-summary b { color:#fff; }
  .p1-spike { margin:0; padding:7px 10px; border-radius:6px; background:rgba(255,92,122,.12);
              border:1px dashed rgba(255,92,122,.55); color:#ffc9d3; font-size:12px; }
  .p1-spike b { color:#fff; }
  .p1-verdict { padding:8px 10px; border-radius:8px; background:#161d28; border:1px solid #2a3345; }
  .p1-verdict-tag { font-size:16px; font-weight:700; color:#ff9a5a; }
  .p1-verdict-rule { font-size:11px; color:#93a2b8; margin-top:3px; }
  .p1-evidence-head { color:#9fb3c8; font-size:11px; letter-spacing:1px; margin:2px 0 4px; }
  .p1-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:#1b2130; }
  .p1-bar i { display:block; height:100%; }
  .p1-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin:6px 0 2px; }
  .p1-legend-item { color:#c9d4e3; font-size:11px; }
  .p1-legend-item i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .p1-legend-extra { color:rgba(255,255,255,.62); font-size:10px; }
  .p1-detail { color:#7f8ea3; font-size:11px; }
  .p1-detail b { color:#cfdae8; }
  .stat { display:flex; justify-content:space-between; font-size:12px; color:var(--dim);
          padding:4px 0; border-bottom:1px dashed #232a38; }
  .stat b { color:#dfe7f2; font-weight:600; }
  .log { height:150px; overflow:auto; font-family:Consolas, monospace; font-size:11px;
         line-height:1.65; color:#9fb3c8; background:#0f131a; border:1px solid #232a38;
         border-radius:7px; padding:8px; margin-top:8px; white-space:pre-wrap; }
  .note { margin-top:12px; color:#6f7d91; font-size:11px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>烬 · 死亡归因（独立预览）</h1>
  <p class="sub">
    三种死法同屏对比：近战打死 / 环境死 / 首领技死。账目只有一份（damagePlayer 写入），
    百分比用最大余数法，各项之和恒为 100；能读出“你在第几层”，并单独标出某一层的骤升来源。
  </p>

  <div class="cols">
    <div class="panel">
      <div class="btns">
        <button class="primary" data-case="melee">近战打死</button>
        <button class="primary" data-case="env">环境死</button>
        <button class="primary" data-case="boss">首领技死（带骤升）</button>
      </div>
      <div class="review-box" id="review"></div>
      <div class="note">
        断言口径：每类占比合计 100；总结必须包含“第 12 层”；图例里显示“最大单次 / 主凶”；
        首领场景会额外出现一条骤升标记。
      </div>
    </div>

    <div class="panel">
      <div class="stat"><span>死亡层</span><b id="stFloor">12</b></div>
      <div class="stat"><span>承伤合计</span><b id="stTotal">0</b></div>
      <div class="stat"><span>占比合计</span><b id="stPct">0</b></div>
      <div class="stat"><span>一句话总结</span><b id="stSummary" style="max-width:60%;text-align:right;">—</b></div>
      <div class="stat"><span>骤升项</span><b id="stSpike">—</b></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   预览用的最小配置（真实游戏里已存在）
   ============================================================ */
const READABILITY_CONFIG = { enabled: true, review: { enabled: true, topCards: 5 } };
const P1_STATS = { reviews: 0 };
const P1_CATEGORY_META = {
  boss: { name: '首领', color: '#ff5c7a' },
  melee: { name: '近战', color: '#ff9a5a' },
  ranged: { name: '远程', color: '#ffd166' },
  ground: { name: '地面持续', color: '#ff8fb0' },
  env: { name: '环境/陷阱', color: '#a8e6ff' },
  self: { name: '自伤', color: '#b6ff6b' },
  other: { name: '其它', color: '#9fb3c8' }
};
const P1_VERDICT_LABEL = {
  boss: '被首领', melee: '被围', ranged: '被远程',
  ground: '被地面持续', env: '被环境/陷阱', self: '自伤类',
  other: '未知', unknown: '未知'
};
const P1_SPIKE_RULE = { mul: 2.0, minFloorPct: 25, minFloorDmg: 12 };

const state = { floor: 12, p1Ledger: null, lastHit: { name: '裁决者', amount: 38 }, meta: {} };

/* ============================================================
   以下为补丁里的真实函数（与 DEATH_REVIEW_PATCH.md 保持一致）
   ============================================================ */
function p1ReviewReady() { return !!(READABILITY_CONFIG.enabled && READABILITY_CONFIG.review.enabled); }

function p1LedgerReset() {
  const zero = { boss: 0, melee: 0, ranged: 0, ground: 0, env: 0, self: 0, other: 0 };
  state.p1Ledger = {
    incoming: {
      total: 0, hits: 0,
      byCat: Object.assign({}, zero),
      hitsByCat: Object.assign({}, zero),
      maxHit: Object.assign({}, zero),
      sourceByCat: {},
      meleeNames: {},
      floors: {}
    },
    outgoing: { total: 0, byId: {} }
  };
  return state.p1Ledger;
}

function p1CategoryOf(cause) {
  const kind = (cause && cause.kind) || 'unknown';
  if (cause && cause.bossKind) return 'boss';
  if (kind === 'barrel') return 'self';
  if (kind === 'hazard') return 'ground';
  if (kind === 'sigil' || kind === 'collapse') return 'env';
  if (kind === 'bullet' || kind === 'burst') return 'ranged';
  if (kind === 'contact' || kind === 'charge' || kind === 'selfdestruct') return 'melee';
  return 'other';
}

function p1NoteIncoming(amount, cause) {
  const v = Math.round(Number(amount) || 0);
  if (v <= 0) return;
  const L = state.p1Ledger || p1LedgerReset();
  const cat = p1CategoryOf(cause);
  const srcName = (cause && cause.name) ? String(cause.name) : '未知来源';
  const floorKey = String(state.floor || 0);

  L.incoming.total += v;
  L.incoming.hits += 1;
  L.incoming.byCat[cat] = (L.incoming.byCat[cat] || 0) + v;
  L.incoming.hitsByCat[cat] = (L.incoming.hitsByCat[cat] || 0) + 1;
  L.incoming.maxHit[cat] = Math.max(Number(L.incoming.maxHit[cat]) || 0, v);

  const src = L.incoming.sourceByCat[cat] || (L.incoming.sourceByCat[cat] = {});
  src[srcName] = (Number(src[srcName]) || 0) + v;

  const floorAcc = L.incoming.floors[floorKey]
    || (L.incoming.floors[floorKey] = { total: 0, byCat: {} });
  floorAcc.total += v;
  floorAcc.byCat[cat] = (Number(floorAcc.byCat[cat]) || 0) + v;

  if (cat === 'melee' && cause && cause.name) {
    const key = String(cause.name);
    L.incoming.meleeNames[key] = (L.incoming.meleeNames[key] || 0) + 1;
  }
}

function p1PercentMap(items, total) {
  const out = {};
  const list = Array.isArray(items) ? items : [];
  list.forEach((item) => { out[item.key] = 0; });
  if (!(total > 0) || !list.length) return out;
  let used = 0;
  const rests = [];
  list.forEach((item) => {
    const exact = item.value / total * 100;
    const base = Math.floor(exact);
    out[item.key] = base;
    used += base;
    rests.push({ key: item.key, rest: exact - base });
  });
  rests.sort((a, b) => b.rest - a.rest);
  let left = Math.max(0, 100 - used);
  for (let i = 0; i < rests.length && left > 0; i += 1) {
    out[rests[i].key] += 1;
    left -= 1;
  }
  return out;
}

function p1IncomingList(ledger) {
  const L = ledger || state.p1Ledger;
  if (!L || !(L.incoming.total > 0)) return [];
  const raw = Object.keys(P1_CATEGORY_META)
    .map((key) => ({ key: key, value: L.incoming.byCat[key] || 0 }))
    .filter((item) => item.value > 0);
  const pctMap = p1PercentMap(raw, L.incoming.total);
  const floorKey = String(state.floor || 0);
  const floorAcc = (L.incoming.floors && L.incoming.floors[floorKey]) || null;

  return raw.map((item) => {
    const srcMap = (L.incoming.sourceByCat && L.incoming.sourceByCat[item.key]) || {};
    let topName = '';
    let topDmg = 0;
    Object.keys(srcMap).forEach((name) => {
      const dmg = Number(srcMap[name]) || 0;
      if (dmg > topDmg) { topDmg = dmg; topName = name; }
    });
    const floorDmg = floorAcc ? (Number(floorAcc.byCat[item.key]) || 0) : 0;
    return {
      key: item.key,
      name: P1_CATEGORY_META[item.key].name,
      color: P1_CATEGORY_META[item.key].color,
      value: item.value,
      pct: pctMap[item.key],
      hits: L.incoming.hitsByCat[item.key] || 0,
      maxHit: Number(L.incoming.maxHit[item.key]) || 0,
      topName: topName,
      topDmg: topDmg,
      deathFloorDmg: floorDmg,
      deathFloorPct: (floorAcc && floorAcc.total > 0) ? Math.round(floorDmg / floorAcc.total * 100) : 0
    };
  }).sort((a, b) => b.value - a.value);
}

function p1OutgoingList(ledger) {
  const L = ledger || state.p1Ledger;
  if (!L || !(L.outgoing.total > 0)) return [];
  const all = Object.keys(L.outgoing.byId).map((id) => ({
    key: id, name: L.outgoing.byId[id].name, fusion: L.outgoing.byId[id].fusion,
    value: L.outgoing.byId[id].dmg
  })).sort((a, b) => b.value - a.value);
  const pctMap = p1PercentMap(all, L.outgoing.total);
  const palette = ['#ff9a5a', '#7fd8ff', '#a8e6ff', '#b6ff6b', '#ffd166', '#ff5c7a', '#9fb3c8'];
  return all.map((item, index) => ({
    key: item.key, name: item.name, fusion: item.fusion, value: item.value,
    pct: pctMap[item.key], color: palette[index % palette.length]
  }));
}

function p1Shares(ledger) {
  const L = ledger || state.p1Ledger;
  return {
    incoming: { total: L ? (L.incoming.total || 0) : 0, list: p1IncomingList(L) },
    outgoing: { total: L ? (L.outgoing.total || 0) : 0, list: p1OutgoingList(L) }
  };
}

function p1SpikeFor(ledger) {
  const list = p1IncomingList(ledger);
  if (!list.length) return null;
  let best = null;
  list.forEach((item) => {
    if (item.deathFloorDmg < P1_SPIKE_RULE.minFloorDmg) return;
    if (item.deathFloorPct < P1_SPIKE_RULE.minFloorPct) return;
    if (item.deathFloorPct < item.pct * P1_SPIKE_RULE.mul) return;
    const gap = item.deathFloorPct - item.pct;
    if (!best || gap > best.gap) {
      best = {
        key: item.key, name: item.name, runPct: item.pct,
        floorPct: item.deathFloorPct, maxHit: item.maxHit, gap: gap
      };
    }
  });
  return best;
}

function p1DeathVerdict(ledger) {
  const L = ledger || state.p1Ledger;
  const total = L ? (L.incoming.total || 0) : 0;
  if (!L || total <= 0) {
    return { tag: 'unknown', label: P1_VERDICT_LABEL.unknown, rule: '本局没有记录到承伤，无法判定死因' };
  }
  const share = (key) => (L.incoming.byCat[key] || 0) / total;
  const pctText = (key) => Math.round(share(key) * 100);
  const meleeNames = Object.keys(L.incoming.meleeNames || {}).length;
  const meleeHits = L.incoming.hitsByCat.melee || 0;

  if (share('boss') >= 0.40) return { tag: 'boss', label: P1_VERDICT_LABEL.boss, rule: '首领伤害占 ' + pctText('boss') + '%（阈值 ≥40%）' };
  if (share('self') >= 0.30) return { tag: 'self', label: P1_VERDICT_LABEL.self, rule: '自伤占 ' + pctText('self') + '%（阈值 ≥30%）' };
  if (share('ground') >= 0.45) return { tag: 'ground', label: P1_VERDICT_LABEL.ground, rule: '地面持续伤害占 ' + pctText('ground') + '%（阈值 ≥45%）' };
  if (share('env') >= 0.45) return { tag: 'env', label: P1_VERDICT_LABEL.env, rule: '环境/陷阱伤害占 ' + pctText('env') + '%（阈值 ≥45%）' };
  if (share('ranged') >= 0.45) return { tag: 'ranged', label: P1_VERDICT_LABEL.ranged, rule: '远程伤害占 ' + pctText('ranged') + '%（阈值 ≥45%）' };
  if (share('melee') >= 0.50 && (meleeNames >= 2 || meleeHits >= 5)) {
    return { tag: 'melee', label: P1_VERDICT_LABEL.melee, rule: '近战伤害占 ' + pctText('melee') + '%（阈值 ≥50%）' };
  }
  let best = 'other';
  let bestValue = -1;
  Object.keys(P1_CATEGORY_META).forEach((key) => {
    const value = L.incoming.byCat[key] || 0;
    if (value > bestValue) { best = key; bestValue = value; }
  });
  return { tag: best, label: P1_VERDICT_LABEL[best] || P1_VERDICT_LABEL.unknown,
    rule: '最大承伤来源为「' + P1_CATEGORY_META[best].name + '」占 ' + Math.round(bestValue / total * 100) + '%（未触发专项阈值）' };
}

function buildShareBarHtml(list, kind, emptyText) {
  if (!list || !list.length) return '<div class="p1-bar-empty">' + emptyText + '</div>';
  const bar = list.map((item) => '<i style="width:' + item.pct + '%;background:' + item.color + '"></i>').join('');
  const legend = list.map((item) => {
    const extra = kind === 'in'
      ? '<span class="p1-legend-extra">'
        + (item.maxHit ? ' · 最大 ' + item.maxHit + ' 点' : '')
        + (item.topName ? ' · 主凶 ' + item.topName : '')
        + '</span>'
      : '';
    return '<span class="p1-legend-item" data-p1-share="' + kind + ':' + item.key + '"'
      + ' data-p1-pct="' + item.pct + '" data-p1-value="' + item.value + '"'
      + (kind === 'in' ? ' data-p1-max="' + (item.maxHit || 0) + '" data-p1-top="' + (item.topName || '') + '"' : '')
      + '><i style="background:' + item.color + '"></i>'
      + item.name + ' ' + item.pct + '% · ' + item.value + ' 点' + extra + '</span>';
  }).join('');
  return '<div class="p1-bar" data-p1-bar="' + kind + '">' + bar + '</div>'
    + '<div class="p1-legend">' + legend + '</div>';
}

/** 一句话总结（结算页与自检共用，避免两套文案） */
function p1SummaryText(death, list) {
  const topCat = list && list.length ? list[0] : null;
  const killer = (death && death.name) ? death.name
    : ((state.lastHit && state.lastHit.name) || '不明伤害');
  return topCat
    ? ('你在第 ' + state.floor + ' 层被' + killer + '打死，' + topCat.name
      + '占 ' + topCat.pct + '%，其中一次 ' + (topCat.maxHit || 0) + ' 点。')
    : ('你在第 ' + state.floor + ' 层倒下，本局没有记录到承伤。');
}

function buildReviewHtml(death, won) {
  if (!p1ReviewReady()) return '';
  const L = state.p1Ledger || p1LedgerReset();
  const shares = p1Shares(L);
  const verdict = won ? null : p1DeathVerdict(L);
  const spike = won ? null : p1SpikeFor(L);
  const inTotal = shares.incoming.total;
  const outTotal = shares.outgoing.total;
  const hits = L.incoming.hits || 0;
  const fatal = death && death.amount ? death.amount : ((state.lastHit && state.lastHit.amount) || 0);

  let html = '<div class="p1-review ' + (won ? 'p1-win' : 'p1-lose') + '"'
    + ' data-p1-review="' + (won ? 'win' : 'lose') + '"'
    + ' data-p1-total-in="' + inTotal + '" data-p1-total-out="' + outTotal + '"'
    + (verdict ? ' data-p1-tag="' + verdict.tag + '"' : '') + '>';

  if (!won) {
    html += '<div class="p1-summary" data-p1-summary="1">'
      + p1SummaryText(death, shares.incoming.list) + '</div>';
  }
  if (verdict) {
    html += '<div class="p1-verdict"><div class="p1-verdict-tag">' + verdict.label + '</div>'
      + '<div class="p1-verdict-rule">判定 · ' + verdict.rule + '</div></div>';
  }
  html += '<div class="p1-evidence">'
    + '<div class="p1-evidence-head">证据 · 你受到的伤害来自哪里</div>'
    + buildShareBarHtml(shares.incoming.list, 'in', '本局没有记录到承伤')
    + (spike
      ? '<div class="p1-spike" data-p1-spike="' + spike.key + '">这一层 <b>' + spike.name
        + '</b> 伤害突然飙升：占 <b>' + spike.floorPct + '%</b>（本局平均 ' + spike.runPct
        + '%），最高一次 <b>' + spike.maxHit + ' 点</b>。</div>'
      : '')
    + '<div class="p1-evidence-head">复盘 · 你的输出构成（按卡与融合）</div>'
    + buildShareBarHtml(shares.outgoing.list, 'out', '本局没有记录到输出')
    + '</div>';
  html += '<div class="p1-detail">总承伤 <b>' + inTotal + '</b> 点 · 受击 <b>' + hits
    + '</b> 次 · 致命一击 <b>' + fatal + '</b> 点 · 总输出 <b>' + outTotal + '</b> 点</div>';
  html += '</div>';
  return html;
}

/* ============================================================
   预览交互：构造三种死法
   ============================================================ */
function log(text) {
  const el = document.getElementById('log');
  el.textContent += (el.textContent ? '\n' : '') + text;
  el.scrollTop = el.scrollHeight;
}
function at(floor, amount, kind, name, bossKind) {
  state.floor = floor;
  p1NoteIncoming(amount, { kind: kind, name: name, bossKind: bossKind });
}
function scenario(kind) {
  p1LedgerReset();
  state.floor = 12;
  if (kind === 'melee') {
    at(12, 38, 'contact', '裁决者');
    at(12, 20, 'contact', '裁决者');
    at(12, 10, 'bullet', '炮台');
    at(11, 5, 'hazard', '落锤');
    state.lastHit = { name: '裁决者', amount: 38 };
  } else if (kind === 'env') {
    at(12, 20, 'hazard', '落锤');
    at(12, 20, 'hazard', '落锤');
    at(12, 10, 'sigil', '符阵');
    at(11, 10, 'hazard', '落锤');
    state.lastHit = { name: '落锤', amount: 20 };
  } else if (kind === 'boss') {
    at(11, 20, 'contact', '裁决者');
    at(10, 20, 'bullet', '炮台');
    at(12, 40, 'contact', '裁决者', true);
    state.lastHit = { name: '裁决者', amount: 40 };
  }
  state.floor = 12;
  render();
  log('CASE ' + kind + ' → 合计 ' + state.p1Ledger.incoming.total
    + '，占比合计 ' + pctSum() + (p1SpikeFor() ? '，有骤升' : '，无骤升'));
}
function pctSum() { return p1IncomingList().reduce((sum, item) => sum + item.pct, 0); }
function render() {
  const death = { name: state.lastHit.name, amount: state.lastHit.amount, quote: null };
  document.getElementById('review').innerHTML = buildReviewHtml(death, false);
  document.getElementById('stFloor').textContent = state.floor;
  document.getElementById('stTotal').textContent = state.p1Ledger.incoming.total;
  document.getElementById('stPct').textContent = pctSum() + '%';
  document.getElementById('stSummary').textContent = p1SummaryText(death, p1IncomingList());
  const spike = p1SpikeFor();
  document.getElementById('stSpike').textContent = spike
    ? (spike.name + ' · 本层 ' + spike.floorPct + '% vs 全局 ' + spike.runPct + '%')
    : '—';
}
document.querySelectorAll('[data-case]').forEach((btn) => {
  btn.addEventListener('click', () => scenario(btn.getAttribute('data-case')));
});

/* ============================================================
   自检口
   ============================================================ */
window.__previewDebug = {
  p1: {
    scenario(kind) { scenario(kind); return this.info(); },
    reset(floor) {
      state.floor = Number(floor) || 12;
      state.p1Ledger = p1LedgerReset();
      return this.info();
    },
    note(floor, amount, kind, name, bossKind) {
      at(Number(floor) || 12, Number(amount) || 0, String(kind || 'other'), String(name || ''), !!bossKind);
      return this.info();
    },
    finish(floor, killer, amount) {
      state.floor = Number(floor) || 12;
      state.lastHit = { name: String(killer || '不明伤害'), amount: Number(amount) || 0 };
      render();
      return this.info();
    },
    summary() {
      const death = { name: state.lastHit.name, amount: state.lastHit.amount };
      return p1SummaryText(death, p1IncomingList());
    },
    detail() {
      return p1IncomingList().map((item) => ({
        key: item.key, pct: item.pct, maxHit: item.maxHit,
        topName: item.topName, deathFloorPct: item.deathFloorPct
      }));
    },
    spike() { return p1SpikeFor(); },
    pctSum() { return pctSum(); },
    html() { return document.getElementById('review').innerHTML; },
    info() {
      return {
        floor: state.floor,
        total: state.p1Ledger ? state.p1Ledger.incoming.total : 0,
        pctSum: pctSum(),
        list: this.detail(),
        summary: this.summary(),
        spike: this.spike()
      };
    }
  }
};
scenario('melee');
log('READY 预览已就绪');
