<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烬 · 成就面板预览</title>
<link rel="stylesheet" href="./ach-panel.css">
<style>
  /* ============================================================
     预览页样式（只属于预览，不进入游戏包体）
     ------------------------------------------------------------
     背景用 CSS 渐变 / 网格 / 暗角模拟游戏大厅，面板本体全部样式
     来自 ach-panel.css；本页只负责顶栏、三种状态切换与实测读数。
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    overflow: hidden;
    background: #05070c;
    color: #c3d7ef;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  }

  .pv-shell { display: flex; flex-direction: column; height: 100vh; }

  /* --- 顶栏：品牌 / 三态切换 / 实测读数 --- */
  .pv-top {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 22px;
    flex: none;
    padding: 12px 26px;
    border-bottom: 1px solid rgba(140, 178, 228, .16);
    background: linear-gradient(180deg, rgba(10, 16, 28, .96), rgba(5, 8, 14, .82));
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  .pv-brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pv-eyebrow {
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10.5px;
    letter-spacing: .22em;
    color: #5ce6ff;
  }
  .pv-brand h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .05em;
    color: #eaf5ff;
    white-space: nowrap;
  }
  .pv-brand h1 em {
    font-style: normal;
    margin-left: 8px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10.5px;
    letter-spacing: .16em;
    color: #93a6c4;
  }

  /* 三种状态：全部完成 / 全未完成 / 混合 */
  .pv-modes {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border: 1px solid rgba(140, 178, 228, .22);
    border-radius: 10px;
    background: rgba(7, 10, 18, .56);
  }
  .pv-mode {
    height: 30px;
    padding: 0 13px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: none;
    color: #a8bfdc;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .14s ease, background-color .14s ease, color .14s ease;
  }
  .pv-mode:hover { color: #eaf5ff; border-color: rgba(92, 230, 255, .22); }
  .pv-mode.is-active {
    border-color: rgba(92, 230, 255, .55);
    background: linear-gradient(180deg, rgba(92, 230, 255, .16), rgba(92, 230, 255, .04));
    color: #e9feff;
    box-shadow: 0 0 16px rgba(92, 230, 255, .14);
  }
  .pv-mode:focus-visible { outline: 2px solid #ffc247; outline-offset: 2px; }

  /* 实测读数：渲染耗时 / 滚动帧率 / 外部请求 */
  .pv-perf {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: auto;
    padding: 7px 12px;
    border: 1px solid rgba(140, 178, 228, .20);
    border-radius: 9px;
    background: rgba(7, 10, 18, .48);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 10.5px;
    line-height: 1.6;
    color: #93a6c4;
    white-space: nowrap;
  }
  .pv-perf b { font-weight: 700; color: #eaf5ff; }
  .pv-perf .is-ok { color: #47e8a7; }
  .pv-perf .is-gold { color: #ffc247; }
  .pv-hint {
    font-size: 11px;
    color: #93a6c4;
    white-space: nowrap;
  }
  .pv-hint code {
    padding: 1px 5px;
    border: 1px solid rgba(140, 178, 228, .22);
    border-radius: 4px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    color: #c3d7ef;
  }

  /* --- 舞台：模拟游戏大厅的地面 + 暗角 --- */
  .pv-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    padding: 22px 26px 30px;
    background:
      radial-gradient(760px 460px at 50% 12%, rgba(176, 133, 255, .12), transparent 70%),
      radial-gradient(620px 420px at 16% 88%, rgba(92, 230, 255, .07), transparent 70%),
      linear-gradient(180deg, #0a1120, #05070c 72%);
    overflow: hidden;
  }
  /* 地砖网格：44px 一格，向外淡出，只做氛围 */
  .pv-stage::before {
    content: "";
    position: absolute;
    inset: -10%;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(120, 170, 230, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 230, .045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 70% 62% at 50% 48%, #000 20%, transparent 78%);
    mask-image: radial-gradient(ellipse 70% 62% at 50% 48%, #000 20%, transparent 78%);
    transform: perspective(900px) rotateX(62deg) translateY(16%);
    transform-origin: 50% 80%;
  }
  /* 四角压暗 0.35，中心不压 */
  .pv-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 82% 74% at 50% 46%, transparent 52%, rgba(0, 0, 0, .35) 100%);
  }
  .pv-host { position: relative; z-index: 2; display: flex; justify-content: center; }

  @media (max-width: 1180px) {
    .pv-hint { display: none; }
    .pv-brand h1 em { display: none; }
  }
  @media (max-width: 960px) {
    .pv-top { flex-wrap: wrap; gap: 10px 16px; padding: 10px 16px; }
    .pv-perf { margin-left: 0; }
    .pv-stage { padding: 14px 12px 18px; }
  }
</style>
</head>
<body>
<div class="pv-shell">
  <header class="pv-top">
    <div class="pv-brand">
      <span class="pv-eyebrow">EMBERFALL · UI PREVIEW</span>
      <h1>成就面板 <em>ACHIEVEMENTS / 38</em></h1>
    </div>

    <div class="pv-modes" role="group" aria-label="成就状态切换">
      <button type="button" class="pv-mode" data-mode="done">全部完成</button>
      <button type="button" class="pv-mode" data-mode="none">全未完成</button>
      <button type="button" class="pv-mode is-active" data-mode="mixed">混合</button>
    </div>

    <div class="pv-perf" id="pvPerf" aria-live="polite">
      <span>渲染 <b id="pvRender">—</b></span>
      <span>滚动 <b id="pvScroll">—</b></span>
      <span>外部请求 <b id="pvNet" class="is-ok">0</b></span>
    </div>
    <span class="pv-hint">接入后在地址栏加 <code>?ach=off</code> 可关闭</span>
  </header>

  <main class="pv-stage">
    <div class="pv-host" id="achHost"></div>
  </main>
</div>

<script src="./ach-panel.js"></script>
<script>
/* ============================================================
   预览页脚本
   ------------------------------------------------------------
   1) 读 URL 参数：state / tab / sort / locked / open，方便截图复现；
   2) 顶部三态按钮一键切换 done / none / mixed；
   3) 展示全量渲染耗时、滚动帧率 p95、外部请求条数；
   4) 把 scroll 测完复位到顶部，截图不会停在半途。
   ============================================================ */
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var state = params.get('state') || 'mixed';
  var tab = params.get('tab') || 'all';
  var sort = params.get('sort') || 'category';
  var locked = params.get('locked') === '1';
  var openId = params.get('open') || null;

  var ctrl = window.ACHPanel ? ACHPanel.mount('#achHost', {
    mode: state,
    tab: tab,
    sort: sort,
    onlyLocked: locked,
    open: openId
  }) : { ok: false };

  var refs = {
    render: document.getElementById('pvRender'),
    scroll: document.getElementById('pvScroll'),
    net: document.getElementById('pvNet'),
    modes: Array.prototype.slice.call(document.querySelectorAll('.pv-mode'))
  };

  /**
   * 同步三态按钮的选中样式。
   * @param {string} mode 当前状态
   * @returns {void}
   */
  function paintModes(mode) {
    refs.modes.forEach(function (btn) {
      var on = btn.getAttribute('data-mode') === mode;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /**
   * 显示渲染耗时。
   * @param {Object} stats { renderMs, cards, total }
   * @returns {void}
   */
  function showRender(stats) {
    refs.render.textContent = stats.cards + ' 条 / ' + stats.renderMs.toFixed(2) + ' ms';
  }

  /**
   * 统计 http(s) 外部资源条数（应为 0）。
   * @returns {number} 外部请求条数
   */
  function externalCount() {
    var list = performance.getEntriesByType('resource') || [];
    return list.filter(function (e) { return /^https?:\/\//i.test(e.name); }).length;
  }

  /**
   * 滚动采样：把列表从上滚到底再回来，记录每帧间隔。
   * @param {number} [duration=1400] 采样时长（ms）
   * @returns {Promise<Object|null>} { fps, p95, dropped, frames }；无法滚动返回 null
   */
  function measureScroll(duration) {
    return new Promise(function (resolve) {
      if (!ctrl.ok || !ctrl.panel) { resolve(null); return; }
      var body = ctrl.panel.querySelector('[data-ach-body]');
      if (!body) { resolve(null); return; }
      var max = body.scrollHeight - body.clientHeight;
      if (max < 60) { resolve(null); return; }

      var ms = duration || 1400;
      var frames = [];
      var t0 = 0;
      var last = 0;
      body.scrollTop = 0;

      /**
       * 每帧滚动到正弦位置，同时记录帧间隔。
       * @param {number} now rAF 时间戳
       * @returns {void}
       */
      function tick(now) {
        if (!t0) { t0 = now; last = now; }
        var dt = now - last;
        last = now;
        if (dt > 0 && dt < 120) frames.push(dt);

        var t = (now - t0) / ms;
        body.scrollTop = (Math.sin(t * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5) * max;

        if (now - t0 < ms) {
          requestAnimationFrame(tick);
          return;
        }
        body.scrollTop = 0;
        var sum = frames.reduce(function (a, b) { return a + b; }, 0);
        var sorted = frames.slice().sort(function (a, b) { return a - b; });
        var p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))] || 0;
        var dropped = frames.filter(function (d) { return d > 20; }).length;
        resolve({
          fps: frames.length ? Math.round((1000 / (sum / frames.length)) * 10) / 10 : 0,
          p95: Math.round(p95 * 10) / 10,
          dropped: dropped,
          frames: frames.length
        });
      }
      requestAnimationFrame(tick);
    });
  }

  /**
   * 跑一次滚动测试并把结果写进顶栏，同时暴露到 window 供无头实测读取。
   * @returns {Promise<void>}
   */
  function runScroll() {
    return measureScroll(1400).then(function (r) {
      if (!r) { refs.scroll.textContent = '条目不足'; window.__achPerf = null; return; }
      refs.scroll.textContent = r.fps.toFixed(1) + ' fps · p95 ' + r.p95.toFixed(1) + ' ms';
      refs.scroll.className = r.p95 <= 16.7 ? 'is-ok' : 'is-gold';
      window.__achPerf = r;
    });
  }

  /**
   * 把面板实际尺寸写进 body 的 data 属性，便于无头抓 DOM 时核对
   * 「38 条全渲染是否真的产生滚动」。不显示、不影响视觉。
   * @returns {void}
   */
  function debugInfo() {
    var d = { ok: ctrl.ok };
    if (ctrl.ok && ctrl.panel) {
      var body = ctrl.panel.querySelector('[data-ach-body]');
      var grid = ctrl.panel.querySelector('[data-ach-grid]');
      var panel = ctrl.panel;
      d.clientH = body ? body.clientHeight : 0;
      d.scrollH = body ? body.scrollHeight : 0;
      d.gridH = grid ? Math.round(grid.getBoundingClientRect().height) : 0;
      d.cards = grid ? grid.querySelectorAll('.ach-card').length : 0;
      d.panelH = Math.round(panel.getBoundingClientRect().height);
      d.panelW = Math.round(panel.getBoundingClientRect().width);
      d.cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      d.dpr = window.devicePixelRatio;
    }
    document.body.setAttribute('data-ach-debug', JSON.stringify(d));
  }

  /**
   * 热渲染基准：在视口外连开 5 次同规格面板，取挂载耗时中位数。
   * 首屏冷启动包含整页首次布局与字体初始化，不适合作为面板常态耗时，
   * 因此顶栏显示热开中位数，冷启动区间写在 ach-panel.md。
   * @returns {number|null} 中位数毫秒；失败返回 null
   */
  function warmBench() {
    if (!ctrl.ok) return null;
    var values = [];
    for (var i = 0; i < 5; i += 1) {
      var host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:0;top:0;width:1120px;height:760px;'
        + 'opacity:.01;pointer-events:none;z-index:-1';
      document.body.appendChild(host);
      var t0 = performance.now();
      var p = ACHPanel.mount(host, { mode: 'mixed' });
      void p.panel.getBoundingClientRect();
      values.push(performance.now() - t0);
      p.destroy();
      host.remove();
    }
    values.sort(function (a, b) { return a - b; });
    var mid = values[Math.floor(values.length / 2)];
    window.__achWarm = Math.round(mid * 100) / 100;
    return window.__achWarm;
  }

  /* 三态切换：只换数据，不重建面板，顺便刷新渲染读数 */
  refs.modes.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.getAttribute('data-mode');
      if (ctrl.ok) {
        ctrl.setMode(mode);
        showRender(ctrl.getStats());
      }
      paintModes(mode);
      runScroll();
    });
  });

  /**
   * 把热开中位数写回顶栏；页面忙时不测，避免把首次布局算进去。
   * @returns {void}
   */
  function showWarm() {
    var warm = warmBench();
    if (warm != null) refs.render.textContent = '38 条 / ' + warm.toFixed(2) + ' ms（热开）';
    debugInfo();
  }

  /* 初始化读数：先显示首屏，等页面稳定后再跑热开基准 */
  paintModes(state);
  if (ctrl.ok) showRender(ctrl.getStats());
  debugInfo();
  refs.net.textContent = String(externalCount());
  if (openId) refs.scroll.textContent = '详情态跳过';

  /* 等首屏排完再跑滚动测试；详情截图（open）不滚，直接测热开 */
  setTimeout(function () {
    debugInfo();
    refs.net.textContent = String(externalCount());
    if (openId) {
      showWarm();
      return;
    }
    runScroll().then(showWarm);
  }, 700);

  /* 调试 / 无头实测入口 */
  window.ACH_PREVIEW = {
    controller: ctrl,
    measureScroll: measureScroll,
    runScroll: runScroll,
    externalCount: externalCount,
    setState: function (mode) {
      if (ctrl.ok) { ctrl.setMode(mode); showRender(ctrl.getStats()); }
      paintModes(mode);
      return runScroll();
    }
  };
})();
</script>
</body>
</html>
