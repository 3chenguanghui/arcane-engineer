<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>量子采集计划 · 自由采集合成</title>
<style>
  /* ============================================================
     样式区：科技感深色 HUD + Canvas 全屏探索界面
     ============================================================ */
  :root {
    --bg: #04070f;
    --panel: rgba(8, 16, 30, 0.82);
    --panel-2: rgba(12, 24, 42, 0.92);
    --line: rgba(92, 170, 255, 0.22);
    --line-strong: rgba(92, 210, 255, 0.5);
    --text: #dcecff;
    --muted: #7f95b8;
    --cyan: #3ee6ff;
    --green: #47e8a7;
    --gold: #ffc247;
    --violet: #b085ff;
    --pink: #ff6bc1;
    --red: #ff6b7f;
    --mono: "Consolas", "Cascadia Mono", "Courier New", monospace;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  button { font-family: inherit; }

  /* 游戏画布铺满窗口，HUD 以悬浮层叠在上面 */
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle at 50% 48%, transparent 42%, rgba(2, 6, 12, 0.78) 100%);
  }

  .hud {
    position: fixed;
    top: 14px;
    left: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px 16px;
    pointer-events: none;
  }

  .brand-block {
    min-width: 218px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(14, 28, 48, 0.92), rgba(6, 12, 23, 0.86));
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .logo {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #ecfaff;
    text-shadow: 0 0 18px rgba(62, 230, 255, 0.45);
  }
  .logo span { color: var(--cyan); }
  .brand-sub {
    margin-top: 4px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    pointer-events: none;
  }
  .stat {
    min-width: 92px;
    padding: 8px 11px 7px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .stat > span {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .stat b {
    font-family: var(--mono);
    font-size: 19px;
    line-height: 1.15;
    color: #dff6ff;
    font-weight: 700;
  }
  .stat b small {
    font-size: 10px;
    color: var(--muted);
    font-family: inherit;
    margin-left: 2px;
    font-weight: 400;
  }
  .stat-time b { color: #c7ecff; }
  .stat-time.is-low { border-color: rgba(255, 107, 127, 0.5); background: rgba(42, 10, 20, 0.8); }
  .stat-time.is-low b { color: #ff9aa7; animation: lowPulse 1s ease-in-out infinite; }
  @keyframes lowPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .pips { display: flex; gap: 4px; margin-top: 2px; }
  .pips i {
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: rgba(120, 170, 220, 0.16);
    border: 1px solid rgba(120, 170, 220, 0.2);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .pips.tech i.is-on { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px rgba(71, 232, 167, 0.7); }
  .pips.progress i { width: 15px; }
  .pips.progress i.is-on { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px rgba(62, 230, 255, 0.65); }
  .pips.progress i span {
    display: none;
  }

  .hud-actions {
    margin-left: auto;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    pointer-events: auto;
  }
  .minimap-box {
    position: relative;
    width: 158px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }
  #minimap {
    display: block;
    width: 148px;
    height: 107px;
    border-radius: 8px;
    background: #050b16;
  }
  .minimap-box::after {
    content: "区域地图";
    position: absolute;
    left: 10px;
    top: 8px;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(150, 190, 230, 0.55);
    pointer-events: none;
  }

  .btns { display: flex; flex-direction: column; gap: 6px; }

  .btn {
    position: relative;
    padding: 8px 13px;
    border-radius: 9px;
    border: 1px solid var(--line-strong);
    background: rgba(18, 34, 58, 0.78);
    color: #d9ecff;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    pointer-events: auto;
  }
  .btn:hover { transform: translateY(-1px); border-color: rgba(120, 235, 255, 0.85); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { cursor: not-allowed; opacity: 0.42; transform: none; box-shadow: none; }
  .btn-primary {
    border-color: rgba(71, 232, 167, 0.45);
    background: linear-gradient(180deg, rgba(20, 80, 69, 0.75), rgba(9, 35, 31, 0.8));
    color: #baffdf;
  }
  .btn-primary.is-ready { animation: readyPulse 1.7s ease-in-out infinite; }
  @keyframes readyPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(71, 232, 167, 0.24); }
    50% { box-shadow: 0 0 0 6px rgba(71, 232, 167, 0.06), 0 0 20px rgba(71, 232, 167, 0.28); }
  }
  .btn-danger {
    border-color: rgba(255, 107, 127, 0.35);
    background: rgba(52, 14, 25, 0.7);
    color: #ffc4cc;
  }
  .btn small { opacity: 0.6; font-size: 10px; margin-left: 3px; }

  /* 目标条 */
  .goalbar {
    position: fixed;
    left: 50%;
    bottom: 154px;
    transform: translateX(-50%);
    z-index: 9;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: min(820px, 94vw);
    padding: 7px 14px;
    border: 1px solid rgba(92, 170, 255, 0.16);
    border-radius: 999px;
    background: rgba(6, 13, 24, 0.76);
    font-size: 11.5px;
    color: #94aac9;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .goalbar b { color: #dff7ff; font-weight: 600; }
  .goalbar .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 9px var(--cyan);
    animation: dotBlink 1.6s ease-in-out infinite;
    flex: none;
  }
  @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 背包 */
  .backpack-wrap {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: min(860px, calc(100vw - 22px));
    padding: 9px 12px 8px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: linear-gradient(180deg, rgba(12, 23, 40, 0.95), rgba(6, 11, 21, 0.92));
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    z-index: 20;
  }
  .backpack-wrap.is-full { border-color: rgba(255, 107, 127, 0.5); box-shadow: 0 0 26px rgba(255, 107, 127, 0.14), 0 18px 44px rgba(0, 0, 0, 0.55); }
  .backpack-wrap.is-denied { animation: bagDeny 0.38s ease; }
  @keyframes bagDeny {
    0%, 100% { transform: translateX(-50%); }
    20% { transform: translateX(calc(-50% - 7px)); }
    45% { transform: translateX(calc(-50% + 6px)); }
    70% { transform: translateX(calc(-50% - 3px)); }
  }
  .backpack-wrap.is-flash { animation: bagFlash 0.5s ease; }
  @keyframes bagFlash {
    0% { box-shadow: 0 0 0 0 rgba(62, 230, 255, 0.5), 0 18px 44px rgba(0, 0, 0, 0.55); }
    100% { box-shadow: 0 0 0 14px rgba(62, 230, 255, 0), 0 18px 44px rgba(0, 0, 0, 0.55); }
  }

  .bag-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .bag-title { color: #d7ecff; font-weight: 700; letter-spacing: 0.06em; font-size: 12px; }
  .bag-title b { font-family: var(--mono); color: #a9d8ff; }
  #bagHint { color: #8ea7c7; }
  #bagHint.is-craftable { color: #9dffd1; text-shadow: 0 0 12px rgba(71, 232, 167, 0.25); }
  .bag-actions { margin-left: auto; display: flex; gap: 6px; }
  .mini-btn {
    padding: 5px 10px;
    border: 1px solid rgba(92, 190, 255, 0.32);
    border-radius: 7px;
    background: rgba(18, 36, 58, 0.75);
    color: #cdeaff;
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .mini-btn:hover { border-color: rgba(110, 235, 255, 0.8); background: rgba(24, 48, 76, 0.85); }
  .mini-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .mini-btn.craft { border-color: rgba(71, 232, 167, 0.42); color: #b9ffe0; background: rgba(16, 52, 44, 0.7); }

  .backpack {
    display: grid;
    gap: 7px;
  }
  .bag-slot {
    position: relative;
    height: 70px;
    border-radius: 9px;
    border: 1px solid var(--cc, rgba(100, 150, 200, 0.2));
    background: var(--cb, rgba(20, 34, 54, 0.5));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.12s;
  }
  .bag-slot .tier-tag {
    position: absolute;
    top: 4px;
    left: 5px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--cc);
    opacity: 0.9;
  }
  .bag-slot .glyph {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 700;
    color: var(--cc);
    text-shadow: 0 0 12px var(--cb);
    line-height: 1;
  }
  .bag-slot .bag-name { font-size: 10.5px; color: #d2e7ff; }
  .bag-slot .q-mark {
    position: absolute;
    top: 4px;
    right: 5px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--gold);
    border: 1px solid rgba(255, 194, 71, 0.5);
    border-radius: 3px;
    padding: 0 3px;
    background: rgba(40, 28, 6, 0.7);
  }
  .bag-slot.is-empty {
    border-style: dashed;
    border-color: rgba(100, 150, 200, 0.16);
    background: rgba(12, 22, 38, 0.45);
    color: rgba(120, 160, 200, 0.2);
    font-size: 14px;
  }
  .bag-slot.is-empty::before { content: "＋"; }
  .bag-slot.is-craftable {
    box-shadow: 0 0 0 1px var(--cc), 0 0 18px var(--cb);
    animation: craftGlow 1.6s ease-in-out infinite;
  }
  @keyframes craftGlow {
    0%, 100% { box-shadow: 0 0 0 1px var(--cc), 0 0 10px var(--cb); }
    50% { box-shadow: 0 0 0 1px var(--cc), 0 0 22px var(--cc); }
  }
  .bag-slot.is-last { box-shadow: inset 0 0 0 1px rgba(255, 194, 71, 0.4); }
  .bag-slot.is-craftable.is-last { box-shadow: 0 0 0 1px var(--cc), 0 0 20px var(--cb), inset 0 0 0 1px rgba(255, 194, 71, 0.55); }
  .bag-slot[data-index] { cursor: pointer; }
  .bag-slot[data-index]:hover { transform: translateY(-2px); }

  .tier-1 { --cc: #5cc8ff; --cb: rgba(45, 130, 210, 0.18); }
  .tier-2 { --cc: #47e8a7; --cb: rgba(30, 150, 105, 0.18); }
  .tier-3 { --cc: #ffc247; --cb: rgba(190, 130, 20, 0.18); }
  .tier-4 { --cc: #b085ff; --cb: rgba(120, 70, 210, 0.2); }
  .tier-5 { --cc: #ff6bc1; --cb: rgba(190, 40, 120, 0.22); }

  .key-hints {
    margin-top: 6px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: rgba(130, 160, 195, 0.72);
  }
  .key-hints b { color: #cfe7ff; font-weight: 600; }

  /* 浮动提示 */
  .toast {
    position: fixed;
    top: 112px;
    left: 50%;
    z-index: 30;
    transform: translate(-50%, -8px);
    max-width: min(560px, 90vw);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(92, 190, 255, 0.3);
    background: rgba(8, 18, 33, 0.94);
    color: #dceeff;
    font-size: 12.5px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
  .toast.is-success { border-color: rgba(71, 232, 167, 0.5); color: #c5ffe4; }
  .toast.is-warn { border-color: rgba(255, 194, 71, 0.5); color: #ffe7b2; }
  .toast.is-error { border-color: rgba(255, 107, 127, 0.55); color: #ffc9d0; }

  /* 全屏闪光 */
  .screen-flash {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(62, 230, 255, 0.28), transparent 68%);
  }
  .screen-flash.is-on { animation: flashAnim 0.45s ease-out; }
  @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 规则面板 */
  .rules-panel {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 16px 16px;
    background: rgba(3, 7, 14, 0.72);
    backdrop-filter: blur(6px);
  }
  .rules-panel.is-open { display: flex; }
  .rules-card {
    width: min(880px, 94vw);
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px 24px 24px;
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(13, 26, 46, 0.98), rgba(6, 12, 23, 0.98));
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
  }
  .rules-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    position: sticky;
    top: -20px;
    padding: 8px 0 6px;
    background: linear-gradient(180deg, rgba(12, 25, 44, 0.98) 70%, rgba(12, 25, 44, 0));
    z-index: 2;
  }
  .rules-head h2 { margin: 0; font-size: 19px; letter-spacing: 0.04em; }
  .rules-head p { margin: 3px 0 0; font-size: 11px; color: var(--muted); }
  .close-x {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(20, 36, 58, 0.8);
    color: #cfe8ff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }
  .close-x:hover { border-color: rgba(120, 235, 255, 0.8); }

  .rule-block { margin-top: 16px; }
  .rule-block h3 {
    margin: 0 0 7px;
    font-size: 13px;
    color: #b7d8f7;
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .rule-block h3 em { color: var(--cyan); font-style: normal; font-family: var(--mono); margin-right: 6px; }
  .rule-block p, .rule-block li { font-size: 12px; line-height: 1.85; color: #9fb5d3; margin: 0; }
  .rule-block ul { margin: 0; padding-left: 18px; }
  .rule-block li b { color: #dcefff; font-weight: 600; }
  .rule-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }

  .recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 4px; }
  .recipe-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px 9px;
    border: 1px solid rgba(92, 150, 220, 0.14);
    border-radius: 8px;
    background: rgba(8, 17, 31, 0.6);
    font-size: 11px;
    color: #9fb5d3;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid var(--cc);
    background: var(--cb);
    color: var(--cc);
    font-size: 10.5px;
    white-space: nowrap;
  }
  .chip i { font-family: var(--mono); font-style: normal; font-weight: 700; }
  .recipe-arrow { color: rgba(150, 190, 230, 0.55); font-family: var(--mono); }
  .recipe-result { border-width: 1px; box-shadow: 0 0 10px var(--cb); }
  .upgrade-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .upgrade-tag-chip {
    padding: 3px 8px;
    border: 1px solid rgba(92, 170, 255, 0.24);
    border-radius: 999px;
    font-size: 10.5px;
    color: #a9c4e2;
    background: rgba(10, 22, 38, 0.7);
  }
  .upgrade-tag-chip b { color: #cfe9ff; font-weight: 600; }

  /* 通用弹窗（升级 / 结算） */
  .modal-layer {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(3, 7, 14, 0.74);
    backdrop-filter: blur(7px);
  }
  .modal-layer.hidden { display: none; }
  .modal {
    width: min(900px, 94vw);
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px 26px;
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(14, 28, 50, 0.98), rgba(6, 12, 24, 0.98));
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: modalIn 0.24s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .modal-kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--cyan);
  }
  .modal h2 { margin: 4px 0 6px; font-size: 22px; letter-spacing: 0.04em; color: #ecfaff; }
  .modal-sub { margin: 0 0 16px; font-size: 12px; line-height: 1.8; color: #93aac9; }
  .modal-sub b { color: #cfe9ff; }
  .modal-note {
    margin-top: 14px;
    font-size: 11px;
    line-height: 1.7;
    color: #7f95b8;
    border-top: 1px solid rgba(92, 150, 220, 0.12);
    padding-top: 11px;
  }
  .modal-note b { color: #ffdf9a; }

  .upgrade-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .upgrade-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    min-height: 176px;
    padding: 14px 15px;
    border: 1px solid rgba(92, 170, 255, 0.26);
    border-radius: 13px;
    background: linear-gradient(160deg, rgba(20, 40, 70, 0.8), rgba(8, 17, 31, 0.85));
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
  }
  .upgrade-card:hover {
    transform: translateY(-3px);
    border-color: rgba(110, 240, 255, 0.75);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.45), 0 0 22px rgba(62, 230, 255, 0.1);
  }
  .upgrade-icon {
    font-size: 24px;
    line-height: 1;
    color: var(--cyan);
    text-shadow: 0 0 16px rgba(62, 230, 255, 0.55);
  }
  .upgrade-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: var(--mono);
    font-size: 9px;
    color: #80a4cc;
    border: 1px solid rgba(92, 170, 255, 0.25);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .upgrade-title { font-size: 16px; font-weight: 700; color: #eaf9ff; letter-spacing: 0.02em; }
  .upgrade-desc { flex: 1; font-size: 11.5px; line-height: 1.75; color: #96adcb; }
  .upgrade-stack { font-family: var(--mono); font-size: 10px; color: #667f9f; }

    position: absolute;
    right: 12px;
    bottom: 10px;

    height: 20px;

  .result-modal { width: min(560px, 94vw); text-align: center; }

  .result-modal.is-lose .modal-kicker { color: var(--red); }
  .result-icon {
    font-size: 46px;

  .result-modal.is-lose .result-icon { color: #ff8d9b; text-shadow: 0 0 30px rgba(255, 107, 127, 0.6); }
  .result-stats {

  .result-stat b { font-family: var(--mono); font-size: 14px; color: #d8eeff; }

  .btn-big { width: 100%; padding: 11px 16px; font-size: 13.5px; }

  .footer-tip {

  /* ---------- 响应式 ---------- */
  @media (max-width: 1100px) {
    .hud-actions { margin-left: 0; }
    .brand-block { min-width: 190px; }

    .upgrade-grid { grid-template-columns: 1fr; }

<body>
  <!-- Canvas 游戏画面 -->
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- 顶部 HUD -->

    <div class="brand-block">
      <div class="logo">量子<span>采集</span>计划</div>
      <div class="brand-sub">WASD 自由探索 · 采集合成 · 点亮量子芯片</div>
      <div class="brand-sub" id="goalText">终极目标：量子芯片 · 下一步：合成金属（T2）</div>

    <div class="stats">

<script>
/* ============================================================
   一、配置区（卡牌、配方、节点、升级）
   ------------------------------------------------------------
   以后加卡 / 改配方 / 调数值，优先只改这一块。
   ============================================================ */

/** 全局玩法参数：地图、速度、采集、倒计时等 */
const GAME_CONFIG = {
  worldWidth: 1800,          // 地图宽（世界坐标）
  worldHeight: 1300,         // 地图高
  duration: 180,             // 每局倒计时（秒）
  backpackBase: 8,           // 基础背包格数
  backpackMax: 12,           // 升级后最多格数
  pickupRadius: 58,          // 基础自动采集半径
  pickInterval: 0.32,        // 采集一次的时间间隔（秒）
  playerSpeed: 235,          // 角色最高速度（像素 / 秒）
  playerAccel: 1500,         // 加速度，越大起步越跟手
  playerFriction: 9,         // 松手后的减速强度
  upgradeCost: 3,            // 一次三选一升级消耗的科技点
  droneDelay: 45,            // 开局多少秒后无人机上线
  droneSpeed: 82,            // 无人机追击速度（明显慢于角色）
  dronePenalty: 5,           // 被撞后扣除的秒数
  targetCardId: 'quantum'    // 终极目标卡
};

/** 卡牌配置：id / 名称 / 等级 / 卡面符号 / 合成时给的科技点 */
const CARD_CONFIG = [
  { id: 'ore',     name: '矿石',     tier: 1, glyph: 'Fe',  techPoints: 0, desc: '基础矿物，两块可熔炼成金属。' },
  { id: 'silicon', name: '硅砂',     tier: 1, glyph: 'Si',  techPoints: 0, desc: '两块可提纯拉制成晶圆。' },
  { id: 'water',   name: '水',       tier: 1, glyph: 'H₂O', techPoints: 0, desc: '两块聚合成塑料，也可与塑料组成电池。' },
  { id: 'metal',   name: '金属',     tier: 2, glyph: 'Me',  techPoints: 0, desc: '导电结构材料，与晶圆组成电路板。' },
  { id: 'wafer',   name: '晶圆',     tier: 2, glyph: 'Wa',  techPoints: 0, desc: '精密基底，与金属组成电路板。' },
  { id: 'plastic', name: '塑料',     tier: 2, glyph: 'PL',  techPoints: 0, desc: '绝缘材料，与一块水合成电池。' },
  { id: 'circuit', name: '电路板',   tier: 3, glyph: 'PCB', techPoints: 2, desc: '两块堆叠成算力芯片。' },
  { id: 'battery', name: '电池',     tier: 3, glyph: 'BAT', techPoints: 2, desc: '能源单元，与芯片封装成量子芯片。' },
  { id: 'chip',    name: '芯片',     tier: 4, glyph: 'IC',  techPoints: 4, desc: '算力核心，需要电池供电。' },
  { id: 'quantum', name: '量子芯片', tier: 5, glyph: 'Q∞',  techPoints: 6, desc: '终极目标，合成即通关。' }
];

/** 通过 id 快速查卡牌配置 */
const CARD_BY_ID = {};
CARD_CONFIG.forEach((card) => { CARD_BY_ID[card.id] = card; });

/** 配方配置：两张材料 -> 一张更高等级的卡（顺序无关） */
const RECIPE_CONFIG = [
  { a: 'ore',     b: 'ore',     out: 'metal' },
  { a: 'silicon', b: 'silicon', out: 'wafer' },
  { a: 'water',   b: 'water',   out: 'plastic' },
  { a: 'metal',   b: 'wafer',   out: 'circuit' },
  { a: 'plastic', b: 'water',   out: 'battery' },
  { a: 'circuit', b: 'circuit', out: 'chip' },
  { a: 'chip',    b: 'battery', out: 'quantum' }
];

/** 地图资源节点配置：颜色、储量范围、外形 */
const NODE_CONFIG = {
  ore:     { label: '矿石', cardId: 'ore',     color: '#ff9d4d', dark: '#7a3f14', radius: 19, amountMin: 3, amountMax: 5, shape: 'rock' },
  silicon: { label: '硅砂', cardId: 'silicon', color: '#5ce1ff', dark: '#155a72', radius: 18, amountMin: 3, amountMax: 5, shape: 'crystal' },
  water:   { label: '水',   cardId: 'water',   color: '#4d8dff', dark: '#173a78', radius: 17, amountMin: 3, amountMax: 5, shape: 'pool' }
};

/** 三选一升级配置：apply 里写“选中后立刻生效”的效果 */
const UPGRADE_CONFIG = [
  {
    id: 'speed', tag: '移动', icon: '⚡', title: '超频推进',
    desc: '角色移动速度永久 +15%，跑图更省时间。', maxStacks: 4,
    apply() { state.speedMul *= 1.15; }
  },
  {
    id: 'bag', tag: '背包', icon: '▣', title: '扩容背舱',
    desc: '背包容量 +2 格（最多 12 格），材料更好囤。', maxStacks: 2,
    apply() { state.capacity = Math.min(GAME_CONFIG.backpackMax, state.capacity + 2); }
  },
  {
    id: 'range', tag: '采集', icon: '◎', title: '引力采集',
    desc: '自动采集范围 +20%，路过资源点就能吸到。', maxStacks: 3,
    apply() { state.pickupMul *= 1.2; }
  },
  {
    id: 'refund', tag: '合成', icon: '↺', title: '余料回收',
    desc: '每次合成成功后，返还 1 张随机 T1 材料。', maxStacks: 1,
    apply() { state.refundEnabled = true; }
  },
  {
    id: 'time', tag: '时间', icon: '⏱', title: '时间借贷',
    desc: '倒计时立刻 +20 秒，给自己一次喘息。', maxStacks: 4,
    apply() { state.timeLeft += 20; }
  },
  {
    id: 'gather', tag: '采集', icon: '✦', title: '快速采样',
    desc: '采集间隔 -20%，站在资源点旁吸得更快。', maxStacks: 2,
    apply() { state.pickIntervalMul *= 0.8; }
  }
];

/** 通过 id 快速查升级配置 */
const UPGRADE_BY_ID = {};
UPGRADE_CONFIG.forEach((upgrade) => { UPGRADE_BY_ID[upgrade.id] = upgrade; });

/** 等级颜色，供 Canvas 与界面统一使用 */
const TIER_COLOR = {
  1: '#5cc8ff',
  2: '#47e8a7',
  3: '#ffc247',
  4: '#b085ff',
  5: '#ff6bc1'
};

/* ============================================================
   二、状态区
   ------------------------------------------------------------
   所有玩法数据都集中在一个 state 对象里，重开时整体换新。
   ============================================================ */

/**
 * 把数值限制在 [min, max] 之间
 * @param {number} value 原值
 * @param {number} min 最小值
 * @param {number} max 最大值
 * @returns {number} 限制后的值
 */
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/**
 * 从数组里随机取一个元素
 * @param {Array} list 候选数组
 * @returns {*} 随机元素
 */
function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

/**
 * 原地打乱数组（Fisher-Yates）
 * @param {Array} list 要打乱的数组
 * @returns {Array} 同一个数组
 */
function shuffleArray(list) {
  for (let i = list.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = list[i];
    list[i] = list[j];
    list[j] = temp;
  }
  return list;
}

/**
 * 把秒数格式化成 mm:ss（倒计时用 ceil，避免显示 00:00 时其实还有零点几秒）
 * @param {number} seconds 剩余秒数
 * @returns {string} 形如 03:00 的文本
 */
function formatTime(seconds) {
  const total = Math.max(0, Math.ceil(seconds));
  const minutes = Math.floor(total / 60);
  const rest = total % 60;
  return String(minutes).padStart(2, '0') + ':' + String(rest).padStart(2, '0');
}

/**
 * 判断两张卡是否符合任意配方（配方的两个材料顺序无关）
 * @param {string} cardA 第一张卡 id
 * @param {string} cardB 第二张卡 id
 * @returns {Object|null} 命中的配方对象
 */
function findRecipe(cardA, cardB) {
  if (!cardA || !cardB) return null;
  return RECIPE_CONFIG.find((recipe) => {
    return (recipe.a === cardA && recipe.b === cardB)
      || (recipe.a === cardB && recipe.b === cardA);
  }) || null;
}

/**
 * 创建一局全新的游戏状态（随机地图、随机开局三张 T1）
 * @returns {Object} 初始 state
 */
function createInitialState() {
  const t1Ids = CARD_CONFIG.filter((card) => card.tier === 1).map((card) => card.id);

  // 开局三张 T1，保证至少有一对相同材料，方便新手立刻按 E 体验合成
  const pairId = pickRandom(t1Ids);
  const starter = [pairId, pairId, pickRandom(t1Ids.filter((id) => id !== pairId)) || pairId];
  shuffleArray(starter);

  const player = {
    x: GAME_CONFIG.worldWidth / 2 + (Math.random() * 80 - 40),
    y: GAME_CONFIG.worldHeight / 2 + (Math.random() * 80 - 40),
    vx: 0,
    vy: 0,
    angle: 0,
    radius: 18
  };

  const freshState = {
    // 角色与相机
    player: player,
    cam: { x: player.x, y: player.y },
    view: { w: 0, h: 0 },
    dpr: 1,
    keys: {},                              // 当前按下的移动键

    // 背包
    backpack: starter.slice(),             // 卡牌 id 数组（从左到右）
    capacity: GAME_CONFIG.backpackBase,
    highlightIndex: starter.length - 1,    // Q 丢弃 / 高亮的那一张

    // 进度与经济
    techPoints: 0,
    totalTechEarned: 0,
    upgrades: {},
    upgradesTaken: 0,
    upgradeOptions: [],
    craftedEver: { 2: false, 3: false, 4: false, 5: false },
    craftCount: 0,
    gatherCount: 0,

    // 计时与状态
    timeLeft: GAME_CONFIG.duration,
    elapsed: 0,
    lastTime: 0,
    status: 'playing',                     // playing / won / lost
    mode: 'playing',                       // playing / upgrade / rules / result
    runId: Date.now() + Math.random(),

    // 局内成长数值
    speedMul: 1,
    pickupMul: 1,
    pickIntervalMul: 1,
    refundEnabled: false,

    // 世界内容
    nodes: [],
    decor: [],
    zones: [],
    items: [],                             // 无人机撞落的卡牌
    drone: { active: false, x: 0, y: 0, cooldown: 0, warned: false },

    // 视觉反馈池
    particles: [],
    floats: [],
    rings: [],
    cardFx: [],
    shake: { time: 0, power: 0 },

    // 各种节流 / 缓存
    pickAccum: 0,
    trailAccum: 0,
    minimapAccum: 0,
    lastBagFullToast: 0,
    hudCache: {}
  };

  generateMap(freshState);
  return freshState;
}

/** 当前这一局的状态；重开时整体替换成新对象 */
let state = createInitialState();

/* ============================================================
   三、地图生成区
   ------------------------------------------------------------
   每局重新随机散布矿石 / 硅砂 / 水节点，并保证起点附近有资源。
   ============================================================ */

/**
 * 生成一局随机地图：资源节点、装饰光斑、区域文字
 * @param {Object} gameState 要填充地图数据的状态对象
 */
function generateMap(gameState) {
  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;
  const margin = 100;
  const nodes = [];
  const decor = [];
  const zones = [];
  let serial = 0;

  /**
   * 检查某个坐标是否离已有节点和出生点足够远
   * @param {number} x 世界 x
   * @param {number} y 世界 y
   * @param {number} minGap 与已有节点的最小距离
   * @param {number} startGap 与出生点的最小距离
   * @returns {boolean} 可以放置返回 true
   */
  function canPlace(x, y, minGap, startGap) {
    if (x < margin || x > W - margin || y < margin || y > H - margin) return false;
    if (Math.hypot(x - gameState.player.x, y - gameState.player.y) < startGap) return false;
    return nodes.every((node) => Math.hypot(node.x - x, node.y - y) >= minGap);
  }

  /**
   * 把一个新资源节点写入地图
   * @param {string} type 节点类型 ore / silicon / water
   * @param {number} x 世界 x
   * @param {number} y 世界 y
   */
  function addNode(type, x, y) {
    const conf = NODE_CONFIG[type];
    const amount = Math.floor(conf.amountMin + Math.random() * (conf.amountMax - conf.amountMin + 1));
    serial += 1;
    nodes.push({
      id: 'node-' + serial,
      type: type,
      x: x,
      y: y,
      amount: amount,
      maxAmount: amount,
      radius: conf.radius,
      rot: Math.random() * Math.PI * 2,
      seed: Math.random() * 100
    });
  }

  // 1）保证出生点附近每种资源都有两个节点，避免开局找不到材料
  ['ore', 'silicon', 'water'].forEach((type) => {
    for (let k = 0; k < 2; k += 1) {
      for (let attempt = 0; attempt < 40; attempt += 1) {
        const angle = Math.random() * Math.PI * 2;
        const distance = 185 + Math.random() * 145;
        const x = gameState.player.x + Math.cos(angle) * distance;
        const y = gameState.player.y + Math.sin(angle) * distance;
        if (canPlace(x, y, 72, 150)) {
          addNode(type, x, y);
          break;
        }
      }
    }
  });

  // 2）全图再随机撒更多资源，形成矿区 / 晶砂带 / 水脉
  const extraCounts = { ore: 16, silicon: 14, water: 12 };
  Object.keys(extraCounts).forEach((type) => {
    let placed = 0;
    let guard = 0;
    while (placed < extraCounts[type] && guard < 800) {
      guard += 1;
      const x = margin + Math.random() * (W - margin * 2);
      const y = margin + Math.random() * (H - margin * 2);
      if (canPlace(x, y, 78, 170)) {
        addNode(type, x, y);
        placed += 1;
      }
    }
  });

  // 3）装饰光斑：只影响观感，不参与碰撞与采集
  const decorHues = ['58,180,220', '78,118,230', '140,90,220', '45,210,160'];
  for (let i = 0; i < 18; i += 1) {
    decor.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 80 + Math.random() * 180,
      hue: pickRandom(decorHues),
      alpha: 0.05 + Math.random() * 0.07
    });
  }

  // 4）区域文字：给地图一点“废墟科考站”的空间感
  const zoneNames = ['废弃矿区', '硅晶平原', '冷却水脉', '旧实验站', '断裂走廊', '信号盲区'];
  for (let i = 0; i < zoneNames.length; i += 1) {
    zones.push({
      name: zoneNames[i],
      x: 160 + Math.random() * (W - 320),
      y: 140 + Math.random() * (H - 280)
    });
  }

  gameState.nodes = nodes;
  gameState.decor = decor;
  gameState.zones = zones;
}
/* ============================================================

   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

/** 缓存常用 DOM 节点，避免每帧重复查询 */

/**
 * 根据窗口大小调整画布分辨率（限制 DPR，避免高分屏太吃性能）
 */
function resizeCanvas() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  state.view.w = width;
  state.view.h = height;
  state.dpr = dpr;

  canvas.width = Math.max(1, Math.floor(width * dpr));
  canvas.height = Math.max(1, Math.floor(height * dpr));
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  snapCamera();
  if (state.nodes.length) renderBackpack();
}

/**
 * 计算相机应该停留的位置（让角色尽量居中，并限制在地图内）
 * @returns {{x:number, y:number}} 目标相机坐标
 */
function getCameraTarget() {
  const vw = state.view.w || window.innerWidth;
  const vh = state.view.h || window.innerHeight;
  const worldW = GAME_CONFIG.worldWidth;
  const worldH = GAME_CONFIG.worldHeight;

  let tx = state.player.x - vw / 2;
  let ty = state.player.y - vh / 2;

  tx = vw >= worldW ? (worldW - vw) / 2 : clamp(tx, 0, worldW - vw);
  ty = vh >= worldH ? (worldH - vh) / 2 : clamp(ty, 0, worldH - vh);
  return { x: tx, y: ty };
}

/**
 * 立刻把相机放到目标位置（重开 / 改变窗口大小时用，不产生滑动）
 */
function snapCamera() {
  const target = getCameraTarget();
  state.cam.x = target.x;
  state.cam.y = target.y;
}

/**
 * 让相机平滑跟随角色
 * @param {number} dt 本帧时间步长（秒）
 */
function updateCamera(dt) {
  const target = getCameraTarget();
  const smooth = 1 - Math.exp(-dt * 9);
  state.cam.x += (target.x - state.cam.x) * smooth;
  state.cam.y += (target.y - state.cam.y) * smooth;
}

/**
 * 统计已经达成几个合成里程碑（T2 / T3 / T4 / T5）
 * @returns {{achieved:number, total:number}} 已达成数量与总数量
 */
function getGoalProgress() {
  const tiers = [2, 3, 4, 5];
  const achieved = tiers.filter((tier) => state.craftedEver[tier]).length;
  return { achieved: achieved, total: tiers.length };
}

/**
 * 根据当前进度给出下一步建议
 * @returns {string} 简短中文提示
 */
function getNextGoalText() {
  if (!state.craftedEver[2]) return '先合成金属 / 晶圆 / 塑料（T2）';
  if (!state.craftedEver[3]) return '合成电路板或电池（T3）';
  if (!state.craftedEver[4]) return '合成芯片（T4）';
  return '芯片 + 电池 → 量子芯片';
}

/**
 * 刷新顶部的倒计时、科技点、背包占用与进度显示
 * 只改文字和 class，不重建 DOM，避免打断动画。
 */
function updateHUD() {
  const timerText = formatTime(state.timeLeft);
  if (ui.hudTimer.textContent !== timerText) ui.hudTimer.textContent = timerText;
  ui.timerStat.classList.toggle('is-low', state.timeLeft <= 30 && state.timeLeft > 0);

  const techText = String(state.techPoints);
  if (ui.hudTech.firstChild.nodeValue !== techText) ui.hudTech.firstChild.nodeValue = techText;
  Array.from(ui.techPips.children).forEach((pip, index) => {
    pip.classList.toggle('is-on', index < Math.min(3, state.techPoints));
  });

  const bagText = state.backpack.length + ' / ' + state.capacity;
  if (ui.hudBag.textContent !== bagText) ui.hudBag.textContent = bagText;
  if (ui.bagCount.textContent !== bagText) ui.bagCount.textContent = bagText;

  const progress = getGoalProgress();
  const progressText = progress.achieved + ' / ' + progress.total;
  if (ui.hudProgress.textContent !== progressText) ui.hudProgress.textContent = progressText;
  Array.from(ui.progressPips.children).forEach((pip, index) => {
    pip.classList.toggle('is-on', index < progress.achieved);
  });

  const nextGoal = getNextGoalText();
  if (ui.nextGoalText.textContent !== nextGoal) ui.nextGoalText.textContent = nextGoal;
  const goalLine = '终极目标：量子芯片 · 下一步：' + nextGoal;
  if (ui.goalText.textContent !== goalLine) ui.goalText.textContent = goalLine;

  const canUpgrade = state.techPoints >= GAME_CONFIG.upgradeCost
    && state.status === 'playing'
    && state.mode === 'playing';
  ui.btnUpgrade.disabled = !canUpgrade;
  ui.btnUpgrade.classList.toggle('is-ready', canUpgrade);
  ui.upgradeHint.textContent = state.techPoints >= GAME_CONFIG.upgradeCost ? '可用' : '需 3 点';

  ui.backpackWrap.classList.toggle('is-full', state.backpack.length >= state.capacity);
}

/**
 * 在背包里找第一组能合成的材料（按背包顺序，i 在前 j 在后）
 * @returns {Object|null} { i, j, recipe }；没有返回 null
 */
function findFirstCraftPair() {
  for (let i = 0; i < state.backpack.length; i += 1) {
    for (let j = i + 1; j < state.backpack.length; j += 1) {
      const recipe = findRecipe(state.backpack[i], state.backpack[j]);
      if (recipe) return { i: i, j: j, recipe: recipe };
    }
  }
  return null;
}

/**
 * 收集所有参与“可合成组合”的背包下标，用来做高亮
 * @returns {Set<number>} 需要高亮的背包下标集合
 */
function getCraftableIndices() {
  const result = new Set();
  for (let i = 0; i < state.backpack.length; i += 1) {
    for (let j = i + 1; j < state.backpack.length; j += 1) {
      if (findRecipe(state.backpack[i], state.backpack[j])) {
        result.add(i);
        result.add(j);
      }
    }
  }
  return result;
}

/**
 * 重建底部背包：卡牌、可合成高亮、最后拾取标记与操作按钮状态
 */
function renderBackpack() {
  const craftable = getCraftableIndices();
  const columns = Math.min(state.capacity, window.innerWidth < 760 ? 6 : 8);
  ui.backpack.style.gridTemplateColumns = 'repeat(' + columns + ', minmax(0, 1fr))';

  let html = '';
  for (let index = 0; index < state.capacity; index += 1) {
    if (index >= state.backpack.length) {
      html += '<div class="bag-slot is-empty"></div>';
      continue;
    }

    const card = CARD_BY_ID[state.backpack[index]];
    const classes = ['bag-slot', 'tier-' + card.tier];
    if (craftable.has(index)) classes.push('is-craftable');
    if (index === state.highlightIndex) classes.push('is-last');
    const isLast = index === state.highlightIndex
      ? '<span class="q-mark">Q</span>'
      : '';

    html += '<div class="' + classes.join(' ') + '" data-index="' + index + '" title="' + card.desc + '">'
      + '<span class="tier-tag">T' + card.tier + '</span>'
      + '<span class="glyph">' + card.glyph + '</span>'
      + '<span class="bag-name">' + card.name + '</span>'
      + isLast
      + '</div>';
  }
  ui.backpack.innerHTML = html;

  const pair = findFirstCraftPair();
  if (pair) {
    const cardA = CARD_BY_ID[state.backpack[pair.i]];
    const cardB = CARD_BY_ID[state.backpack[pair.j]];
    const out = CARD_BY_ID[pair.recipe.out];
    const formula = cardA.id === cardB.id
      ? cardA.name + ' ×2'
      : cardA.name + ' + ' + cardB.name;
    ui.bagHint.textContent = '可合成：' + formula + ' → ' + out.name + '（按 E）';
    ui.bagHint.classList.add('is-craftable');
  } else {
    ui.bagHint.textContent = state.backpack.length >= state.capacity
      ? '背包已满：按 E 合成腾出空间，或按 Q 丢弃高亮卡'
      : '暂无可合成组合，继续采集';
    ui.bagHint.classList.remove('is-craftable');
  }

  ui.btnCraft.disabled = !pair || state.status !== 'playing' || state.mode !== 'playing';
  ui.btnDiscard.disabled = state.backpack.length === 0 || state.status !== 'playing' || state.mode !== 'playing';
  updateHUD();
}

/**
