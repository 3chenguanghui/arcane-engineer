/**
 * 绘制右上角小地图：资源点、掉落卡、玩家、无人机与视野框
 */
function drawMinimap() {
  const mw = minimap.width;
  const mh = minimap.height;
  const pad = 8;
  const sx = (mw - pad * 2) / GAME_CONFIG.worldWidth;
  const sy = (mh - pad * 2) / GAME_CONFIG.worldHeight;

  mctx.clearRect(0, 0, mw, mh);
  mctx.fillStyle = '#050b16';
  mctx.fillRect(0, 0, mw, mh);

  mctx.strokeStyle = 'rgba(92,170,255,0.22)';
  mctx.lineWidth = 2;
  mctx.strokeRect(pad, pad, mw - pad * 2, mh - pad * 2);

  // 地图网格
  mctx.strokeStyle = 'rgba(80,150,220,0.08)';
  mctx.lineWidth = 1;
  for (let x = 1; x < 6; x += 1) {
    const px = pad + (mw - pad * 2) * (x / 6);
    mctx.beginPath();
    mctx.moveTo(px, pad);
    mctx.lineTo(px, mh - pad);
    mctx.stroke();
  }
  for (let y = 1; y < 6; y += 1) {
    const py = pad + (mh - pad * 2) * (y / 6);
    mctx.beginPath();
    mctx.moveTo(pad, py);
    mctx.lineTo(mw - pad, py);
    mctx.stroke();
  }

  // 资源点
  state.nodes.forEach((node) => {
    const conf = NODE_CONFIG[node.type];
    const px = pad + node.x * sx;
    const py = pad + node.y * sy;
    mctx.globalAlpha = node.amount > 0 ? 0.95 : 0.22;
    mctx.fillStyle = conf.color;
    mctx.beginPath();
    mctx.arc(px, py, node.amount > 0 ? 2.6 : 1.6, 0, Math.PI * 2);
    mctx.fill();
  });
  mctx.globalAlpha = 1;

  // 无人机掉落的卡牌
  state.items.forEach((item) => {
    const px = pad + item.x * sx;
    const py = pad + item.y * sy;
    mctx.fillStyle = '#ffc247';
    mctx.fillRect(px - 2, py - 2, 4, 4);
  });

  // 视野框
  const vw = state.view.w || window.innerWidth;
  const vh = state.view.h || window.innerHeight;
  mctx.strokeStyle = 'rgba(62,230,255,0.35)';
  mctx.lineWidth = 1;
  mctx.strokeRect(
    pad + state.cam.x * sx,
    pad + state.cam.y * sy,
    Math.min(vw, GAME_CONFIG.worldWidth) * sx,
    Math.min(vh, GAME_CONFIG.worldHeight) * sy
  );

  // 角色光点
  const px = pad + state.player.x * sx;
  const py = pad + state.player.y * sy;
  mctx.fillStyle = '#ffffff';
  mctx.shadowColor = '#3ee6ff';
  mctx.shadowBlur = 8;
  mctx.beginPath();
  mctx.arc(px, py, 3.2, 0, Math.PI * 2);
  mctx.fill();
  mctx.shadowBlur = 0;

  // 无人机
  if (state.drone.active) {
    const dx = pad + state.drone.x * sx;
    const dy = pad + state.drone.y * sy;
    mctx.fillStyle = '#ff6b7f';
    mctx.beginPath();
    mctx.arc(dx, dy, 3, 0, Math.PI * 2);
    mctx.fill();
  }
}
/**
 * 把 #rrggbb 颜色转换成带透明度的 rgba 字符串（Canvas 渐变用）
 * @param {string} hex 十六进制颜色
 * @param {number} alpha 透明度 0~1
 * @returns {string} rgba 颜色
 */
function hexToRgba(hex, alpha) {
  const raw = hex.replace('#', '');
  const r = parseInt(raw.slice(0, 2), 16);
  const g = parseInt(raw.slice(2, 4), 16);
  const b = parseInt(raw.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/**
 * 在 Canvas 上画一个圆角矩形路径（不直接填充，方便复用）
 * @param {number} x 左上角 x
 * @param {number} y 左上角 y
 * @param {number} w 宽
 * @param {number} h 高
 * @param {number} r 圆角半径
 */
function roundRectPath(x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

/**
 * 主渲染：清屏 -> 相机变换 -> 画世界 -> 还原 -> 画小地图
 */
function render() {
  const vw = state.view.w || window.innerWidth;
  const vh = state.view.h || window.innerHeight;
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.fillStyle = '#04070e';
  ctx.fillRect(0, 0, vw, vh);

  let shakeX = 0;
  let shakeY = 0;
  if (state.shake.time > 0) {
    shakeX = (Math.random() * 2 - 1) * state.shake.power;
    shakeY = (Math.random() * 2 - 1) * state.shake.power;
  }

  ctx.save();
  ctx.translate(-state.cam.x + shakeX, -state.cam.y + shakeY);

  drawWorldBackground();
  drawDecor();
  drawWorldBorder();
  drawZoneLabels();
  drawNodes();
  drawItems();
  drawDrone();
  drawPlayer();
  drawEffects();

  ctx.restore();

  drawMinimap();
}

/**
 * 画世界底色与科技网格
 */
function drawWorldBackground() {
  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;

  ctx.fillStyle = '#071120';
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, 'rgba(20, 55, 90, 0.35)');
  grad.addColorStop(0.5, 'rgba(9, 22, 40, 0.1)');
  grad.addColorStop(1, 'rgba(45, 25, 80, 0.3)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 基础网格
  ctx.strokeStyle = 'rgba(80, 160, 240, 0.075)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 90) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 90) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // 每 450 像素一条更亮的“主网格”
  ctx.strokeStyle = 'rgba(90, 190, 255, 0.13)';
  for (let x = 0; x <= W; x += 450) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 450) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

/**
 * 画地图装饰光斑，让荒原看起来有层次
 */
function drawDecor() {
  state.decor.forEach((blob) => {
    const grad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.r);
    grad.addColorStop(0, 'rgba(' + blob.hue + ',' + blob.alpha + ')');
    grad.addColorStop(1, 'rgba(' + blob.hue + ',0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(blob.x, blob.y, blob.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

/**
 * 画地图边界：发光边框 + 四角卡扣 + 内侧警戒线
 */
function drawWorldBorder() {
  const W = GAME_CONFIG.worldWidth;
  const H = GAME_CONFIG.worldHeight;

  ctx.save();
  ctx.strokeStyle = 'rgba(62, 230, 255, 0.34)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(62, 230, 255, 0.6)';
  ctx.shadowBlur = 16;
  ctx.strokeRect(7, 7, W - 14, H - 14);
  ctx.restore();

  ctx.strokeStyle = 'rgba(255, 194, 71, 0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([14, 12]);
  ctx.strokeRect(22, 22, W - 44, H - 44);
  ctx.setLineDash([]);

  // 四角卡扣
  const corners = [
    [7, 7, 1, 1],
    [W - 7, 7, -1, 1],
    [7, H - 7, 1, -1],
    [W - 7, H - 7, -1, -1]
  ];
  ctx.strokeStyle = 'rgba(62, 230, 255, 0.8)';
  ctx.lineWidth = 3;
  corners.forEach((corner) => {
    const cx = corner[0];
    const cy = corner[1];
    const dx = corner[2];
    const dy = corner[3];
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy * 34);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + dx * 34, cy);
    ctx.stroke();
  });
}

/**
 * 画区域名称，作为地图的空间锚点
 */
function drawZoneLabels() {
  ctx.save();
  ctx.fillStyle = 'rgba(130, 175, 225, 0.1)';
  ctx.font = '600 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  state.zones.forEach((zone) => {
    ctx.fillText(zone.name, zone.x, zone.y);
    ctx.strokeStyle = 'rgba(130, 175, 225, 0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(zone.x, zone.y + 7);
    ctx.lineTo(zone.x + 86, zone.y + 7);
    ctx.stroke();
  });
  ctx.restore();
}

/**
 * 画所有资源节点（含储量标签与采空状态）
 */
function drawNodes() {
  const player = state.player;

  state.nodes.forEach((node) => {
    const conf = NODE_CONFIG[node.type];
    const depleted = node.amount <= 0;
    const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 2 + node.seed);

    if (depleted) {
      // 采空后变成暗色坑洞，但保留位置，避免玩家困惑
      ctx.fillStyle = 'rgba(6, 12, 20, 0.85)';
      ctx.beginPath();
      ctx.arc(node.x, node.y, conf.radius * 1.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexToRgba(conf.dark, 0.55);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(node.x, node.y, conf.radius * 0.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120, 145, 175, 0.18)';
      for (let i = 0; i < 3; i += 1) {
        ctx.beginPath();
        ctx.arc(node.x + Math.cos(i * 2.1 + node.seed) * 12, node.y + Math.sin(i * 2.1 + node.seed) * 9, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      const glowRadius = conf.radius * (2.5 + pulse * 0.4);
      const glow = ctx.createRadialGradient(node.x, node.y, 2, node.x, node.y, glowRadius);
      glow.addColorStop(0, hexToRgba(conf.color, 0.22 + pulse * 0.1));
      glow.addColorStop(1, hexToRgba(conf.color, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(node.x, node.y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(node.x, node.y);
      ctx.rotate(node.rot);
      ctx.shadowColor = conf.color;
      ctx.shadowBlur = 12 + pulse * 7;

      if (conf.shape === 'rock') {
        // 矿石：不规则五边形岩块
        ctx.beginPath();
        const points = 5;
        for (let i = 0; i < points; i += 1) {
          const angle = (Math.PI * 2 / points) * i - Math.PI / 2;
          const radius = conf.radius * (0.78 + (i % 2) * 0.18);
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 25, 36, 0.95)';
        ctx.fill();
        ctx.strokeStyle = conf.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = hexToRgba(conf.color, 0.45);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.lineTo(2, 7);
        ctx.lineTo(9, -4);
        ctx.stroke();
      } else if (conf.shape === 'crystal') {
        // 硅砂：三簇发光晶体
        const shards = [[-9, 4, 8], [2, -2, 12], [10, 6, 7]];
        shards.forEach((shard) => {
          const bx = shard[0];
          const by = shard[1];
          const size = shard[2];
          ctx.beginPath();
          ctx.moveTo(bx, by - size);
          ctx.lineTo(bx - size * 0.5, by + size * 0.35);
          ctx.lineTo(bx + size * 0.5, by + size * 0.35);
          ctx.closePath();
          ctx.fillStyle = hexToRgba(conf.color, 0.28);
          ctx.fill();
          ctx.strokeStyle = conf.color;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      } else {
        // 水：半透明水池 + 两圈涟漪
        ctx.fillStyle = 'rgba(22, 52, 110, 0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 2, conf.radius * 1.15, conf.radius * 0.72, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hexToRgba(conf.color, 0.75);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(0, 2, conf.radius * 1.15, conf.radius * 0.72, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = hexToRgba(conf.color, 0.35);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 2, conf.radius * 0.66, conf.radius * 0.38, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 靠近时显示资源名称与剩余储量
    const dist = Math.hypot(player.x - node.x, player.y - node.y);
    if (dist < 175) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '600 11px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = depleted ? 'rgba(120, 145, 175, 0.42)' : hexToRgba(conf.color, 0.95);
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText(depleted ? conf.label + ' · 已采空' : conf.label + ' ×' + node.amount, node.x, node.y - conf.radius - 13);
      ctx.restore();
    }
  });
}

/**
 * 画无人机掉在地上的卡牌（可以重新拾取）
 */
function drawItems() {
  state.items.forEach((item) => {
    const card = CARD_BY_ID[item.cardId];
    const bob = Math.sin(state.elapsed * 3 + item.bob) * 3.5;
    const x = item.x;
    const y = item.y + bob;

    const glow = ctx.createRadialGradient(x, y, 2, x, y, 34);
    glow.addColorStop(0, hexToRgba(TIER_COLOR[card.tier], 0.3));
    glow.addColorStop(1, hexToRgba(TIER_COLOR[card.tier], 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 34, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = TIER_COLOR[card.tier];
    ctx.shadowBlur = 14;
    roundRectPath(-14, -22, 28, 38, 6);
    ctx.fillStyle = 'rgba(8, 16, 28, 0.94)';
    ctx.fill();
    ctx.strokeStyle = TIER_COLOR[card.tier];
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = TIER_COLOR[card.tier];
    ctx.font = '700 14px "Consolas", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(card.glyph, 0, 0);
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 194, 71, 0.75)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('回收 +1', x, y - 32);
  });
}

/**
 * 画干扰无人机：红色全息六边形 + 指向角色的警戒线
 */
function drawDrone() {
  if (!state.drone.active) return;
  const drone = state.drone;
  const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 5);

  // 指向角色的警戒虚线
  ctx.strokeStyle = 'rgba(255, 107, 127, 0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 9]);
  ctx.beginPath();
  ctx.moveTo(drone.x, drone.y);
  ctx.lineTo(state.player.x, state.player.y);
  ctx.stroke();
  ctx.setLineDash([]);

  const glow = ctx.createRadialGradient(drone.x, drone.y, 2, drone.x, drone.y, 48);
  glow.addColorStop(0, 'rgba(255, 107, 127, ' + (0.2 + pulse * 0.12) + ')');
  glow.addColorStop(1, 'rgba(255, 107, 127, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(drone.x, drone.y, 48, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(drone.x, drone.y);
  ctx.rotate(state.elapsed * 1.1);
  ctx.shadowColor = '#ff6b7f';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  for (let i = 0; i < 6; i += 1) {
    const angle = (Math.PI * 2 / 6) * i;
    const px = Math.cos(angle) * 17;
    const py = Math.sin(angle) * 17;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(46, 12, 22, 0.9)';
  ctx.fill();
  ctx.strokeStyle = '#ff6b7f';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 107, 127, 0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, 5 + pulse * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255, 130, 148, 0.8)';
  ctx.font = '10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('干扰无人机', drone.x, drone.y - 28);
}

/**
 * 画玩家角色：全息六边形机体 + 采集范围 + 推进尾焰
 */
function drawPlayer() {
  const player = state.player;
  const pickupRadius = GAME_CONFIG.pickupRadius * state.pickupMul;
  const speed = Math.hypot(player.vx, player.vy);
  const pulse = 0.5 + 0.5 * Math.sin(state.elapsed * 3);

  // 采集范围圈
  ctx.save();
  ctx.strokeStyle = 'rgba(62, 230, 255, 0.16)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  ctx.beginPath();
  ctx.arc(player.x, player.y, pickupRadius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // 地面投影与光晕
  const glow = ctx.createRadialGradient(player.x, player.y, 2, player.x, player.y, 60);
  glow.addColorStop(0, 'rgba(62, 230, 255, 0.18)');
  glow.addColorStop(1, 'rgba(62, 230, 255, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(player.x, player.y, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
  ctx.beginPath();
  ctx.ellipse(player.x, player.y + 17, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // 推进尾焰
  if (speed > 30) {
    ctx.fillStyle = 'rgba(62, 230, 255, ' + (0.18 + Math.min(0.35, speed / 700)) + ')';
    ctx.beginPath();
    ctx.moveTo(-13, -6);
    ctx.lineTo(-27 - Math.random() * 9, 0);
    ctx.lineTo(-13, 6);
    ctx.closePath();
    ctx.fill();
  }

  // 机体六边形
  ctx.shadowColor = '#3ee6ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  for (let i = 0; i < 6; i += 1) {
    const angle = (Math.PI * 2 / 6) * i + Math.PI / 6;
    const px = Math.cos(angle) * 16;
    const py = Math.sin(angle) * 16;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(16, 40, 62, 0.95)';
  ctx.fill();
  ctx.strokeStyle = '#3ee6ff';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 核心与朝向标记
  ctx.fillStyle = 'rgba(62, 230, 255, ' + (0.65 + pulse * 0.3) + ')';
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(220, 252, 255, 0.9)';
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(10, -4);
  ctx.lineTo(10, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

/**
 * 画所有临时视觉反馈：粒子、浮动文字、扩散光环、合成后的飞卡
 */
function drawEffects() {
  // 粒子
  state.particles.forEach((particle) => {
    const alpha = Math.max(0, particle.life / particle.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = particle.color;
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 扩散光环
  state.rings.forEach((ring) => {
    const alpha = Math.max(0, ring.life / ring.maxLife);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.width;
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // 合成产物飞入：一张小卡从角色头顶升起
  state.cardFx.forEach((fx) => {
    const card = CARD_BY_ID[fx.cardId];
    const t = 1 - fx.life / fx.maxLife;
    const alpha = Math.min(1, fx.life * 2.2);
    const y = fx.y - 44 - t * 58;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(fx.x, y);
    ctx.shadowColor = TIER_COLOR[card.tier];
    ctx.shadowBlur = 20;
    roundRectPath(-16, -23, 32, 44, 7);
    ctx.fillStyle = 'rgba(8, 16, 30, 0.94)';
    ctx.fill();
    ctx.strokeStyle = TIER_COLOR[card.tier];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = TIER_COLOR[card.tier];
    ctx.font = '700 15px "Consolas", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(card.glyph, 0, -2);
    ctx.font = '9px "Microsoft YaHei", sans-serif';
    ctx.fillText(card.name, 0, 14);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  // 浮动文字
  state.floats.forEach((floatText) => {
    const alpha = Math.max(0, floatText.life / floatText.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '700 ' + floatText.size + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = floatText.color;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
    ctx.shadowBlur = 8;
    ctx.fillText(floatText.text, floatText.x, floatText.y);
    ctx.restore();
  });
}
/* ============================================================
   五、输入与交互区
   ------------------------------------------------------------
   这里放“玩家做了什么”的结果：拾取、合成、丢弃、升级、暂停、结算。
   ============================================================ */

let toastTimer = null;

/**
 * 显示顶部浮动提示
 * @param {string} message 提示文字
 * @param {string} type info / success / warn / error
 * @param {number} duration 显示时长（毫秒）
 */
function showToast(message, type, duration) {
  const kind = type || 'info';
  const time = duration || 2200;
  ui.toast.textContent = message;
  ui.toast.className = 'toast is-show is-' + kind;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    ui.toast.classList.remove('is-show');
  }, time);
}

/**
 * 全屏短促闪光，作为合成 / 受击的强反馈
 * @param {string} color 闪光颜色（带透明度的 rgba）
 */
function flashScreen(color) {
  ui.screenFlash.style.background = 'radial-gradient(circle at 50% 50%, ' + color + ', transparent 70%)';
  ui.screenFlash.classList.remove('is-on');
  void ui.screenFlash.offsetWidth;
  ui.screenFlash.classList.add('is-on');
}

/**
 * 让背包栏播放一次动画
 * @param {'flash'|'deny'} kind flash 表示合成成功，deny 表示操作失败
 */
function pulseBag(kind) {
  const cls = kind === 'flash' ? 'is-flash' : 'is-denied';
  ui.backpackWrap.classList.remove(cls);
  void ui.backpackWrap.offsetWidth;
  ui.backpackWrap.classList.add(cls);
  setTimeout(() => ui.backpackWrap.classList.remove(cls), 600);
}

/**
 * 在角色附近生成一圈粒子
 * @param {number} x 世界 x
 * @param {number} y 世界 y
 * @param {string} color 粒子颜色
 * @param {number} count 数量
 * @param {number} speed 初速度
 */
function addBurst(x, y, color, count, speed) {
  const total = count || 10;
  const force = speed || 120;
  for (let i = 0; i < total; i += 1) {
    const angle = Math.random() * Math.PI * 2;
    const velocity = force * (0.35 + Math.random() * 0.9);
    state.particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * velocity,
      vy: Math.sin(angle) * velocity,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.9,
      size: 1.5 + Math.random() * 2.5,
      color: color
    });
  }
  if (state.particles.length > 160) state.particles.splice(0, state.particles.length - 160);
}

/**
 * 添加一条从世界坐标向上飘的浮动文字
 * @param {string} text 文字
 * @param {number} x 世界 x
 * @param {number} y 世界 y
 * @param {string} color 颜色
 * @param {number} size 字号
 */
function addFloat(text, x, y, color, size) {
  state.floats.push({
    text: text,
    x: x,
    y: y,
    color: color || '#dff7ff',
    size: size || 13,
    life: 1.1,
    maxLife: 1.1
  });
  if (state.floats.length > 14) state.floats.shift();
}

/**
 * 添加一个向外扩散的光环
 * @param {number} x 世界 x
 * @param {number} y 世界 y
 * @param {string} color 颜色
 * @param {number} maxRadius 最大半径
 */
function addRing(x, y, color, maxRadius) {
  state.rings.push({
    x: x,
    y: y,
    radius: 10,
    maxRadius: maxRadius || 90,
    life: 0.55,
    maxLife: 0.55,
    color: color,
    width: 2.5
  });
}

/**
 * 添加“合成产物飞入”的小卡动画
 * @param {number} x 世界 x
 * @param {number} y 世界 y
 * @param {string} cardId 产出的卡牌 id
 */
function addCardFx(x, y, cardId) {
  state.cardFx.push({ x: x, y: y, cardId: cardId, life: 1.1, maxLife: 1.1 });
}

/**
 * 触发屏幕震动
 * @param {number} power 震动幅度（像素）
 * @param {number} time 持续时间（秒）
 */
function triggerShake(power, time) {
  state.shake.power = Math.max(state.shake.power, power);
  state.shake.time = Math.max(state.shake.time, time);
}

/**
 * 背包满时给出限频提示，避免每帧刷屏
 */
function showBagFullHint() {
  const now = performance.now();
  if (now - state.lastBagFullToast < 1800) return;
  state.lastBagFullToast = now;
  showToast('背包已满：按 E 合成腾出空间，或按 Q 丢弃高亮卡', 'warn', 2400);
  addFloat('背包已满', state.player.x, state.player.y - 42, '#ff9aa7', 13);
  pulseBag('deny');
}

/**
 * 拾取一个资源点里的 1 份材料
 * @param {Object} node 资源节点
 */
function collectNode(node) {
  const conf = NODE_CONFIG[node.type];
  node.amount -= 1;
  state.backpack.push(conf.cardId);
  state.highlightIndex = state.backpack.length - 1;
  state.gatherCount += 1;

  addBurst(node.x, node.y, conf.color, 9, 110);
  addFloat('+' + conf.label, node.x, node.y - conf.radius - 10, conf.color, 13);
  if (node.amount <= 0) {
    addRing(node.x, node.y, hexToRgba(conf.color, 0.4), 50);
    addFloat('已采空', node.x, node.y - conf.radius - 26, 'rgba(180,200,220,0.7)', 11);
  }
  pulseBag('flash');
  renderBackpack();
}

/**
 * 按 E 自动匹配第一组合法配方并合成
 */
function tryCraft() {
  if (state.status !== 'playing' || state.mode !== 'playing') return;

  const pair = findFirstCraftPair();
  if (!pair) {
    showToast('没有可合成的配方：继续采集，或按 Q 丢弃高亮卡', 'warn', 2200);
    addFloat('无可用配方', state.player.x, state.player.y - 44, '#ff9aa7', 13);
    triggerShake(2.5, 0.18);
    pulseBag('deny');
    return;
  }

  const cardA = state.backpack[pair.i];
  const cardB = state.backpack[pair.j];
  const resultCard = CARD_BY_ID[pair.recipe.out];

  // 先删后面的下标，再删前面的，避免下标错位
  [pair.i, pair.j].sort((a, b) => b - a).forEach((index) => {
    state.backpack.splice(index, 1);
  });
  state.backpack.push(resultCard.id);
  state.highlightIndex = state.backpack.length - 1;

  state.craftCount += 1;
  state.craftedEver[resultCard.tier] = true;
  const gained = resultCard.techPoints;
  state.techPoints += gained;
  state.totalTechEarned += gained;

  // “余料回收”升级：合成后退回一张随机 T1
  let refundName = '';
  if (state.refundEnabled && state.backpack.length < state.capacity) {
    const refundCard = CARD_BY_ID[pickRandom(CARD_CONFIG.filter((card) => card.tier === 1).map((card) => card.id))];
    state.backpack.push(refundCard.id);
    refundName = refundCard.name;
  }

  // 明显反馈：粒子、光环、飞卡、闪光、震屏、文字
  addBurst(state.player.x, state.player.y, TIER_COLOR[resultCard.tier], 24, 185);
  addRing(state.player.x, state.player.y, TIER_COLOR[resultCard.tier], 96);
  addRing(state.player.x, state.player.y, 'rgba(71,232,167,0.5)', 62);
  addCardFx(state.player.x, state.player.y, resultCard.id);
  addFloat('+' + resultCard.name + ' T' + resultCard.tier, state.player.x, state.player.y - 36, TIER_COLOR[resultCard.tier], 15);
  if (gained > 0) {
    addFloat('+' + gained + ' 科技点', state.player.x, state.player.y - 58, '#9dffd1', 13);
  }
  triggerShake(7, 0.3);
  flashScreen(hexToRgba(TIER_COLOR[resultCard.tier], 0.35));
  pulseBag('flash');

  showToast(
    '合成成功：' + resultCard.name + (gained > 0 ? ' · +' + gained + ' 科技点' : '')
      + (refundName ? ' · 回收返还「' + refundName + '」' : ''),
    'success',
    2400
  );

  renderBackpack();
  updateHUD();

  // 合成量子芯片 = 立即胜利
  if (resultCard.id === GAME_CONFIG.targetCardId) {
    winGame();
    return;
  }

  // 科技点达到 3 点：稍等飞卡动画后自动弹出三选一
  const runId = state.runId;
  if (state.techPoints >= GAME_CONFIG.upgradeCost) {
    setTimeout(() => {
      if (state.runId !== runId) return;
      if (state.status === 'playing' && state.mode === 'playing') {
        openUpgrade('craft');
      }
    }, 450);
  }
}

/**
 * 按 Q 丢弃当前高亮 / 最后拾取的一张卡
 */
function discardHighlight() {
  if (state.status !== 'playing' || state.mode !== 'playing') return;
  if (state.backpack.length === 0) {
    showToast('背包是空的，没有可以丢弃的卡', 'info', 1600);
    return;
  }

  const index = clamp(state.highlightIndex, 0, state.backpack.length - 1);
  const card = CARD_BY_ID[state.backpack[index]];
  state.backpack.splice(index, 1);
  state.highlightIndex = state.backpack.length > 0 ? Math.min(index, state.backpack.length - 1) : -1;

  addBurst(state.player.x, state.player.y, '#ff9aa7', 10, 100);
  addFloat('丢弃 ' + card.name, state.player.x, state.player.y - 36, '#ffb3bd', 13);
  showToast('已丢弃「' + card.name + '」，腾出 1 格背包', 'info', 1700);
  renderBackpack();
  updateHUD();
}

/**
 * 生成升级弹窗的 HTML（三个候选）
 * @param {Array} options 候选升级配置数组
 * @returns {string} 弹窗 HTML
 */
function buildUpgradeModalHtml(options) {
  const cards = options.map((upgrade, index) => {
    const stacks = state.upgrades[upgrade.id] || 0;
    const stackText = upgrade.maxStacks === 1 ? '一次性升级' : '已选 ' + stacks + ' / ' + upgrade.maxStacks;
    return '<button type="button" class="upgrade-card" data-upgrade-id="' + upgrade.id + '">'
      + '<span class="upgrade-icon">' + upgrade.icon + '</span>'
      + '<span class="upgrade-tag">' + upgrade.tag + '</span>'
      + '<span class="upgrade-title">' + upgrade.title + '</span>'
      + '<span class="upgrade-desc">' + upgrade.desc + '</span>'
      + '<span class="upgrade-stack">' + stackText + '</span>'
      + '<span class="upgrade-key">' + (index + 1) + '</span>'
      + '</button>';
  }).join('');

  return '<div class="modal-kicker">科技升级 · 消耗 ' + GAME_CONFIG.upgradeCost + ' 点</div>'
    + '<h2>三选一 · 选中即刻生效</h2>'
    + '<p class="modal-sub">当前科技点 <b>' + state.techPoints + '</b>，本次消耗 <b>'
    + GAME_CONFIG.upgradeCost + '</b> 点。升级会影响移动、采集、背包或时间。</p>'
    + '<div class="upgrade-grid">' + cards + '</div>'
    + '<div class="modal-note">按 <b>1 / 2 / 3</b> 也可以选择；弹窗打开期间倒计时与无人机暂停。</div>';
}

/**
 * 打开三选一升级弹窗
 * @param {string} reason craft / manual / debug，仅用于文案区分
 */
function openUpgrade(reason) {
  if (state.status !== 'playing') return;
  if (state.mode !== 'playing') return;
  if (state.techPoints < GAME_CONFIG.upgradeCost) {
    showToast('科技点不足：还差 ' + (GAME_CONFIG.upgradeCost - state.techPoints) + ' 点', 'warn', 1800);
    return;
  }

  // 过滤掉已经满级的升级；背包升级还会检查容量上限
  const available = UPGRADE_CONFIG.filter((upgrade) => {
    if (upgrade.id === 'bag' && state.capacity >= GAME_CONFIG.backpackMax) return false;
    const stacks = state.upgrades[upgrade.id] || 0;
    return stacks < upgrade.maxStacks;
  });
  if (available.length === 0) {
    showToast('所有升级都已满级，继续冲刺量子芯片吧', 'info', 2000);
    return;
  }

  const options = shuffleArray(available.slice()).slice(0, Math.min(3, available.length));
  state.upgradeOptions = options.map((upgrade) => upgrade.id);
  state.mode = 'upgrade';
  state.keys = {};
  state.player.vx = 0;
  state.player.vy = 0;

  ui.modal.className = 'modal';
  ui.modal.innerHTML = buildUpgradeModalHtml(options);
  ui.modalLayer.classList.remove('hidden');
  ui.modalLayer.setAttribute('aria-hidden', 'false');

  renderBackpack();
  updateHUD();

  setTimeout(() => {
    const first = ui.modal.querySelector('.upgrade-card');
    if (first) first.focus();
  }, 60);

  if (reason === 'craft') {
    showToast('科技点达到 3 点，选择一项升级', 'success', 1700);
  }
}

/**
 * 选择一个升级并立即应用
 * @param {string} upgradeId 升级 id
 */
function chooseUpgrade(upgradeId) {
  if (state.mode !== 'upgrade') return;
  if (!state.upgradeOptions.includes(upgradeId)) return;

  const upgrade = UPGRADE_BY_ID[upgradeId];
  if (!upgrade) return;

  state.techPoints -= GAME_CONFIG.upgradeCost;
  const stacks = state.upgrades[upgradeId] || 0;
  state.upgrades[upgradeId] = stacks + 1;
  state.upgradesTaken += 1;
  upgrade.apply();

  state.mode = 'playing';
  state.upgradeOptions = [];
  hideModal();

  addRing(state.player.x, state.player.y, 'rgba(71,232,167,0.55)', 80);
  addBurst(state.player.x, state.player.y, '#47e8a7', 16, 130);
  addFloat(upgrade.title + ' 已生效', state.player.x, state.player.y - 44, '#9dffd1', 14);
  triggerShake(4, 0.25);
  flashScreen('rgba(71,232,167,0.28)');
  showToast('升级生效：' + upgrade.title + ' · ' + upgrade.desc, 'success', 2600);

  renderBackpack();
  updateHUD();

  // 如果还有剩余科技点（一次拿到 6 点以上），稍后继续给三选一
  const runId = state.runId;
  if (state.techPoints >= GAME_CONFIG.upgradeCost) {
    setTimeout(() => {
      if (state.runId === runId && state.status === 'playing' && state.mode === 'playing') {
        openUpgrade('craft');
      }
    }, 500);
  }
}

/**
 * 隐藏通用弹窗
 */
function hideModal() {
  ui.modalLayer.classList.add('hidden');
  ui.modalLayer.setAttribute('aria-hidden', 'true');
  ui.modal.className = 'modal';
  ui.modal.innerHTML = '';
}

/**
 * 打开 / 收起规则说明；打开时暂停计时与移动
 */
function toggleRules() {
  if (state.status !== 'playing') return;
  if (state.mode === 'upgrade' || state.mode === 'result') return;

  const opening = state.mode !== 'rules';
  if (opening) {
    state.mode = 'rules';
    state.keys = {};
    state.player.vx = 0;
    state.player.vy = 0;
    buildRulesContent();
    ui.rulesPanel.classList.add('is-open');
    ui.rulesPanel.setAttribute('aria-hidden', 'false');
    const card = ui.rulesPanel.querySelector('.rules-card');
    if (card) card.scrollTop = 0;
  } else {
    state.mode = 'playing';
    ui.rulesPanel.classList.remove('is-open');
    ui.rulesPanel.setAttribute('aria-hidden', 'true');
    state.lastTime = performance.now();
  }

  renderBackpack();
  updateHUD();
}

/**
 * 触发无人机上线：放在远离玩家的地图边缘
 */
function activateDrone() {
  if (state.drone.active || state.status !== 'playing') return;
  const angle = Math.random() * Math.PI * 2;
  const distance = 520;
  const x = clamp(state.player.x + Math.cos(angle) * distance, 110, GAME_CONFIG.worldWidth - 110);
  const y = clamp(state.player.y + Math.sin(angle) * distance, 110, GAME_CONFIG.worldHeight - 110);

  state.drone.active = true;
  state.drone.x = x;
  state.drone.y = y;
  state.drone.cooldown = 0;

  showToast('警告：干扰无人机上线！被撞会掉卡并扣除 5 秒', 'warn', 3000);
  addFloat('无人机上线', state.player.x, state.player.y - 50, '#ff9aa7', 13);
  flashScreen('rgba(255,107,127,0.22)');
}

/**
 * 无人机撞到玩家：掉一张背包卡、扣 5 秒、击退玩家
 */
function droneHit() {
  const drone = state.drone;
  if (state.status !== 'playing' || state.mode !== 'playing' || !drone.active) return;
  if (drone.cooldown > 0) return;

  drone.cooldown = 4.5;
  state.timeLeft -= GAME_CONFIG.dronePenalty;

  let lostName = '';
  if (state.backpack.length > 0) {
    const index = clamp(state.highlightIndex, 0, state.backpack.length - 1);
    const card = CARD_BY_ID[state.backpack[index]];
    state.backpack.splice(index, 1);
    state.highlightIndex = state.backpack.length > 0 ? Math.min(index, state.backpack.length - 1) : -1;
    lostName = card.name;

    // 掉在角色附近的地上，2 秒后才能重新拾取，给玩家“抢回材料”的机会
    const angle = Math.random() * Math.PI * 2;
    state.items.push({
      cardId: card.id,
      x: clamp(state.player.x + Math.cos(angle) * 68, 60, GAME_CONFIG.worldWidth - 60),
      y: clamp(state.player.y + Math.sin(angle) * 68, 60, GAME_CONFIG.worldHeight - 60),
      life: 18,
      pickupDelay: 1.8,
      bob: Math.random() * 10
    });
  }

  // 从无人机指向角色的方向击退
  const dx = state.player.x - drone.x;
  const dy = state.player.y - drone.y;
  const length = Math.hypot(dx, dy) || 1;
  state.player.vx += (dx / length) * 230;
  state.player.vy += (dy / length) * 230;

  addBurst(state.player.x, state.player.y, '#ff6b7f', 18, 160);
  addFloat('-' + GAME_CONFIG.dronePenalty + ' 秒', state.player.x, state.player.y - 42, '#ff9aa7', 15);
  if (lostName) addFloat('丢失 ' + lostName, state.player.x, state.player.y - 64, '#ffb3bd', 12);
  triggerShake(11, 0.5);
  flashScreen('rgba(255,107,127,0.34)');
  pulseBag('deny');

  showToast(
    lostName
      ? '无人机撞击：丢失「' + lostName + '」，倒计时 -5 秒'
      : '无人机撞击：倒计时 -5 秒（背包为空）',
    'error',
    2600
  );

  renderBackpack();
  updateHUD();

  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    loseGame();
  }
}

/**
 * 倒计时归零：失败结算
 */
function loseGame() {
  if (state.status !== 'playing') return;
  state.status = 'lost';
  state.timeLeft = 0;
  state.keys = {};
  state.player.vx = 0;
  state.player.vy = 0;

  addFloat('倒计时归零', state.player.x, state.player.y - 46, '#ff9aa7', 16);
  triggerShake(8, 0.45);
  flashScreen('rgba(255,107,127,0.3)');
  showToast('倒计时结束，量子芯片未能点亮', 'error', 2800);
  updateHUD();
  renderBackpack();

  const runId = state.runId;
  setTimeout(() => {
    if (state.runId === runId && state.status === 'lost') showResult(false);
  }, 700);
}

/**
 * 合出量子芯片：立即胜利并稍后弹出结算
 */
function winGame() {
  if (state.status !== 'playing') return;
  state.status = 'won';
  state.keys = {};
  state.player.vx = 0;
  state.player.vy = 0;

  addBurst(state.player.x, state.player.y, '#ff6bc1', 34, 240);
  addRing(state.player.x, state.player.y, 'rgba(255,107,193,0.7)', 150);
  addFloat('量子芯片已点亮', state.player.x, state.player.y - 54, '#ffd0ec', 17);
  triggerShake(12, 0.6);
  flashScreen('rgba(255,107,193,0.4)');
  showToast('量子芯片合成成功！终极目标达成', 'success', 3200);
  updateHUD();
  renderBackpack();

  const runId = state.runId;
  setTimeout(() => {
    if (state.runId === runId && state.status === 'won') showResult(true);
  }, 950);
}

/**
 * 显示结算弹窗
 * @param {boolean} isWin true 为胜利，false 为失败
 */
function showResult(isWin) {
  state.mode = 'result';
  state.keys = {};
  state.player.vx = 0;
  state.player.vy = 0;

  const title = isWin ? '量子芯片已点亮' : '产线停摆';
  const kicker = isWin ? '任务完成' : '信号中断';
  const desc = isWin
    ? '芯片与电池完成封装，量子芯片启动成功。你在倒计时结束前跑通了整条配方链。'
    : '倒计时归零，量子芯片还未完成。下一局可以优先清理背包、沿配方链推进。';
  const tip = isWin
    ? '试试更少升级次数，或不开无人机硬闯一局。'
    : '优先采集矿石与硅砂，尽早做出电路板，再补电池。';

  ui.modal.className = 'modal result-modal ' + (isWin ? 'is-win' : 'is-lose');
  ui.modal.innerHTML = ''
    + '<div class="result-icon">' + (isWin ? '◈' : '⚠') + '</div>'
    + '<div class="modal-kicker">' + kicker + '</div>'
    + '<h2>' + title + '</h2>'
    + '<p class="modal-sub">' + desc + '</p>'
    + '<div class="result-stats">'
    + '<div class="result-stat"><span>本局用时</span><b>' + formatTime(state.elapsed) + '</b></div>'
    + '<div class="result-stat"><span>采集次数</span><b>' + state.gatherCount + '</b></div>'
    + '<div class="result-stat"><span>合成次数</span><b>' + state.craftCount + '</b></div>'
    + '<div class="result-stat"><span>科技升级</span><b>' + state.upgradesTaken + '</b></div>'
    + '<div class="result-stat is-highlight"><span>累计科技点</span><b>' + state.totalTechEarned + '</b></div>'
    + '<div class="result-stat"><span>背包占用</span><b>' + state.backpack.length + ' / ' + state.capacity + '</b></div>'
    + '</div>'
    + '<p class="modal-sub">' + tip + '</p>'
    + '<button type="button" class="btn btn-primary btn-big" data-action="restart">再来一局（R）</button>';

  ui.modalLayer.classList.remove('hidden');
  ui.modalLayer.setAttribute('aria-hidden', 'false');
  renderBackpack();
  updateHUD();

  setTimeout(() => {
    const button = ui.modal.querySelector('[data-action="restart"]');
    if (button) button.focus();
  }, 80);
}

/**
 * 一键重开：重建状态、随机新地图、重置计时与升级
 */
function restartGame() {
  hideModal();
  ui.rulesPanel.classList.remove('is-open');
  ui.rulesPanel.setAttribute('aria-hidden', 'true');
  ui.screenFlash.classList.remove('is-on');

  state = createInitialState();
  state.lastTime = performance.now();
  resizeCanvas();
  renderBackpack();
  updateHUD();
  drawMinimap();

  showToast('新一局开始：WASD 移动，靠近发光节点自动采集；按 E 合成', 'info', 2600);
}

/**
 * 键盘按下：移动、合成、丢弃、规则、升级选择、结算重开
 * @param {KeyboardEvent} event 键盘事件
 */
function handleKeyDown(event) {
  const code = event.code;
  const moveCodes = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (moveCodes.includes(code) || code === 'Space') event.preventDefault();

  // 升级弹窗：数字键快速选择
  if (state.mode === 'upgrade') {
    const numberKeys = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (code in numberKeys) {
      const optionId = state.upgradeOptions[numberKeys[code]];
      if (optionId) chooseUpgrade(optionId);
    }
    return;
  }

  // 结算弹窗：R 直接重开
  if (state.mode === 'result') {
    if (code === 'KeyR' && !event.repeat) restartGame();
    return;
  }

  // 规则面板随时可以用 H 关闭
  if (code === 'KeyH') {
    if (!event.repeat) toggleRules();
    return;
  }

  if (state.mode !== 'playing' || state.status !== 'playing') return;

  if (code === 'KeyE') {
    if (!event.repeat) tryCraft();
    return;
  }
  if (code === 'KeyQ') {
    if (!event.repeat) discardHighlight();
    return;
  }

  if (moveCodes.includes(code)) state.keys[code] = true;
}

/**
 * 键盘松开：取消对应移动方向
 * @param {KeyboardEvent} event 键盘事件
 */
function handleKeyUp(event) {
  delete state.keys[event.code];
}

/**
 * 绑定所有事件监听（初始化时只执行一次）
 */
function bindEvents() {
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('keyup', handleKeyUp);
  window.addEventListener('blur', () => { state.keys = {}; });
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('visibilitychange', () => { state.lastTime = performance.now(); });

  ui.btnCraft.addEventListener('click', tryCraft);
  ui.btnDiscard.addEventListener('click', discardHighlight);
  ui.btnUpgrade.addEventListener('click', () => openUpgrade('manual'));
  ui.btnRules.addEventListener('click', toggleRules);
  ui.btnRestart.addEventListener('click', restartGame);
  ui.rulesClose.addEventListener('click', toggleRules);

  // 点击规则遮罩空白处也能关闭
  ui.rulesPanel.addEventListener('click', (event) => {
    if (event.target === ui.rulesPanel) toggleRules();
  });

  // 点击背包格：设为高亮，随后可按 Q 丢弃
  ui.backpack.addEventListener('click', (event) => {
    const slot = event.target.closest('[data-index]');
    if (!slot) return;
    const index = Number(slot.dataset.index);
    if (index < 0 || index >= state.backpack.length) return;
    state.highlightIndex = index;
    const card = CARD_BY_ID[state.backpack[index]];
    renderBackpack();
    showToast('已高亮「' + card.name + '」，按 Q 丢弃', 'info', 1200);
  });

  // 弹窗按钮：升级选项与结算重开
  ui.modal.addEventListener('click', (event) => {
    const upgradeBtn = event.target.closest('[data-upgrade-id]');
    if (upgradeBtn) {
      chooseUpgrade(upgradeBtn.dataset.upgradeId);
      return;
    }
    const restartBtn = event.target.closest('[data-action="restart"]');
    if (restartBtn) restartGame();
  });
}
/* ============================================================
   六、主循环与初始化
   ------------------------------------------------------------
   requestAnimationFrame + 时间步长；切后台或弹窗打开时自动暂停结算。
   ============================================================ */

/**
 * 更新角色移动：平滑加速、摩擦减速、边界阻挡
 * @param {number} dt 时间步长（秒）
 */
function updatePlayer(dt) {
  const player = state.player;
  const keys = state.keys;
  const left = keys.KeyA || keys.ArrowLeft;
  const right = keys.KeyD || keys.ArrowRight;
  const up = keys.KeyW || keys.ArrowUp;
  const down = keys.KeyS || keys.ArrowDown;

  let dirX = (right ? 1 : 0) - (left ? 1 : 0);
  let dirY = (down ? 1 : 0) - (up ? 1 : 0);

  if (dirX !== 0 || dirY !== 0) {
    const length = Math.hypot(dirX, dirY);
    dirX /= length;
    dirY /= length;

    // 加速度累积，松开后靠摩擦自然减速，避免“一格一格”的僵硬移动
    player.vx += dirX * GAME_CONFIG.playerAccel * dt;
    player.vy += dirY * GAME_CONFIG.playerAccel * dt;
  } else {
    const damping = Math.exp(-GAME_CONFIG.playerFriction * dt);
    player.vx *= damping;
    player.vy *= damping;
  }

  const maxSpeed = GAME_CONFIG.playerSpeed * state.speedMul;
  const speed = Math.hypot(player.vx, player.vy);
  if (speed > maxSpeed) {
    player.vx = (player.vx / speed) * maxSpeed;
    player.vy = (player.vy / speed) * maxSpeed;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // 地图边界阻挡：撞墙时把速度清零，避免贴边抖动
  const margin = 30;
  if (player.x < margin) {
    player.x = margin;
    player.vx = 0;
  } else if (player.x > GAME_CONFIG.worldWidth - margin) {
    player.x = GAME_CONFIG.worldWidth - margin;
    player.vx = 0;
  }
  if (player.y < margin) {
    player.y = margin;
    player.vy = 0;
  } else if (player.y > GAME_CONFIG.worldHeight - margin) {
    player.y = GAME_CONFIG.worldHeight - margin;
    player.vy = 0;
  }

  const nowSpeed = Math.hypot(player.vx, player.vy);
  if (nowSpeed > 8) player.angle = Math.atan2(player.vy, player.vx);

  // 移动时在身后留下少量全息尾迹
  state.trailAccum += dt;
  if (nowSpeed > 110 && state.trailAccum > 0.055) {
    state.trailAccum = 0;
    state.particles.push({
      x: player.x - Math.cos(player.angle) * 15,
      y: player.y - Math.sin(player.angle) * 15,
      vx: -player.vx * 0.12 + (Math.random() * 12 - 6),
      vy: -player.vy * 0.12 + (Math.random() * 12 - 6),
      life: 0.35,
      maxLife: 0.35,
      size: 1.5 + Math.random() * 1.4,
      color: 'rgba(62,230,255,0.55)'
    });
  }
}

/**
 * 自动采集：按固定间隔寻找采集范围内最近的未采空节点
 * @param {number} dt 时间步长（秒）
 */
function updatePickup(dt) {
  state.pickAccum += dt;
  const interval = GAME_CONFIG.pickInterval * state.pickIntervalMul;
  if (state.pickAccum < interval) return;
  state.pickAccum = 0;

  const reach = GAME_CONFIG.pickupRadius * state.pickupMul;
  let nearest = null;
  let nearestDist = Infinity;

  state.nodes.forEach((node) => {
    if (node.amount <= 0) return;
    const distance = Math.hypot(state.player.x - node.x, state.player.y - node.y) - node.radius * 0.4;
    if (distance <= reach && distance < nearestDist) {
      nearest = node;
      nearestDist = distance;
    }
  });

  if (!nearest) return;

  if (state.backpack.length >= state.capacity) {
    showBagFullHint();
    return;
  }

  collectNode(nearest);
}

/**
 * 更新地上的掉落卡：倒计时消散，或进入采集范围后被重新拾取
 * @param {number} dt 时间步长（秒）
 */
function updateItems(dt) {
  const reach = GAME_CONFIG.pickupRadius * state.pickupMul;

  for (let i = state.items.length - 1; i >= 0; i -= 1) {
    const item = state.items[i];
    item.life -= dt;
    item.pickupDelay -= dt;

    if (item.life <= 0) {
      addFloat('掉落卡消散', item.x, item.y - 24, 'rgba(160,180,205,0.6)', 11);
      state.items.splice(i, 1);
      continue;
    }

    const distance = Math.hypot(state.player.x - item.x, state.player.y - item.y);
    if (distance <= reach && item.pickupDelay <= 0) {
      if (state.backpack.length >= state.capacity) {
        showBagFullHint();
        continue;
      }

      const card = CARD_BY_ID[item.cardId];
      state.backpack.push(card.id);
      state.highlightIndex = state.backpack.length - 1;
      state.gatherCount += 1;
      addBurst(item.x, item.y, TIER_COLOR[card.tier], 10, 110);
      addFloat('回收 ' + card.name, item.x, item.y - 24, TIER_COLOR[card.tier], 12);
      showToast('已回收掉落的「' + card.name + '」', 'success', 1500);
      state.items.splice(i, 1);
      renderBackpack();
    }
  }
}

/**
 * 更新无人机：延迟上线，缓慢追击，碰到角色触发惩罚
 * @param {number} dt 时间步长（秒）
 */
function updateDrone(dt) {
  const drone = state.drone;

  if (!drone.active) {
    if (state.elapsed >= GAME_CONFIG.droneDelay) activateDrone();
    return;
  }

  drone.cooldown = Math.max(0, drone.cooldown - dt);

  const dx = state.player.x - drone.x;
  const dy = state.player.y - drone.y;
  const distance = Math.hypot(dx, dy) || 1;

  // 速度明显低于角色，保持“慢慢逼近”的压力感
  drone.x += (dx / distance) * GAME_CONFIG.droneSpeed * dt;
  drone.y += (dy / distance) * GAME_CONFIG.droneSpeed * dt;
  drone.x = clamp(drone.x, 40, GAME_CONFIG.worldWidth - 40);
  drone.y = clamp(drone.y, 40, GAME_CONFIG.worldHeight - 40);

  if (distance < 30 && drone.cooldown <= 0) {
    droneHit();
  }
}

/**
 * 更新粒子、光环、浮动文字、飞卡与震屏
 * @param {number} dt 时间步长（秒）
 */
function updateEffects(dt) {
  for (let i = state.particles.length - 1; i >= 0; i -= 1) {
    const particle = state.particles[i];
    particle.life -= dt;
    if (particle.life <= 0) {
      state.particles.splice(i, 1);
      continue;
    }
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vx *= 0.94;
    particle.vy *= 0.94;
  }

  for (let i = state.rings.length - 1; i >= 0; i -= 1) {
    const ring = state.rings[i];
    ring.life -= dt;
    if (ring.life <= 0) {
      state.rings.splice(i, 1);
      continue;
    }
    const progress = 1 - ring.life / ring.maxLife;
    ring.radius = 10 + (ring.maxRadius - 10) * progress;
  }

  for (let i = state.floats.length - 1; i >= 0; i -= 1) {
    const floatText = state.floats[i];
    floatText.life -= dt;
    if (floatText.life <= 0) {
      state.floats.splice(i, 1);
      continue;
    }
    floatText.y -= 30 * dt;
  }

  for (let i = state.cardFx.length - 1; i >= 0; i -= 1) {
    const fx = state.cardFx[i];
    fx.life -= dt;
    if (fx.life <= 0) state.cardFx.splice(i, 1);
  }

  if (state.shake.time > 0) {
    state.shake.time -= dt;
    if (state.shake.time <= 0) state.shake.power = 0;
  }
}

/**
 * 每帧更新入口：只在 playing 时推进世界；弹窗/规则/结算会暂停
 * @param {number} dt 时间步长（秒）
 */
function update(dt) {
  if (state.mode !== 'playing' || state.status !== 'playing') {
    updateHUD();
    return;
  }

  state.elapsed += dt;
  state.timeLeft -= dt;

  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    loseGame();
    updateHUD();
    return;
  }

  updatePlayer(dt);
  updateCamera(dt);
  updatePickup(dt);
  updateItems(dt);
  updateDrone(dt);
  updateEffects(dt);
  updateHUD();
}

/**
 * requestAnimationFrame 主循环：限制单帧 dt，避免切后台后瞬移
 * @param {number} now 当前时间戳
 */
function loop(now) {
  const rawDelta = Math.max(0, now - state.lastTime);
  const dt = Math.min(rawDelta / 1000, 0.05);
  state.lastTime = now;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

/**
 * 初始化：绑定事件、调整画布、首帧渲染、开始主循环
 */
function init() {
  window.__errors = [];
  window.addEventListener('error', (event) => {
    window.__errors.push(String(event.message || event.error || 'unknown error'));
  });

  bindEvents();
  resizeCanvas();
  state.lastTime = performance.now();
  renderBackpack();
  updateHUD();
  drawMinimap();
  requestAnimationFrame(loop);

  // 开局引导，不阻塞操作
  setTimeout(() => {
    if (state.status === 'playing') {
      showToast('开局赠送 3 张 T1：WASD 移动，靠近发光资源点自动采集，按 E 合成', 'info', 3000);
    }
  }, 800);
}

init();

/* ============================================================
   自动化测试接口（正常游玩不需要）
   ------------------------------------------------------------
   方便快速布置背包、传送、改时间，验证核心路径。
   ============================================================ */
window.__roamDebug = {
  /** 读取当前完整状态 */
  getState: () => state,

  /**
   * 把角色传送到指定世界坐标（用于测试采集与边界）
   * @param {number} x 世界 x
   * @param {number} y 世界 y
   */
  teleport(x, y) {
    state.player.x = clamp(x, 30, GAME_CONFIG.worldWidth - 30);
    state.player.y = clamp(y, 30, GAME_CONFIG.worldHeight - 30);
    state.player.vx = 0;
    state.player.vy = 0;
    snapCamera();
  },

  /**
   * 直接设置背包内容（用于测试合成与满包）
   * @param {Array<string>} ids 卡牌 id 数组
   */
  setBackpack(ids) {
    state.backpack = ids.slice(0, state.capacity);
    state.highlightIndex = state.backpack.length - 1;
    renderBackpack();
    updateHUD();
  },

  /**
   * 设置剩余时间（用于测试失败路径）
   * @param {number} seconds 剩余秒数
   */
  setTime(seconds) {
    state.timeLeft = seconds;
    updateHUD();
  },

  /**
   * 增加科技点（用于测试升级）
   * @param {number} amount 点数
   */
  addTech(amount) {
    state.techPoints += amount;
    state.totalTechEarned += amount;
    updateHUD();
    renderBackpack();
  },

  /** 找到指定类型的第一个未采空节点，方便测试自动采集 */
  nearestNode(type) {
    const list = state.nodes.filter((node) => node.type === type && node.amount > 0);
    if (!list.length) return null;
    return list.slice().sort((a, b) => {
      return Math.hypot(a.x - state.player.x, a.y - state.player.y)
        - Math.hypot(b.x - state.player.x, b.y - state.player.y);
    })[0];
  },

  /** 立即执行一次合成 */
  craft() { tryCraft(); },

  /** 立即丢弃高亮卡 */
  discard() { discardHighlight(); },

  /** 打开升级弹窗 */
  openUpgrade() { openUpgrade('debug'); },

  /** 强制无人机上线 */
  forceDrone() { activateDrone(); },

  /** 强制模拟一次无人机撞击 */
  forceDroneHit() { droneHit(); },

  /** 打开 / 关闭规则 */
  toggleRules() { toggleRules(); },

  /** 读取运行时 JS 错误列表 */
  errors: () => window.__errors
};
</script>
