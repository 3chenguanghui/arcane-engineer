<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型2 · 噬室 — 房间就是消耗品</title>
<style>
  html,body{margin:0;padding:0;background:#060706;overflow:hidden;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;max-width:100vw;max-height:100vh;cursor:pointer;}

<body>
<div id="wrap"><canvas id="cv" width="1280" height="760"></canvas></div>

<!-- ================= 纯逻辑核心：不碰 DOM，可被 Node 提取跑自测 ================= -->
<script id="core">
const Core = (function () {
  'use strict';

  // ===== 可调参数区 =====
  const CFG = {
    cols: 7,
    rows: 5,
    maxSteps: 24,           // 总步数（移动与吞噬都消耗）
    bossArmor: 100,         // 祭主护甲：地脉达到这个数才能赢
    voidChance: 0.16,       // 生成地图时的空洞比例
    start: { x: 0, y: 4 },
    boss: { x: 6, y: 0 },
  };

  // 房间类型：yield 是吞噬后得到的地脉；heal 是首次进入时返还的步数
  const TYPES = {
    empty:  { name: '空室',   yield: 7,  heal: 0, extraCost: 0, color: '#6b5f52', icon: '·' },
    spring: { name: '泉眼',   yield: 5,  heal: 3, extraCost: 0, color: '#3d6f6b', icon: '≈' },
    smith:  { name: '铁匠铺', yield: 11, heal: 0, extraCost: 0, color: '#8a5326', icon: '⚒' },
    altar:  { name: '祭坛',   yield: 9,  heal: 0, extraCost: 1, color: '#5f3d70', icon: '△' },
    vault:  { name: '宝库',   yield: 14, heal: 0, extraCost: 0, color: '#8a7420', icon: '◆' },
    start:  { name: '入口',   yield: 0,  heal: 0, extraCost: 0, color: '#4a4038', icon: '⌂' },
    boss:   { name: '祭主之厅', yield: 0, heal: 0, extraCost: 0, color: '#6b1f18', icon: '◉' },
  };

  // 三种自测策略：只改变“吃多少房间”，寻路逻辑完全一致
  const POLICIES = [
    { id: 'rush',    name: '只赶路',   desc: '一间房都不吃，直接冲向祭主' },
    { id: 'greedy',  name: '见房就吃', desc: '相邻房间能吃的全吃，不管步数够不够' },
    { id: 'planner', name: '算路再吃', desc: '只吃不会切断祭主之路的房间，够护甲就走' },
  ];

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  /** 32 位可复现随机数生成器 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 坐标转一维索引 */
  function idx(x, y) { return y * CFG.cols + x; }

  /** 取某个格子，越界返回 null */
  function cellAt(cells, x, y) {
    if (x < 0 || y < 0 || x >= CFG.cols || y >= CFG.rows) return null;
    return cells[idx(x, y)];
  }

  /** 按权重随机挑一个普通房间类型 */
  function pickType(rng) {
    const r = rng();
    if (r < 0.42) return 'empty';
    if (r < 0.56) return 'spring';
    if (r < 0.76) return 'smith';
    if (r < 0.90) return 'altar';
    return 'vault';
  }

  /** BFS 最短路：返回从 from 到 to 的坐标数组（不含起点，含终点），不可达返回 null */
  function shortestPath(cells, from, to) {
    const start = idx(from.x, from.y), goal = idx(to.x, to.y);
    const prev = new Int32Array(cells.length).fill(-1);
    const seen = new Uint8Array(cells.length);
    const q = [start];
    seen[start] = 1;
    let head = 0;
    while (head < q.length) {
      const cur = q[head++];
      if (cur === goal) break;
      const cx = cur % CFG.cols, cy = (cur / CFG.cols) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= CFG.cols || ny >= CFG.rows) continue;
        const ni = idx(nx, ny);
        if (seen[ni] || !cells[ni].alive) continue;
        seen[ni] = 1;
        prev[ni] = cur;
        q.push(ni);
      }
    }
    if (!seen[goal]) return null;
    const path = [];
    let cur = goal;
    while (cur !== start) {
      path.push({ x: cur % CFG.cols, y: (cur / CFG.cols) | 0 });
      cur = prev[cur];
    }
    return path.reverse();
  }

  /** 生成一张保证入口与祭主连通的随机地图 */
  function generateMap(seed) {
    const rng = mulberry32((seed >>> 0) || 1);
    for (let attempt = 0; attempt < 300; attempt++) {
      const cells = [];
      for (let y = 0; y < CFG.rows; y++) {
        for (let x = 0; x < CFG.cols; x++) {
          const isStart = x === CFG.start.x && y === CFG.start.y;
          const isBoss = x === CFG.boss.x && y === CFG.boss.y;
          let alive = true, type = 'empty';
          if (isStart) type = 'start';
          else if (isBoss) type = 'boss';
          else if (rng() < CFG.voidChance) alive = false;
          else type = pickType(rng);
          cells.push({ x: x, y: y, alive: alive, type: type, used: false });
        }
      }
      const aliveCount = cells.filter(function (c) { return c.alive; }).length;
      const path = shortestPath(cells, CFG.start, CFG.boss);
      if (aliveCount >= 26 && path && path.length >= 8) return cells;
    }
    // 极端情况兜底：全图无空洞
    const cells = [];
    for (let y = 0; y < CFG.rows; y++) {
      for (let x = 0; x < CFG.cols; x++) {
        const type = (x === CFG.start.x && y === CFG.start.y) ? 'start'
          : (x === CFG.boss.x && y === CFG.boss.y) ? 'boss' : pickType(rng);
        cells.push({ x: x, y: y, alive: true, type: type, used: false });
      }
    }
    return cells;
  }

  /** 记录日志 */
  function log(s, text) {
    s.log.push(text);
    if (s.log.length > 30) s.log.shift();
  }

  /** 创建一局：地图、玩家、步数、地脉 */
  function createRun(seed) {
    const cells = generateMap(seed);
    const s = {
      seed: (seed >>> 0) || 1,
      cells: cells,
      player: { x: CFG.start.x, y: CFG.start.y },
      steps: CFG.maxSteps,
      maxSteps: CFG.maxSteps,
      power: 0,
      armor: CFG.bossArmor,
      consumed: 0,
      actions: 0,
      over: false,
      result: '',
      reason: '',
      log: [],
      eatenLog: [],
    };
    log(s, '入口：带着 0 地脉出发。想吃房间，就得靠近它。');
    return s;
  }

  /** 结束判定 */
  function checkOver(s) {
    if (s.over) return true;
    if (s.result === 'win' || s.result === 'lose') { s.over = true; return true; }
    if (s.steps <= 0) {
      s.over = true; s.result = 'lose'; s.reason = '步数耗尽';
      log(s, '脚步耗尽。你被留在了正在收缩的地图里。');
      return true;
    }
    return false;
  }

  /** 某格是否与玩家相邻 */
  function isAdjacent(s, x, y) {
    const dx = Math.abs(s.player.x - x), dy = Math.abs(s.player.y - y);
    return dx + dy === 1;
  }

  /** 移动到一个相邻房间；进泉眼首次会返还步数，进祭主之厅判定胜负 */
  function moveTo(s, x, y) {
    if (s.over) return false;
    const c = cellAt(s.cells, x, y);
    if (!c || !c.alive || !isAdjacent(s, x, y)) return false;
    const t = TYPES[c.type];
    s.player.x = x; s.player.y = y;
    s.steps -= 1;
    s.actions++;

    if (c.type === 'spring' && !c.used) {
      c.used = true;
      s.steps += t.heal;
      log(s, '踏入泉眼：+' + t.heal + ' 步。这间房还可以之后被吃掉。');
    }

    if (c.type === 'boss') {
      s.over = true;
      if (s.power >= s.armor) {
        s.result = 'win';
        s.reason = '地脉击穿护甲';
        log(s, '地脉 ' + s.power + ' ≥ 护甲 ' + s.armor + '：祭主之厅崩塌。');
      } else {
        s.result = 'lose';
        s.reason = '护甲未破';
        log(s, '只有 ' + s.power + ' 地脉，护甲 ' + s.armor + '：你被祭主吞下。');
      }
      return true;
    }

    log(s, '移动到「' + t.name + '」。剩余 ' + Math.max(0, s.steps) + ' 步。');
    checkOver(s);
    return true;
  }

  /** 吞噬一个相邻房间：房间永久消失、获得地脉、步数消耗；可能把路吃断 */
  function consume(s, x, y) {
    if (s.over) return false;
    const c = cellAt(s.cells, x, y);
    if (!c || !c.alive || !isAdjacent(s, x, y)) return false;
    if (c.type === 'boss' || c.type === 'start') return false;
    const t = TYPES[c.type];
    const cost = 1 + t.extraCost;
    if (s.steps < cost) return false;

    c.alive = false;
    s.steps -= cost;
    s.power += t.yield;
    s.consumed++;
    s.actions++;
    s.eatenLog.push({ type: c.type, x: x, y: y, yield: t.yield });

    log(s, '吞噬「' + t.name + '」：+' + t.yield + ' 地脉，−' + cost + ' 步。这间房从地图上消失了。');

    // 关键：地图结构真的变了——如果祭主之路被吃断，立刻失败
    const path = shortestPath(s.cells, s.player, CFG.boss);
    if (!path) {
      s.over = true;
      s.result = 'lose';
      s.reason = '路被吃断';
      log(s, '你把通往祭主之厅的最后一条路吃断了。');
      return true;
    }
    if (s.power >= s.armor) log(s, '地脉够了。现在去祭主之厅。');
    checkOver(s);
    return true;
  }

  /** 列出所有可吞噬的相邻房间 */
  function adjacentFood(s) {
    const out = [];
    for (let d = 0; d < 4; d++) {
      const x = s.player.x + DIRS[d][0], y = s.player.y + DIRS[d][1];
      const c = cellAt(s.cells, x, y);
      if (!c || !c.alive) continue;
      if (c.type === 'boss' || c.type === 'start') continue;
      const t = TYPES[c.type];
      out.push({ x: x, y: y, cell: c, type: c.type, yield: t.yield, cost: 1 + t.extraCost });
    }
    return out;
  }

  /** 复制地图并模拟“如果吃掉某格”，用于策略判断 */
  function pathIfEaten(s, x, y) {
    const sim = s.cells.map(function (c) { return { x: c.x, y: c.y, alive: c.alive, type: c.type, used: c.used }; });
    sim[idx(x, y)].alive = false;
    return shortestPath(sim, s.player, CFG.boss);
  }

  /** 策略走一步：三种策略共用移动规则，只改变吞噬判断 */
  function policyStep(s, policyId) {
    if (s.over) return false;
    const path = shortestPath(s.cells, s.player, CFG.boss);
    if (!path) {
      s.over = true; s.result = 'lose'; s.reason = '无路可走';
      return false;
    }
    const food = adjacentFood(s);

    if (policyId === 'greedy') {
      // 见房就吃：不主动吃断唯一的祭主之路，但完全不考虑剩余步数够不够
      food.sort(function (a, b) { return b.yield - a.yield; });
      for (let i = 0; i < food.length; i++) {
        const f = food[i];
        if (pathIfEaten(s, f.x, f.y)) return consume(s, f.x, f.y);
      }
      return moveTo(s, path[0].x, path[0].y);
    }

    if (policyId === 'planner') {
      // 算路再吃：只吃“吃完仍然能到 boss”且步数留有余量的房间
      if (s.power < s.armor) {
        food.sort(function (a, b) { return b.yield - a.yield; });
        for (let i = 0; i < food.length; i++) {
          const f = food[i];
          const after = pathIfEaten(s, f.x, f.y);
          if (after && s.steps - f.cost > after.length + 1) {
            return consume(s, f.x, f.y);
          }
        }
      }
      return moveTo(s, path[0].x, path[0].y);
    }

    // rush：只赶路
    return moveTo(s, path[0].x, path[0].y);
  }

  /** 自动跑一局指定策略 */
  function autoRun(policyId, seed) {
    const s = createRun(seed);
    let guard = 0;
    while (!s.over && guard++ < 200) {
      const before = s.actions;
      policyStep(s, policyId);
      if (s.actions === before) { // 没有任何动作，视为卡死
        s.over = true; s.result = 'lose'; s.reason = '无路可走';
      }
    }
    if (!s.over) { s.over = true; s.result = 'lose'; s.reason = '超时'; }
    return {
      win: s.result === 'win',
      reason: s.reason,
      stepsLeft: Math.max(0, s.steps),
      power: s.power,
      consumed: s.consumed,
      actions: s.actions,
    };
  }

  /** 自测入口：三种策略各跑 games 局 */
  function runBatch(games) {
    const n = games || 200;
    return POLICIES.map(function (p) {
      const r = {
        id: p.id, name: p.name, desc: p.desc, games: n,
        wins: 0, winRate: 0, avgSteps: 0, avgConsumed: 0, avgPower: 0,
        losePath: 0, loseSteps: 0, loseArmor: 0, loseOther: 0,
      };
      let steps = 0, consumed = 0, power = 0;
      for (let i = 1; i <= n; i++) {
        const g = autoRun(p.id, i * 7919 + 17);
        if (g.win) r.wins++;
        else if (g.reason === '路被吃断' || g.reason === '无路可走') r.losePath++;
        else if (g.reason === '步数耗尽') r.loseSteps++;
        else if (g.reason === '护甲未破') r.loseArmor++;
        else r.loseOther++;
        steps += g.stepsLeft; consumed += g.consumed; power += g.power;
      }
      r.winRate = r.wins / n;
      r.avgSteps = steps / n;
      r.avgConsumed = consumed / n;
      r.avgPower = power / n;
      return r;
    });
  }

  return {
    CFG: CFG, TYPES: TYPES, POLICIES: POLICIES,
    createRun: createRun, moveTo: moveTo, consume: consume,
    adjacentFood: adjacentFood, shortestPath: shortestPath,
    cellAt: cellAt, isAdjacent: isAdjacent, runBatch: runBatch, autoRun: autoRun,
  };
})();
</script>

<!-- ================= 画面与交互 ================= -->
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 1280, H = 760;
  const C = Core.CFG;

  // ===== 画面配色（潮湿石室 / 地脉） =====
  const PAL = {
    bg0: '#050605', bg1: '#0c110b', bg2: '#131a16',
    stone: '#2a2b26', edge: 'rgba(190,210,190,.16)',
    text: '#e8e4d8', dim: '#8f958a',
    teal: '#6fbfae', ember: '#e8a04a', bad: '#d05545', ok: '#8fc98f',
    path: 'rgba(160,190,170,.20)',
  };

  // ===== 地图布局 =====
  const GRID = {
    x: 44, y: 126, cw: 104, ch: 92, gx: 14, gy: 12,
  };

  // ===== 运行时状态 =====
  let run = Core.createRun((Math.random() * 1e9) | 0);
  let mode = 'move';            // move | consume
  let test = null;
  let showTest = false;
  let particles = [];
  let floats = [];
  let shake = 0, time = 0, last = performance.now();
  let hoverCell = null;
  let mouse = { x: -999, y: -999 };

  // ===== 音效 =====
  let AC = null;
  /** 播放一个短促的合成音效 */
  function sfx(type) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const now = AC.currentTime;
      const o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      if (type === 'move') { o.type = 'sine'; o.frequency.setValueAtTime(220, now); o.frequency.exponentialRampToValueAtTime(150, now + 0.08); g.gain.setValueAtTime(0.05, now); }
      else if (type === 'eat') { o.type = 'sawtooth'; o.frequency.setValueAtTime(160, now); o.frequency.exponentialRampToValueAtTime(45, now + 0.24); g.gain.setValueAtTime(0.09, now); }
      else if (type === 'win') { o.type = 'triangle'; o.frequency.setValueAtTime(240, now); o.frequency.exponentialRampToValueAtTime(620, now + 0.3); g.gain.setValueAtTime(0.1, now); }
      else { o.type = 'square'; o.frequency.setValueAtTime(120, now); o.frequency.exponentialRampToValueAtTime(50, now + 0.3); g.gain.setValueAtTime(0.08, now); }
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      o.start(now); o.stop(now + 0.36);
    } catch (e) { /* 静音也能玩 */ }
  }

  /** 粒子 */
  function spawn(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.2 + Math.random() * 0.8) * (power || 120);
      particles.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.45 + Math.random() * 0.5, max: 0.95,
        color: color, size: 2 + Math.random() * 4,
      });
    }
  }

  /** 飘字 */
  function floatText(x, y, text, color) {
    floats.push({ x: x, y: y, text: text, color: color, life: 1.2 });
  }

  /** 屏幕坐标 → 设计坐标 */
  function toDesign(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  /** 点是否在矩形内 */
  function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

  /** 格子矩形 */
  function cellRect(x, y) {
    return { x: GRID.x + x * (GRID.cw + GRID.gx), y: GRID.y + y * (GRID.ch + GRID.gy), w: GRID.cw, h: GRID.ch };
  }

  /** 格子中心 */
  function cellCenter(x, y) {
    const r = cellRect(x, y);
    return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
  }

  /** 鼠标位置对应的格子 */
  function cellFromPoint(p) {
    for (let y = 0; y < C.rows; y++) {
      for (let x = 0; x < C.cols; x++) {
        if (inRect(p, cellRect(x, y))) return { x: x, y: y };
      }
    }
    return null;
  }

  // ===== 绘制工具 =====
  /** 圆角矩形路径 */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /** 按钮 */
  function button(r, label, sub, color, active) {
    ctx.save();
    roundRect(r.x, r.y, r.w, r.h, 8);
    const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, active ? color : '#1a1e1a');
    g.addColorStop(1, active ? '#0d120f' : '#0b0d0b');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = active ? color : 'rgba(190,210,190,.22)';
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = active ? PAL.text : '#62685f';
    ctx.font = 'bold 17px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, r.x + r.w / 2, r.y + (sub ? r.h / 2 - 8 : r.h / 2));
    if (sub) {
      ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = active ? 'rgba(220,230,215,.68)' : '#4e554c';
      ctx.fillText(sub, r.x + r.w / 2, r.y + r.h / 2 + 12);
    }
    ctx.restore();
  }

  /** 条形进度 */
  function bar(x, y, w, h, ratio, color, back) {
    ctx.save();
    roundRect(x, y, w, h, h / 2); ctx.fillStyle = back || 'rgba(255,255,255,.07)'; ctx.fill();
    roundRect(x, y, Math.max(0, w * Math.min(1, Math.max(0, ratio))), h, h / 2); ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }

  // ===== 背景 =====
  function drawBackground() {
    const g = ctx.createRadialGradient(460, 360, 60, 460, 380, 700);
    g.addColorStop(0, '#121a15');
    g.addColorStop(0.6, '#0a0e0b');
    g.addColorStop(1, '#040504');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 潮气灰尘
    for (let i = 0; i < 40; i++) {
      const x = (i * 163.7 + time * 6 * (1 + i % 3)) % 870;
      const y = 110 + ((i * 97.1 + time * (4 + i % 4)) % 540);
      ctx.fillStyle = 'rgba(160,200,180,' + (0.03 + 0.05 * Math.abs(Math.sin(time + i))).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ===== 地图 =====
  function drawMap() {
    // 1) 先画走廊：相邻存活房间之间
    ctx.lineCap = 'round';
    for (let y = 0; y < C.rows; y++) {
      for (let x = 0; x < C.cols; x++) {
        const c = Core.cellAt(run.cells, x, y);
        if (!c || !c.alive) continue;
        const a = cellCenter(x, y);
        const right = Core.cellAt(run.cells, x + 1, y);
        const down = Core.cellAt(run.cells, x, y + 1);
        if (right && right.alive) {
          const b = cellCenter(x + 1, y);
          ctx.strokeStyle = 'rgba(140,170,150,.20)'; ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          ctx.strokeStyle = 'rgba(190,215,195,.10)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        if (down && down.alive) {
          const b = cellCenter(x, y + 1);
          ctx.strokeStyle = 'rgba(140,170,150,.20)'; ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          ctx.strokeStyle = 'rgba(190,215,195,.10)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }

    // 2) 再画房间/空洞
    for (let y = 0; y < C.rows; y++) {
      for (let x = 0; x < C.cols; x++) {
        const c = Core.cellAt(run.cells, x, y);
        if (!c) continue;
        const r = cellRect(x, y);
        if (!c.alive) {
          // 被吃掉的房间：真正的黑洞 + 裂缝
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,.72)';
          roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
          ctx.strokeStyle = 'rgba(90,70,60,.35)'; ctx.lineWidth = 1; ctx.stroke();
          ctx.strokeStyle = 'rgba(150,90,60,.35)'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(r.x + 12, r.y + r.h / 2); ctx.lineTo(r.x + r.w / 2, r.y + 16);
          ctx.lineTo(r.x + r.w - 14, r.y + r.h / 2); ctx.lineTo(r.x + r.w / 2, r.y + r.h - 14);
          ctx.closePath(); ctx.stroke();
          ctx.restore();
          continue;
        }
        const t = Core.TYPES[c.type];
        const hov = hoverCell && hoverCell.x === x && hoverCell.y === y;
        const adj = Core.isAdjacent(run, x, y);
        const canAct = adj && !run.over && c.type !== 'boss' || (adj && mode === 'move');
        ctx.save();
        roundRect(r.x, r.y, r.w, r.h, 8);
        const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
        g.addColorStop(0, t.color);
        g.addColorStop(1, '#0d0f0c');
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = hov && adj ? (mode === 'consume' ? '#ff9a62' : PAL.teal) : 'rgba(200,215,200,.18)';
        ctx.lineWidth = hov && adj ? 2.5 : 1.2;
        ctx.stroke();

        // 图标
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,.13)';
        ctx.font = '34px "Microsoft YaHei"';
        ctx.fillText(t.icon, r.x + r.w / 2, r.y + 34);
        // 房名
        ctx.fillStyle = c.type === 'boss' ? '#ffb0a0' : PAL.text;
        ctx.font = 'bold 13px "Microsoft YaHei"';
        ctx.fillText(t.name, r.x + r.w / 2, r.y + 62);
        // 收益
        if (c.type !== 'boss' && c.type !== 'start') {
          ctx.fillStyle = PAL.ember; ctx.font = 'bold 13px "Microsoft YaHei"';
          ctx.fillText('+' + t.yield + ' 地脉', r.x + r.w / 2, r.y + 80);
        }
        if (c.type === 'spring' && !c.used) {
          ctx.fillStyle = PAL.teal; ctx.font = '11px "Microsoft YaHei"';
          ctx.fillText('首次进入 +' + t.heal + ' 步', r.x + r.w / 2, r.y + 96);
        }
        if (c.type === 'altar') {
          ctx.fillStyle = '#c9a0e0'; ctx.font = '11px "Microsoft YaHei"';
          ctx.fillText('吞噬额外 −1 步', r.x + r.w / 2, r.y + 96);
        }

        // 祭主：发光的眼
        if (c.type === 'boss') {
          const pulse = 10 + Math.sin(time * 2.5) * 2.5;
          const eg = ctx.createRadialGradient(r.x + r.w / 2, r.y + 36, 2, r.x + r.w / 2, r.y + 36, 30);
          eg.addColorStop(0, '#ffd0b0'); eg.addColorStop(0.4, '#e04a30'); eg.addColorStop(1, 'rgba(120,10,0,0)');
          ctx.fillStyle = eg;
          ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + 36, pulse + 14, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#2a0604';
          ctx.beginPath(); ctx.ellipse(r.x + r.w / 2, r.y + 36, 16, 8, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ff8a60';
          ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + 36, 5, 0, Math.PI * 2); ctx.fill();
        }

        // 相邻可操作提示
        if (hov && adj) {
          ctx.fillStyle = mode === 'consume' ? 'rgba(255,140,80,.95)' : 'rgba(120,220,190,.95)';
          ctx.font = 'bold 12px "Microsoft YaHei"';
          if (mode === 'consume' && c.type !== 'boss') {
            ctx.fillText('吞噬 −' + (1 + t.extraCost) + ' 步', r.x + r.w / 2, r.y + r.h - 10);
          } else {
            ctx.fillText('点击移动 −1 步', r.x + r.w / 2, r.y + r.h - 10);
          }
        }
        ctx.restore();
      }
    }

    // 3) 玩家：余烬核心
    const pc = cellCenter(run.player.x, run.player.y);
    const pr = 13 + Math.sin(time * 3.2) * 1.6;
    const pg = ctx.createRadialGradient(pc.x, pc.y, 2, pc.x, pc.y, 34);
    pg.addColorStop(0, '#fff2c0'); pg.addColorStop(0.35, '#ffb050'); pg.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(pc.x, pc.y, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff0c0';
    ctx.beginPath(); ctx.arc(pc.x, pc.y, pr * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,110,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pc.x, pc.y, pr, 0, Math.PI * 2); ctx.stroke();
  }

  // ===== HUD =====
  function drawHUD() {
    // 目标
    ctx.save();

    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();

    bar(900, 150, 330, 10, run.steps / run.maxSteps, run.steps <= 6 ? PAL.bad : PAL.teal, 'rgba(255,255,255,.07)');

    ctx.font = 'bold 30px "Microsoft YaHei"'; ctx.textAlign = 'right';
    ctx.fillText(run.power + ' / ' + run.armor, 1230, 186);
    ctx.textAlign = 'left';
    bar(900, 202, 330, 10, run.power / run.armor, run.power >= run.armor ? PAL.ok : PAL.ember, 'rgba(255,255,255,.07)');
    ctx.fillStyle = '#6d7468'; ctx.font = '11px "Microsoft YaHei"';
    ctx.fillText('已吞噬 ' + run.consumed + ' 间房 · 行动 ' + run.actions + ' 次', 900, 228);

    button({ x: 900, y: 248, w: 158, h: 54 }, '移动', '点击相邻房间', mode === 'move' ? '#2c4a40' : '#1a1e1a', true);
    button({ x: 1072, y: 248, w: 158, h: 54 }, '吞噬', '点击相邻房间', mode === 'consume' ? '#5a2a18' : '#1a1e1a', true);
    ctx.fillStyle = '#677067'; ctx.font = '11px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('Tab / E 切换模式 · WASD 移动 · R 重开', 1065, 318);

    roundRect(880, 334, 368, 278, 10);
    ctx.fillStyle = 'rgba(0,0,0,.30)'; ctx.fill();
    ctx.strokeStyle = 'rgba(200,215,200,.14)'; ctx.stroke();
    ctx.fillStyle = PAL.teal; ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.fillText('地脉记录', 900, 356);
    ctx.font = '12px "Microsoft YaHei"';
    const logs = run.log.slice(-11);
    let yy = 380;
    for (let i = 0; i < logs.length; i++) {
      const lines = wrapText(logs[i], 330, 2);
      for (let k = 0; k < lines.length; k++) {
        ctx.fillStyle = i === logs.length - 1 ? '#d8e2d4' : '#7d867b';
        ctx.fillText(lines[k], 900, yy);
        yy += 15;
      }
      yy += 3;
    }

    // 底部按钮
    button({ x: 880, y: 628, w: 168, h: 44 }, '跑 200 局自测', '对比三种吃法', '#243328', !showTest);
    button({ x: 1064, y: 628, w: 100, h: 44 }, '重开', '', '#2a241c', true);
    ctx.fillStyle = 'rgba(210,225,205,.35)'; ctx.font = '12px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('地图左侧第一间是入口，右上角是祭主之厅', 470, 716);
  }

  /** 中文换行 */
  function wrapText(text, maxW, maxLines) {
    const out = []; let line = '';
    for (const ch of text) {
      if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
      else line += ch;
    }
    if (line) out.push(line);
    return out.slice(0, maxLines || 2);
  }

  // ===== 自测面板 =====
  function drawTestPanel() {
    ctx.fillStyle = 'rgba(0,0,0,.88)'; ctx.fillRect(0, 0, W, H);
    const px = 240, py = 150, pw = 800, ph = 470;
    roundRect(px, py, pw, ph, 12);
    ctx.fillStyle = '#0e130f'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,180,.4)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = PAL.teal; ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.fillText('可量化自测 · 每种吃法 200 局', px + 32, py + 40);
    ctx.fillStyle = PAL.dim; ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText('三种策略使用同一套寻路与移动规则，只改变“吃不吃、吃多少”，胜率差可归因于地图消耗决策。', px + 32, py + 74);

    if (!test) {
      ctx.fillStyle = PAL.text; ctx.font = '16px "Microsoft YaHei"';
      ctx.fillText('正在跑……', px + 32, py + 130);
    } else {
      const colX = [px + 32, px + 250, px + 400, px + 520, px + 640];
      ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.fillStyle = PAL.dim;
      ctx.fillText('策略', colX[0], py + 112);
      ctx.fillText('胜率', colX[1], py + 112);
      ctx.fillText('剩余步数', colX[2], py + 112);
      ctx.fillText('吞噬 / 地脉', colX[3], py + 112);
      ctx.fillText('主要死因', colX[4], py + 112);
      for (let i = 0; i < test.length; i++) {
        const r = test[i];
        const y = py + 156 + i * 76;
        ctx.fillStyle = 'rgba(255,255,255,.04)'; roundRect(px + 24, y - 26, pw - 48, 62, 8); ctx.fill();
        ctx.fillStyle = i === 2 ? PAL.teal : PAL.text; ctx.font = 'bold 17px "Microsoft YaHei"';
        ctx.fillText(r.name, colX[0], y);
        ctx.fillStyle = PAL.dim; ctx.font = '11px "Microsoft YaHei"';
        ctx.fillText(r.desc, colX[0], y + 19);
        ctx.fillStyle = r.winRate >= 0.5 ? PAL.ok : (r.winRate >= 0.2 ? PAL.ember : PAL.bad);
        ctx.font = 'bold 26px "Microsoft YaHei"';
        ctx.fillText((r.winRate * 100).toFixed(1) + '%', colX[1], y);
        ctx.fillStyle = PAL.text; ctx.font = '16px "Microsoft YaHei"';
        ctx.fillText(r.avgSteps.toFixed(1), colX[2], y);
        ctx.fillText(r.avgConsumed.toFixed(1) + ' / ' + r.avgPower.toFixed(1), colX[3], y);
        ctx.fillStyle = PAL.dim; ctx.font = '11px "Microsoft YaHei"';
        const mainLoss = r.losePath >= r.loseSteps ? '路断 ' + r.losePath : '步尽 ' + r.loseSteps;
        ctx.fillText(mainLoss + ' 局', colX[4], y);
      }
      const best = test.slice().sort(function (a, b) { return b.winRate - a.winRate; })[0];
      const worst = test.slice().sort(function (a, b) { return a.winRate - b.winRate; })[0];
      const gap = (best.winRate - worst.winRate) * 100;
      ctx.fillStyle = gap >= 20 ? PAL.ok : PAL.bad;
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText('判定：最佳「' + best.name + '」' + (best.winRate * 100).toFixed(1) + '% vs 最差「' + worst.name + '」' + (worst.winRate * 100).toFixed(1) + '% ，差距 ' + gap.toFixed(1) + ' 个百分点 → ' + (gap >= 20 ? '地图消耗决策确实改变结果' : '差距不足，需要调参'), px + 32, py + 402);
      ctx.fillStyle = PAL.dim; ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText('“见房就吃”会把步数吃光；“只赶路”则护甲根本破不了。算清路线再吃才稳定。', px + 32, py + 430);
    }
    button({ x: px + pw - 150, y: py + ph - 58, w: 118, h: 38 }, '关闭', '', '#233028', true);
  }

  // ===== 结束覆盖层 =====
  function drawOver() {
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, W, H);
    const px = 350, py = 230, pw = 580, ph = 280;
    roundRect(px, py, pw, ph, 12);
    ctx.fillStyle = '#0d120e'; ctx.fill();
    ctx.strokeStyle = run.result === 'win' ? 'rgba(140,210,150,.55)' : 'rgba(220,90,70,.55)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = run.result === 'win' ? PAL.ok : PAL.bad;
    ctx.font = 'bold 36px "Microsoft YaHei"';
    ctx.fillText(run.result === 'win' ? '祭主之厅崩塌' : '地脉断流', px + pw / 2, py + 70);
    ctx.fillStyle = PAL.text; ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText(run.reason, px + pw / 2, py + 112);
    ctx.fillStyle = PAL.dim; ctx.font = '14px "Microsoft YaHei"';
    ctx.fillText('地脉 ' + run.power + ' / ' + run.armor + ' · 吞噬 ' + run.consumed + ' 间房 · 剩 ' + Math.max(0, run.steps) + ' 步', px + pw / 2, py + 148);
    button({ x: px + 100, y: py + 196, w: 160, h: 46 }, '再来一局', '', '#2a342c', true);
    button({ x: px + 320, y: py + 196, w: 160, h: 46 }, '跑自测', '', '#243328', true);
  }

  // ===== 主循环 =====
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; time += dt;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.vx *= 0.98;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.life -= dt; f.y -= 30 * dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 3);

    ctx.save();
    if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
    drawBackground();
    drawMap();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, f.life / 1.2);
      ctx.fillStyle = f.color; ctx.font = 'bold 24px "Microsoft YaHei"';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHUD();
    if (showTest) drawTestPanel();
    else if (run.over) drawOver();

    requestAnimationFrame(frame);
  }

  // ===== 动作 =====
  /** 执行移动并播放反馈 */
  function actMove(x, y) {
    const before = { x: run.player.x, y: run.player.y };
    if (Core.moveTo(run, x, y)) {
      sfx('move');
      const c = cellCenter(x, y);
      spawn(c.x, c.y, '#9fd8c8', 8, 80);
      if (run.result === 'win') { sfx('win'); shake = 1; spawn(c.x, c.y, '#ffe0a0', 50, 300); }
      if (run.result === 'lose' && run.reason === '护甲未破') { sfx('lose'); shake = 0.7; spawn(c.x, c.y, '#c04030', 30, 220); }
    }
  }

  /** 执行吞噬并播放反馈 */
  function actConsume(x, y) {
    const c = cellCenter(x, y);
    const cell = Core.cellAt(run.cells, x, y);
    if (!cell) return;
    const t = Core.TYPES[cell.type];
    if (Core.consume(run, x, y)) {
      sfx('eat');
      spawn(c.x, c.y, '#e8a04a', 30, 220);
      spawn(c.x, c.y, '#5a3a28', 20, 140);
      floatText(c.x, c.y - 20, '+' + t.yield + ' 地脉', '#ffc46b');
      floatText(1150, 186, '-' + (1 + t.extraCost) + ' 步', '#d05545');
      shake = Math.min(1, shake + 0.45);
      if (run.over && run.reason === '路被吃断') { sfx('lose'); shake = 1; }
    }
  }

  /** 重开 */
  function reset() {
    run = Core.createRun((Math.random() * 1e9) | 0);
    mode = 'move'; particles = []; floats = []; shake = 0;
    showTest = false; test = null; hoverCell = null;
  }

  /** 跑自测 */
  function doTest() {
    showTest = true;
    test = Core.runBatch(200);
    window.__lastTest = test;
    sfx('move');
  }

  // ===== 事件 =====
  cv.addEventListener('mousemove', function (e) {
    mouse = toDesign(e);
    hoverCell = cellFromPoint(mouse);
    cv.style.cursor = hoverCell ? 'pointer' : 'default';
  });

  cv.addEventListener('mousedown', function (e) {
    const p = toDesign(e);
    if (showTest) {
      if (inRect(p, { x: 240 + 800 - 150, y: 150 + 470 - 58, w: 118, h: 38 })) showTest = false;
      return;
    }
    if (run.over) {
      if (inRect(p, { x: 450, y: 426, w: 160, h: 46 })) reset();
      else if (inRect(p, { x: 670, y: 426, w: 160, h: 46 })) doTest();
      return;
    }
    if (inRect(p, { x: 900, y: 248, w: 158, h: 54 })) { mode = 'move'; return; }
    if (inRect(p, { x: 1072, y: 248, w: 158, h: 54 })) { mode = 'consume'; return; }
    if (inRect(p, { x: 880, y: 628, w: 168, h: 44 })) { doTest(); return; }
    if (inRect(p, { x: 1064, y: 628, w: 100, h: 44 })) { reset(); return; }

    const c = cellFromPoint(p);
    if (!c || !Core.isAdjacent(run, c.x, c.y)) return;
    if (mode === 'move') actMove(c.x, c.y);
    else actConsume(c.x, c.y);
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); mode = mode === 'move' ? 'consume' : 'move'; return; }
    if (e.key === 'e' || e.key === 'E') { mode = mode === 'move' ? 'consume' : 'move'; return; }
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    if (e.key === 't' || e.key === 'T') { doTest(); return; }
    if (showTest) { if (e.key === 'Escape') showTest = false; return; }
    if (run.over) return;
    const dir = { w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key.toLowerCase()];
    if (dir) {
      const nx = run.player.x + dir[0], ny = run.player.y + dir[1];
      if (mode === 'move') actMove(nx, ny);
      else actConsume(nx, ny);
    }
  });

  requestAnimationFrame(frame);
})();
</script>
