<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型1 · 焚材 — 烧牌换爆发</title>
<style>
  html,body{margin:0;padding:0;background:#080605;overflow:hidden;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;max-width:100vw;max-height:100vh;box-shadow:0 0 60px #000 inset;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="760"></canvas></div>

<!-- ================= 纯逻辑核心：不碰 DOM，可被 Node 直接提取跑自测 ================= -->
<script id="core">
const Core = (function () {
  'use strict';

  // ===== 可调参数区：改这里就能调平衡 =====
  const CFG = {
    playerHP: 150,          // 玩家生命（同时是灯油倒计时）
    enemyHP: 470,           // 熔炉像生命
    handSize: 5,            // 每回合抽牌数
    playsPerTurn: 3,        // 每回合最多打出几张
    burnsPerTurn: 3,        // 每回合最多焚毁几张（炉口有限）
    burstMinFuel: 30,       // 低于这个燃料不能熔爆
    burstRate: 3,           // 每点燃料换多少伤害
    burnHpRate: 0.5,        // 焚毁自损 = ceil(燃料 × 该系数 × 炉温)
    heatGrow: 0.12,         // 炉温：每烧一张，下一张自损提高 12%
    enemyAtkBase: 4,        // 敌人第 1 回合伤害
    enemyAtkGrow: 1.15,     // 敌人每回合伤害增长
    maxTurns: 40,
    turnDrain: 2,           // 灯油时钟：每回合生命自然烧掉的量（生命 = 倒计时）
    cardTypes: [
      { id: 'spark', name: '火种', dmg: 10, fuel: 4, count: 8, color: '#8f3a1c' },
      { id: 'coal',  name: '炭块', dmg: 6,  fuel: 9, count: 8, color: '#4a3a28' },
      { id: 'ash',   name: '灰烬', dmg: 2,  fuel: 16, count: 8, color: '#4a4744' },
    ],
  };

  // 三种自测策略：只改变「烧不烧、烧几张」，出牌逻辑完全一致，保证对比公平
  const POLICIES = [
    { id: 'aggressive',   name: '激进焚炉', desc: '每回合烧满 3 张，有燃料就爆' },
    { id: 'conservative', name: '保守蓄牌', desc: '一张不烧，只靠打牌' },
    { id: 'rhythm',       name: '节奏焚炉', desc: '先打高伤牌，血高于 60 才烧，留 45 血底（灯油会自燃，囤积拖不起）' },
  ];

  /** 32 位可复现随机数生成器，保证每次自测结果一致 */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** 原地洗牌 */
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /** 一张牌被焚毁要自损多少生命（烧得越多炉温越高，越来越痛） */
  function burnCost(card, burnedCount) {
    const heat = 1 + (burnedCount || 0) * CFG.heatGrow;
    return Math.ceil(card.fuel * CFG.burnHpRate * heat);
  }

  /** 当前还能用的牌总数（抽牌堆 + 手牌 + 弃牌堆） */
  function totalCards(s) {
    return s.draw.length + s.hand.length + s.discard.length;
  }

  /** 记录一条战斗日志 */
  function log(s, text) {
    s.log.push(text);
    if (s.log.length > 30) s.log.shift();
  }

  /** 抽牌：抽牌堆空了就把弃牌堆洗回来 */
  function drawCards(s, n) {
    for (let i = 0; i < n; i++) {
      if (!s.draw.length) {
        if (!s.discard.length) break;
        s.draw = shuffle(s.discard, s.rng);
        s.discard = [];
      }
      s.hand.push(s.draw.pop());
    }
  }

  /** 开局：洗牌、抽初始手牌、重置所有计数 */
  function createRun(seed) {
    const rng = mulberry32((seed >>> 0) || 1);
    const draw = [];
    let uid = 0;
    CFG.cardTypes.forEach(function (t) {
      for (let i = 0; i < t.count; i++) {
        draw.push({ uid: ++uid, id: t.id, name: t.name, dmg: t.dmg, fuel: t.fuel, color: t.color });
      }
    });
    shuffle(draw, rng);
    const s = {
      seed: (seed >>> 0) || 1, rng: rng,
      draw: draw, hand: [], discard: [], burned: [],
      hp: CFG.playerHP, maxHp: CFG.playerHP,
      enemyHp: CFG.enemyHP, maxEnemyHp: CFG.enemyHP,
      fuel: 0, turn: 1,
      playsLeft: CFG.playsPerTurn, burnsLeft: CFG.burnsPerTurn,
      over: false, result: '', reason: '',
      log: [], lastEnemyAtk: 0,
      played: 0, burnedCount: 0, burstCount: 0, burstDamage: 0,
    };
    drawCards(s, CFG.handSize);
    log(s, '熔炉像苏醒：烧掉你的牌，换一次爆发。');
    return s;
  }

  /** 结束判定：敌人死 / 玩家死 / 牌烧光 */
  function checkOver(s) {
    if (s.over) return true;
    if (s.enemyHp <= 0) {
      s.over = true; s.result = 'win'; s.reason = '熔炉像崩解';
      log(s, '熔炉像崩解。你用整副牌换来了这一击。');
      return true;
    }
    if (s.hp <= 0) {
      s.over = true; s.result = 'lose'; s.reason = '生命烧尽';
      log(s, '生命烧尽。炉火吞下了你。');
      return true;
    }
    return false;
  }

  /** 打出一张手牌：造成卡面伤害，牌进入弃牌堆 */
  function playCard(s, idx) {
    if (s.over || s.playsLeft <= 0) return false;
    if (idx < 0 || idx >= s.hand.length) return false;
    const c = s.hand.splice(idx, 1)[0];
    s.playsLeft--;
    s.enemyHp -= c.dmg;
    s.played++;
    s.discard.push(c);
    log(s, '打出「' + c.name + '」，造成 ' + c.dmg + ' 伤害。');
    checkOver(s);
    return true;
  }

  /** 焚毁一张手牌：永久移出本局，获得燃料，但自损生命 */
  function burnCard(s, idx) {
    if (s.over || s.burnsLeft <= 0) return false;
    if (idx < 0 || idx >= s.hand.length) return false;
    const c = s.hand[idx];
    const cost = burnCost(c, s.burnedCount);
    if (s.hp <= cost) return false; // 不允许直接把自己烧死
    s.hand.splice(idx, 1);
    s.burnsLeft--;
    s.fuel += c.fuel;
    s.hp -= cost;
    s.burned.push(c);
    s.burnedCount++;
    log(s, '焚毁「' + c.name + '」：+' + c.fuel + ' 燃料，自损 ' + cost + ' 生命。这张牌本局不再回来。');
    checkOver(s);
    return true;
  }

  /** 熔爆：把全部燃料一次性转成伤害，燃料清零 */
  function burst(s) {
    if (s.over || s.fuel < CFG.burstMinFuel) return false;
    const dmg = Math.round(s.fuel * CFG.burstRate);
    const used = s.fuel;
    s.fuel = 0;
    s.enemyHp -= dmg;
    s.burstCount++;
    s.burstDamage += dmg;
    log(s, '熔爆：' + used + ' 燃料 → ' + dmg + ' 伤害。');
    checkOver(s);
    return true;
  }

  /** 结束回合：弃掉手牌，敌人攻击，抽新牌 */
  function endTurn(s) {
    if (s.over) return;
    for (let i = 0; i < s.hand.length; i++) s.discard.push(s.hand[i]);
    s.hand.length = 0;

    const atk = Math.round(CFG.enemyAtkBase + CFG.enemyAtkGrow * (s.turn - 1));
    s.hp -= atk;
    s.hp -= CFG.turnDrain;   // 灯油时钟：不管你在做什么，这盏灯都在烧
    s.lastEnemyAtk = atk;
    log(s, '熔炉像撞击：' + atk + ' 伤害；灯油自燃：' + CFG.turnDrain + ' 点。');
    s.turn++;
    s.playsLeft = CFG.playsPerTurn;
    s.burnsLeft = CFG.burnsPerTurn;

    if (checkOver(s)) return;
    if (totalCards(s) === 0) {
      s.over = true; s.result = 'lose'; s.reason = '牌库烧尽';
      log(s, '牌库烧尽。没有东西可以再烧了。');
      return;
    }
    drawCards(s, CFG.handSize);
  }

  /** 从手牌里按某个属性挑一张（topN > 1 时在最好的几张里随机） */
  function pickBest(s, key, filter, topN) {
    const cand = [];
    for (let i = 0; i < s.hand.length; i++) {
      if (filter && !filter(s.hand[i])) continue;
      cand.push({ i: i, c: s.hand[i] });
    }
    if (!cand.length) return -1;
    cand.sort(function (a, b) {
      return (b.c[key] - a.c[key]) || (a.i - b.i);
    });
    const n = Math.min(topN || 1, cand.length);
    return cand[Math.floor(s.rng() * n)].i;
  }

  /** 策略执行一整个回合（自测和演示共用同一套规则） */
  function policyTurn(s, policyId) {
    if (s.over) return;

    if (policyId === 'conservative') {
      for (let k = 0; k < CFG.playsPerTurn; k++) {
        const i = pickBest(s, 'dmg', null, 1);
        if (i < 0) break;
        playCard(s, i);
        if (s.over) return;
      }
      return;
    }

    if (policyId === 'aggressive') {
      for (let k = 0; k < CFG.burnsPerTurn; k++) {
        const i = pickBest(s, 'fuel', null, 1);
        if (i < 0) break;
        if (s.hp <= burnCost(s.hand[i], s.burnedCount) + 1) break;
        burnCard(s, i);
        if (s.over) return;
      }
      if (s.fuel >= CFG.burstMinFuel) { burst(s); if (s.over) return; }
      for (let k = 0; k < CFG.playsPerTurn; k++) {
        const i = pickBest(s, 'dmg', null, 1);
        if (i < 0) break;
        playCard(s, i);
        if (s.over) return;
      }
      if (s.fuel >= CFG.burstMinFuel) burst(s);
      return;
    }

    // rhythm：先打高伤害牌，再只烧高燃料牌，血量低就停手
    for (let k = 0; k < CFG.playsPerTurn; k++) {
      const i = pickBest(s, 'dmg', null, 1);
      if (i < 0) break;
      playCard(s, i);
      if (s.over) return;
    }
    if (s.hp > 60) {
      for (let k = 0; k < CFG.burnsPerTurn; k++) {
        const i = pickBest(s, 'fuel', function (c) { return c.id !== 'spark' || s.hp > 100; }, 1);
        if (i < 0) break;
        if (s.hp - burnCost(s.hand[i], s.burnedCount) < 45) break;
        burnCard(s, i);
        if (s.over) return;
      }
    }
    // 燃料够就爆：熔爆伤害是线性的，早爆能更早结束战斗、少吃敌人攻击
    if (s.fuel >= CFG.burstMinFuel) burst(s);
  }

  /** 跑一局指定策略，返回结果摘要 */
  function autoRun(policyId, seed) {
    const s = createRun(seed);
    while (!s.over && s.turn <= CFG.maxTurns) {
      policyTurn(s, policyId);
      if (s.over) break;
      endTurn(s);
    }
    if (!s.over) { s.over = true; s.result = 'lose'; s.reason = '超时'; }
    return {
      win: s.result === 'win',
      turns: s.turn,
      hp: s.hp,
      reason: s.reason,
      burned: s.burnedCount,
      played: s.played,
      bursts: s.burstCount,
    };
  }

  /** 自测入口：每个策略跑 games 局，返回胜率等可量化指标 */
  function runBatch(games) {
    const n = games || 200;
    return POLICIES.map(function (p) {
      const r = {
        id: p.id, name: p.name, desc: p.desc, games: n,
        wins: 0, winRate: 0, avgTurns: 0, avgBurned: 0, avgBursts: 0,
        loseHp: 0, loseDeck: 0,
      };
      let turns = 0, burned = 0, bursts = 0;
      for (let i = 1; i <= n; i++) {
        const g = autoRun(p.id, i * 7919 + 13);
        if (g.win) r.wins++;
        else if (g.reason === '牌库烧尽') r.loseDeck++;
        else r.loseHp++;
        turns += g.turns; burned += g.burned; bursts += g.bursts;
      }
      r.winRate = r.wins / n;
      r.avgTurns = turns / n;
      r.avgBurned = burned / n;
      r.avgBursts = bursts / n;
      return r;
    });
  }

  return {
    CFG: CFG, POLICIES: POLICIES,
    createRun: createRun, playCard: playCard, burnCard: burnCard,
    burst: burst, endTurn: endTurn, burnCost: burnCost,
    totalCards: totalCards, runBatch: runBatch, autoRun: autoRun,
  };
})();
</script>

<!-- ================= 画面与交互 ================= -->
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 1280, H = 760;

  // ===== 画面配色（余烬 / 炉渣） =====
  const PAL = {
    bg0: '#0a0706', bg1: '#181009', bg2: '#2a160c',
    ember: '#ff7a2f', ember2: '#ffc46b', deep: '#7d2610',
    ash: '#8f857c', text: '#f3e7d8', dim: '#9a8778',
    line: 'rgba(255,160,90,.18)', bad: '#e05a4a', ok: '#8fd08f',
  };

  // ===== 界面布局常量（改这里挪位置） =====
  const LAY = {
    handY: 520, cardW: 190, cardH: 170, cardGap: 12, handX: 24,
    hpBar: { x: 24, y: 118, w: 360, h: 22 },
    fuelBar: { x: 24, y: 214, w: 360, h: 18 },
    burstBtn: { x: 24, y: 252, w: 200, h: 58 },
    endBtn: { x: 238, y: 252, w: 146, h: 58 },
    testBtn: { x: 24, y: 326, w: 168, h: 42 },
    resetBtn: { x: 204, y: 326, w: 120, h: 42 },
    enemy: { x: 900, y: 205, r: 96 },
    enemyBar: { x: 560, y: 334, w: 680, h: 22 },
  };

  // ===== 运行时状态 =====
  let run = Core.createRun((Math.random() * 1e9) | 0);
  let test = null;          // 自测结果
  let showTest = false;     // 自测面板是否打开
  let particles = [];
  let floats = [];
  let shake = 0;
  let time = 0;
  let last = performance.now();
  let mouse = { x: -999, y: -999 };
  let hoverCard = -1;
  let hoverZone = '';

  // ===== 极简音效（WebAudio，无外部文件） =====
  let AC = null;
  /** 播放一个短促的合成音效 */
  function sfx(type) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const now = AC.currentTime;
      const o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      if (type === 'play') { o.type = 'triangle'; o.frequency.setValueAtTime(320, now); o.frequency.exponentialRampToValueAtTime(180, now + 0.08); g.gain.setValueAtTime(0.06, now); }
      else if (type === 'burn') { o.type = 'sawtooth'; o.frequency.setValueAtTime(140, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.18); g.gain.setValueAtTime(0.07, now); }
      else if (type === 'burst') { o.type = 'square'; o.frequency.setValueAtTime(90, now); o.frequency.exponentialRampToValueAtTime(420, now + 0.12); g.gain.setValueAtTime(0.09, now); }
      else { o.type = 'sine'; o.frequency.setValueAtTime(220, now); g.gain.setValueAtTime(0.05, now); }
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      o.start(now); o.stop(now + 0.26);
    } catch (e) { /* 无声也能玩 */ }
  }

  /** 生成一簇粒子 */
  function spawn(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.3 + Math.random() * 0.7) * (power || 160);
      particles.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
        life: 0.5 + Math.random() * 0.6, max: 1.1,
        color: color, size: 2 + Math.random() * 4,
      });
    }
  }

  /** 飘字 */
  function floatText(x, y, text, color) {
    floats.push({ x: x, y: y, text: text, color: color, life: 1.1 });
  }

  /** 把屏幕坐标换算成 1280×760 的设计坐标 */
  function toDesign(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  /** 判断点是否在矩形内 */
  function inRect(p, r) {
    return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  }

  /** 手牌第 i 张的矩形 */
  function cardRect(i) {
    return { x: LAY.handX + i * (LAY.cardW + LAY.cardGap), y: LAY.handY, w: LAY.cardW, h: LAY.cardH };
  }

  /** 点击手牌时判断是上半（打出）还是下半（焚毁） */
  function cardZone(i, p) {
    const r = cardRect(i);
    if (p.y < r.y + 108) return 'play';
    return 'burn';
  }

  // ===== 绘制工具 =====
  /** 圆角矩形路径 */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /** 带文字的按钮 */
  function button(r, label, sub, color, active) {
    ctx.save();
    roundRect(r.x, r.y, r.w, r.h, 8);
    const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, active ? color : '#2a1b12');
    g.addColorStop(1, active ? '#1d0f08' : '#150d08');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = active ? color : 'rgba(255,150,90,.25)';
    ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = active ? PAL.text : '#6b5a4d';
    ctx.font = 'bold 18px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, r.x + r.w / 2, r.y + (sub ? r.h / 2 - 8 : r.h / 2));
    if (sub) {
      ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = active ? 'rgba(255,230,200,.75)' : '#5a4b40';
      ctx.fillText(sub, r.x + r.w / 2, r.y + r.h / 2 + 12);
    }
    ctx.restore();
  }

  /** 画血条 / 燃料条 */
  function bar(x, y, w, h, ratio, color, back) {
    ctx.save();
    roundRect(x, y, w, h, h / 2);
    ctx.fillStyle = back || 'rgba(255,255,255,.08)'; ctx.fill();
    roundRect(x, y, Math.max(0, w * Math.max(0, Math.min(1, ratio))), h, h / 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }

  // ===== 背景 =====
  function drawBackground() {
    const g = ctx.createRadialGradient(W * 0.55, H * 0.36, 40, W * 0.55, H * 0.4, 760);
    g.addColorStop(0, PAL.bg2);
    g.addColorStop(0.55, PAL.bg1);
    g.addColorStop(1, PAL.bg0);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 缓慢上升的余烬
    for (let i = 0; i < 46; i++) {
      const seed = i * 97.13;
      const x = (seed * 37 + time * (9 + (i % 5) * 3)) % W;
      const y = H - ((time * (18 + (i % 7) * 6) + seed * 11) % (H + 100));
      const a = 0.08 + 0.16 * Math.abs(Math.sin(time * 0.7 + i));
      ctx.fillStyle = 'rgba(255,140,60,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2); ctx.fill();
    }

    // 地面线
    ctx.strokeStyle = 'rgba(255,120,50,.12)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 486); ctx.lineTo(W, 486); ctx.stroke();
  }

  // ===== 敌人：熔炉像 =====
  function drawEnemy() {
    const e = LAY.enemy;
    const pulse = 1 + Math.sin(time * 2.2) * 0.03;
    ctx.save();
    ctx.translate(e.x, e.y);

    // 背后热浪
    const rg = ctx.createRadialGradient(0, 0, 20, 0, 0, 220);
    rg.addColorStop(0, 'rgba(255,110,40,.30)');
    rg.addColorStop(1, 'rgba(255,80,30,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 220, 0, Math.PI * 2); ctx.fill();

    // 炉体
    ctx.save(); ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.moveTo(-92, 70); ctx.lineTo(-78, -30); ctx.lineTo(-46, -86);
    ctx.lineTo(46, -86); ctx.lineTo(78, -30); ctx.lineTo(92, 70);
    ctx.closePath();
    const bg = ctx.createLinearGradient(0, -90, 0, 80);
    bg.addColorStop(0, '#3a2419'); bg.addColorStop(0.6, '#20130d'); bg.addColorStop(1, '#0e0806');
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,70,.45)'; ctx.lineWidth = 2; ctx.stroke();

    // 裂纹
    ctx.strokeStyle = 'rgba(255,120,50,' + (0.35 + 0.2 * Math.sin(time * 3)).toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-70, 50); ctx.lineTo(-44, 12); ctx.lineTo(-58, -24); ctx.lineTo(-30, -58);
    ctx.moveTo(70, 40); ctx.lineTo(42, 6); ctx.lineTo(56, -36);
    ctx.stroke();

    // 炉心
    const core = ctx.createRadialGradient(0, 4, 2, 0, 4, 38);
    core.addColorStop(0, '#fff3c4'); core.addColorStop(0.35, PAL.ember2);
    core.addColorStop(0.7, PAL.ember); core.addColorStop(1, 'rgba(160,40,10,0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, 4, 40 + Math.sin(time * 5) * 4, 0, Math.PI * 2); ctx.fill();

    // 双眼
    ctx.fillStyle = '#ffdf9a';
    ctx.beginPath(); ctx.arc(-30, -48, 6, 0, Math.PI * 2); ctx.arc(30, -48, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // ===== 手牌 =====
  function drawCard(c, i) {
    const r = cardRect(i);
    const hov = hoverCard === i;
    const fuelCost = Core.burnCost(c, run.burnedCount);
    const canPlay = run.playsLeft > 0 && !run.over;
    const canBurn = run.burnsLeft > 0 && run.hp > fuelCost && !run.over;
    ctx.save();
    roundRect(r.x, r.y - (hov ? 8 : 0), r.w, r.h, 10);
    const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, c.color);
    g.addColorStop(1, '#140c08');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = hov ? PAL.ember2 : 'rgba(255,180,120,.28)';
    ctx.lineWidth = hov ? 2.5 : 1.2; ctx.stroke();

    // 卡名
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = PAL.text; ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.fillText(c.name, r.x + r.w / 2, r.y + 34 - (hov ? 8 : 0));

    ctx.fillStyle = '#ffb68a'; ctx.fillText(c.dmg, r.x + 58, r.y + 94 - (hov ? 8 : 0));

  /** 简易中文换行 */
  function wrapText(text, maxW) {
    const out = []; let line = '';
    for (const ch of text) {
      if (ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
      else line += ch;
    }
    if (line) out.push(line);
    return out.slice(0, 2);
  }

  // ===== 自测面板 =====
  function drawTestPanel() {
    ctx.fillStyle = 'rgba(0,0,0,.88)'; ctx.fillRect(0, 0, W, H);
    const px = 250, py = 150, pw = 780, ph = 470;
    roundRect(px, py, pw, ph, 12);
    ctx.fillStyle = '#160f0b'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,90,.4)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = PAL.ember2; ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.fillText('可量化自测 · 每种策略 200 局', px + 32, py + 40);
    ctx.fillStyle = PAL.dim; ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText('三种策略使用完全相同的出牌逻辑，只改变“烧牌”决策，因此胜率差可归因于该机制。', px + 32, py + 74);

    if (!test) {
      ctx.fillStyle = PAL.text; ctx.font = '16px "Microsoft YaHei"';
      ctx.fillText('正在跑……', px + 32, py + 130);
    } else {
      const colX = [px + 32, px + 250, px + 430, px + 590];
      ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.fillStyle = PAL.dim;
      ctx.fillText('策略', colX[0], py + 112);
      ctx.fillText('胜率', colX[1], py + 112);
      ctx.fillText('平均回合', colX[2], py + 112);
      ctx.fillText('平均烧牌 / 熔爆', colX[3], py + 112);
      for (let i = 0; i < test.length; i++) {
        const r = test[i];
        const y = py + 154 + i * 72;
        ctx.fillStyle = 'rgba(255,255,255,.04)'; roundRect(px + 24, y - 26, pw - 48, 58, 8); ctx.fill();
        ctx.fillStyle = i === 2 ? PAL.ember2 : PAL.text; ctx.font = 'bold 17px "Microsoft YaHei"';
        ctx.fillText(r.name, colX[0], y);
        ctx.fillStyle = PAL.dim; ctx.font = '12px "Microsoft YaHei"';
        ctx.fillText(r.desc, colX[0], y + 18);
        const pct = (r.winRate * 100).toFixed(1);
        ctx.fillStyle = r.winRate >= 0.5 ? PAL.ok : (r.winRate >= 0.25 ? PAL.ember2 : PAL.bad);
        ctx.font = 'bold 26px "Microsoft YaHei"'; ctx.fillText(pct + '%', colX[1], y);
        ctx.fillStyle = PAL.text; ctx.font = '17px "Microsoft YaHei"';
        ctx.fillText(r.avgTurns.toFixed(1), colX[2], y);
        ctx.fillText(r.avgBurned.toFixed(1) + ' / ' + r.avgBursts.toFixed(1), colX[3], y);
      }
      // 结论
      const best = test.slice().sort(function (a, b) { return b.winRate - a.winRate; })[0];
      const worst = test.slice().sort(function (a, b) { return a.winRate - b.winRate; })[0];
      const gap = (best.winRate - worst.winRate) * 100;
      ctx.fillStyle = gap >= 20 ? PAL.ok : PAL.bad;
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText('判定：最佳「' + best.name + '」' + (best.winRate * 100).toFixed(1) + '% vs 最差「' + worst.name + '」' + (worst.winRate * 100).toFixed(1) + '% ，差距 ' + gap.toFixed(1) + ' 个百分点 → ' + (gap >= 20 ? '决策确实改变结果' : '差距不足，需要调参'), px + 32, py + 398);
      ctx.fillStyle = PAL.dim; ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText('损失构成：激进 死于生命 ' + test[0].loseHp + ' 局 / 牌库烧尽 ' + test[0].loseDeck + ' 局；保守 死于生命 ' + test[1].loseHp + ' 局 / 牌库烧尽 ' + test[1].loseDeck + ' 局', px + 32, py + 426);
    }
    button({ x: px + pw - 150, y: py + ph - 58, w: 118, h: 38 }, '关闭', '', '#33241a', true);
  }

  // ===== 结束覆盖层 =====

    button({ x: px + 120, y: py + 196, w: 160, h: 46 }, '再来一局', '', '#33241a', true);
    button({ x: px + 320, y: py + 196, w: 160, h: 46 }, '跑自测', '', '#243328', true);

  // ===== 主循环 =====
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 220 * dt; p.vx *= 0.985;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt; f.y -= 34 * dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 3);

    ctx.save();
    if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 18, (Math.random() - 0.5) * shake * 18);

    drawBackground();
    drawEnemy();
    drawHUD();

    // 手牌
    for (let i = 0; i < run.hand.length; i++) {
      drawCard(run.hand[i], i);
      if (hoverCard === i) {
        const r = cardRect(i);
        ctx.save();
        ctx.strokeStyle = hoverZone === 'burn' ? 'rgba(255,120,70,.9)' : 'rgba(255,220,150,.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x + 2, hoverZone === 'burn' ? r.y + 136 : r.y, r.w - 4, hoverZone === 'burn' ? r.h - 138 : 134);
        ctx.restore();
      }
    }

    // 粒子 / 飘字
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, f.life / 1.1);
      ctx.fillStyle = f.color; ctx.font = 'bold 26px "Microsoft YaHei"';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 底部操作提示
    ctx.fillStyle = 'rgba(255,235,210,.45)'; ctx.font = '12px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('鼠标：点卡牌上半打出 / 下半焚毁   ·   键盘：1-5 打出，Shift+1-5 焚毁，空格熔爆，回车结束回合，R 重开', W / 2, 742);

    if (showTest) drawTestPanel();
    else if (run.over) drawOver();

    requestAnimationFrame(frame);
  }

  // ===== 处理一次动作并播放反馈 =====
  /** 玩家点卡牌：根据区域执行打出或焚毁 */
  function actCard(i, zone) {
    if (run.over || showTest) return;
    if (zone === 'play') {
      const c = run.hand[i];
      if (!c) return;
      if (Core.playCard(run, i)) {
        sfx('play');
        const dmg = c.dmg;
        spawn(LAY.enemy.x, LAY.enemy.y, '#ffb070', 12, 150);
        floatText(LAY.enemy.x, LAY.enemy.y - 110, '-' + dmg, '#ffcf9a');
        shake = Math.min(1, shake + 0.12);
        logFeedback();
      }
    } else {
      const c = run.hand[i];
      if (!c) return;
      const cost = Core.burnCost(c, run.burnedCount);
      if (Core.burnCard(run, i)) {
        sfx('burn');
        spawn(LAY.enemy.x, LAY.enemy.y - 40, '#ff7a2f', 22, 210);
        floatText(60 + i * 60, LAY.handY - 10, '+' + c.fuel + ' 燃料', '#ffc46b');
        floatText(LAY.hpBar.x + 40, LAY.hpBar.y, '-' + cost, '#e05a4a');
        shake = Math.min(1, shake + 0.25);
        logFeedback();
      }
    }
  }

  /** 处理熔爆按钮 */
  function actBurst() {
    if (run.over || showTest) return;
    const fuel = run.fuel;
    if (Core.burst(run)) {
      sfx('burst');
      spawn(LAY.enemy.x, LAY.enemy.y, '#ffd27a', 60, 360);
      spawn(LAY.enemy.x, LAY.enemy.y, '#ff5a20', 40, 260);
      floatText(LAY.enemy.x, LAY.enemy.y - 130, '熔爆 ' + Math.round(fuel * Core.CFG.burstRate), '#ffe1a6');
      shake = 1;
      logFeedback();
    }
  }

  /** 处理结束回合 */
  function actEnd() {
    if (run.over || showTest) return;
    const beforeHp = run.hp;
    Core.endTurn(run);
    const lost = beforeHp - run.hp;
    if (lost > 0) {
      floatText(LAY.hpBar.x + 90, LAY.hpBar.y + 10, '-' + lost, '#e05a4a');
      spawn(200, 420, '#c04030', 18, 120);
      shake = Math.min(1, shake + 0.3);
      sfx('end');
    }
    logFeedback();
  }

  /** 动作后同步一下测试状态（这里只负责关闭自测） */
  function logFeedback() {
    // 预留：以后可以加录像/回放
  }

  /** 重新开始一局 */
  function reset() {
    run = Core.createRun((Math.random() * 1e9) | 0);
    particles = []; floats = []; shake = 0; showTest = false; test = null;
    hoverCard = -1; hoverZone = '';
  }

  /** 运行自测并展示结果 */
  function doTest() {
    showTest = true;
    test = Core.runBatch(200);
    window.__lastTest = test; // 给外部自动化验收读取
    sfx('end');
  }

  // ===== 事件 =====
  cv.addEventListener('mousemove', function (e) {
    const p = toDesign(e);
    mouse = p;
    hoverCard = -1; hoverZone = '';
    for (let i = run.hand.length - 1; i >= 0; i--) {
      if (inRect(p, cardRect(i))) {
        hoverCard = i;
        hoverZone = cardZone(i, p);
        break;
      }
    }
    cv.style.cursor = (hoverCard >= 0 || inRect(p, LAY.burstBtn) || inRect(p, LAY.endBtn) || inRect(p, LAY.testBtn) || inRect(p, LAY.resetBtn)) ? 'pointer' : 'default';
  });

  cv.addEventListener('mousedown', function (e) {
    const p = toDesign(e);
    if (showTest) {
      const close = { x: 250 + 780 - 150, y: 150 + 470 - 58, w: 118, h: 38 };
      if (inRect(p, close)) showTest = false;
      return;
    }
    if (run.over) {
      const again = { x: 340 + 120, y: 230 + 196, w: 160, h: 46 };
      const testBtn = { x: 340 + 320, y: 230 + 196, w: 160, h: 46 };
      if (inRect(p, again)) reset();
      else if (inRect(p, testBtn)) doTest();
      return;
    }
    if (inRect(p, LAY.burstBtn)) { actBurst(); return; }
    if (inRect(p, LAY.endBtn)) { actEnd(); return; }
    if (inRect(p, LAY.testBtn)) { doTest(); return; }
    if (inRect(p, LAY.resetBtn)) { reset(); return; }
    for (let i = run.hand.length - 1; i >= 0; i--) {
      if (inRect(p, cardRect(i))) { actCard(i, cardZone(i, p)); return; }
    }
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    if (showTest) { if (e.key === 'Escape') showTest = false; return; }
    if (run.over) return;
    if (e.key === ' ') { e.preventDefault(); actBurst(); return; }
    if (e.key === 'Enter') { actEnd(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= run.hand.length) {
      actCard(n - 1, e.shiftKey ? 'burn' : 'play');
    }
  });

  requestAnimationFrame(frame);
})();
</script>
